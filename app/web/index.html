function renderTree() {
  if (view !== "openings") return;
  const L = t(), X = tx(), d = rp.tree;
  const el = $id("treeBody");
  const chips = `<div class="chips">` + [["white", L.asWhite], ["black", L.asBlack]].map(([k, label]) =>
    `<button class="chip ${treeColor() === k ? "on" : ""}" data-color="${k}">${label}</button>`).join("") + `</div>`;
  if (!d) { el.innerHTML = chips + `<p class="muted">${esc(L.loading)}</p>`; return; }
  const crumbs = [`<button class="linkbtn" type="button" data-tkey="">${esc(X.treeStart)}</button>`].concat(
    (d.trail || []).map((s, i) => `<button class="linkbtn" type="button" data-tkey="${esc(s.key)}">${esc(i % 2 === 0 ? `${i / 2 + 1}.${s.san}` : s.san)}</button>`)).join(" › ");
  if (!d.games) { el.innerHTML = chips + `<p class="crumbs">${crumbs}</p><p class="muted">${esc(X.treeEmpty)}</p>`; return; }
  const own = d.own_to_move;
  const rows = d.moves.map((m) => {
    const scoreTone = m.score >= 55 ? "good" : m.score <= 45 ? "bad" : "";
    const accCell = own
      ? `<td class="num">${m.accuracy != null ? num(m.accuracy, 0) + "%" : "–"}</td>
         <td class="note">${m.errors ? `<span class="tag ${m.worst || "inaccuracy"}">${esc(X.treeErr(m.errors, m.better))}</span>` : ""}</td>`
      : `<td></td><td></td>`;
    const san = m.next_key
      ? `<button class="linkbtn" type="button" data-tkey="${esc(m.next_key)}">${esc(m.san)}</button>` : esc(m.san);
    return `<tr><td class="mv">${san}</td><td class="num">${m.games}</td>
      <td class="sc">${bar(m.score, 100, scoreTone || "")}<span>${num(m.score, 0, "%")}</span></td>${accCell}</tr>`;
  }).join("");
  const head = X.treeHead;
  el.innerHTML = chips + (color === "all" ? `<p class="muted">${esc(X.treeAllColor)}</p>` : "") +
    `<p class="crumbs">${crumbs}</p>
    <div class="tree">
      <div class="tree-board">${miniBoard({ fen: d.fen, orientation: d.color, last: d.last_move }, "tree")}
        <p class="muted">${esc(X.treeGames(d.games, num(d.score, 0, "%")))} · ${esc(own ? X.treeYour : X.treeTheir)}</p></div>
      <div class="tree-moves">${d.moves.length ? `<table class="tt"><thead><tr><th>${esc(head.move)}</th><th class="num">${esc(head.games)}</th><th>${esc(head.score)}</th>
        <th class="num">${own ? esc(head.acc) : ""}</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : `<p class="muted">${esc(X.treeEnd)}</p>`}</div>
    </div>`;
}

// --------------------------------------------------------------------------
// Eroeffnungs-Drill: Stellung aus einem wiederkehrenden Fehler, finde den
// besseren Zug. Geprueft vom Server mit Stockfish - jeder Zug, der hoechstens
// ein paar Punkte schlechter ist als der beste, zaehlt.
// --------------------------------------------------------------------------
const dr = { items: [], idx: 0, board: null, sel: null, state: "idle", res: null, first: true, solved: 0, marks: {} };

function startDrill(ids) {
  const all = (rp.leaks && rp.leaks.leaks) || [];
  dr.items = ids ? all.filter((l) => ids.includes(l.id)) : all.slice();
  dr.idx = 0; dr.solved = 0;
  if (!dr.items.length) return;
  openDrill();
  const box = $id("drillBox");
  if (box) box.scrollIntoView({ behavior: "smooth", block: "start" });
}
function openDrill() {
  const l = dr.items[dr.idx];
  dr.board = fenBoard(l.fen); dr.sel = null; dr.state = "move"; dr.res = null; dr.first = true; dr.marks = {};
  renderDrill();
}
function renderDrill() {
  const box = $id("drillBox");
  if (!box) return;
  if (dr.state === "idle" || !dr.items.length) { box.innerHTML = ""; return; }
  const X = tx(), L = t();
  if (dr.state === "finished") {
    box.innerHTML = `<div class="drill"><p class="tac-msg good">${esc(X.drillDone(dr.solved, dr.items.length))}</p>
      <div class="tac-actions"><button class="btn" type="button" data-dclose="1">${esc(X.drillClose)}</button></div></div>`;
    return;
  }
  const l = dr.items[dr.idx];
  const white = l.color === "white";
  const dests = new Set(dr.sel == null ? [] : l.legal.filter((u) => u.startsWith(sqName(dr.sel))).map((u) => sqIndex(u.slice(2, 4))));
  const last = l.last_move ? [sqIndex(l.last_move.slice(0, 2)), sqIndex(l.last_move.slice(2, 4))] : [];
  let html = "";
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const rank = white ? 7 - r : r, file = white ? c : 7 - c, i = rank * 8 + file;
    const cls = ["sq", (rank + file) % 2 ? "l" : "d"];
    if (last.includes(i) && dr.state === "move") cls.push("last");
    if (dr.sel === i) cls.push("sel");
    if (dests.has(i)) cls.push("dest", dr.board[i] ? "occ" : "");
    if (dr.marks[i]) cls.push(dr.marks[i]);
    const p = dr.board[i];
    const piece = p ? `<span class="pc ${p === p.toUpperCase() ? "w" : "b"}">${GLYPH[p.toLowerCase()]}︎</span>` : "";
    const coords = (c === 0 ? `<span class="coord r">${rank + 1}</span>` : "") + (r === 7 ? `<span class="coord f">${FILES[file]}</span>` : "");
    html += `<div class="${cls.join(" ")}" data-di="${i}">${coords}${piece}</div>`;
  }
  let msg = "", cls = "";
  const res = dr.res;
  if (dr.state === "busy") msg = esc(X.drillThinking);
  else if (dr.state === "move") msg = X.drillAsk(esc(sideName(l.color)), esc(l.san));
  else if (res && res.error) { msg = esc(res.error); cls = "bad"; }
  else if (res && res.result === "good") {
    cls = "good";
    msg = res.best_san && res.best_san !== res.san ? X.drillGoodAlt(esc(res.san), esc(res.best_san)) : X.drillGood(esc(res.san));
  } else if (res) {
    cls = "bad";
    msg = (res.san === l.san ? X.drillSame(esc(res.san)) + " " : "") + X.drillBad(esc(res.san), res.reply_san ? esc(res.reply_san) : "", esc(res.best_san || l.best_san || "?"));
  }
  const actions = dr.state === "result"
    ? (res && res.result === "good"
        ? `<button class="btn primary grow" type="button" data-dnext="1">${esc(X.drillNext)}</button>`
        : `<button class="btn" type="button" data-dretry="1">${esc(X.drillRetry)}</button><button class="btn primary grow" type="button" data-dnext="1">${esc(X.drillNext)}</button>`)
    : "";
  box.innerHTML = `<div class="drill">
    <div class="tac-meta"><strong>${esc(X.drillTitle(dr.idx + 1, dr.items.length))}</strong>
      <span class="muted">${esc(l.path_text)}</span>
      <button class="linkbtn" type="button" data-dclose="1">${esc(X.drillClose)}</button></div>
    <div class="board-wrap"><div class="board" id="drillBoard">${html}</div></div>
    <p class="tac-msg ${cls}">${msg}</p>
    <div class="tac-actions">${actions}</div>
  </div>`;
}

async function drillMove(from, to) {
  const l = dr.items[dr.idx];
  let uci = sqName(from) + sqName(to);
  if (!l.legal.includes(uci)) {
    if (l.legal.includes(uci + "q")) uci += "q";
    else return;
  }
  dr.board = applyUci(dr.board, uci);
  dr.sel = null; dr.state = "busy"; dr.marks = {};
  renderDrill();
  let res;
  try {
    res = await apiJson("repertoire/check", { fen: l.fen, uci });
  } catch (err) {
    const msg = String(err.message || err);
    res = { error: msg.includes("no_engine") ? tx().drillNoEngine : tx().drillErr(msg) };
  }
  dr.res = res; dr.state = "result";
  if (!res.error) {
    const ok = res.result === "good";
    dr.marks[sqIndex(uci.slice(0, 2))] = ok ? "good" : "bad";
    dr.marks[sqIndex(uci.slice(2, 4))] = ok ? "good" : "bad";
    if (!ok && res.best_uci) {
      dr.marks[sqIndex(res.best_uci.slice(0, 2))] = dr.marks[sqIndex(res.best_uci.slice(0, 2))] || "good";
      dr.marks[sqIndex(res.best_uci.slice(2, 4))] = "good";
    }
    if (dr.first) {
      if (ok) dr.solved += 1;
      drillStore.set(l.id, ok);
    }
    dr.first = false;
  }
  renderDrill();
  renderLeaks();
}

document.addEventListener("click", (e) => {
  const sq = e.target.closest("[data-di]");
  if (sq && dr.state === "move") {
    const i = Number(sq.dataset.di), l = dr.items[dr.idx];
    const p = dr.board[i];
    const mine = p && ((p === p.toUpperCase()) === (l.color === "white"));
    if (dr.sel != null && dr.sel !== i && l.legal.some((u) => u.startsWith(sqName(dr.sel) + sqName(i)))) { drillMove(dr.sel, i); return; }
    dr.sel = mine && dr.sel !== i ? i : null;
    renderDrill();
    return;
  }
  const el = e.target.closest("[data-ompick],[data-omboard],[data-ominacc],[data-omsort],[data-ommore],[data-game],[data-gmore],[data-report],[data-lboard],[data-ldrill],[data-ltree],[data-tkey],[data-dnext],[data-dretry],[data-dclose],#drillAllBtn");
  if (!el) return;
  if (el.id === "drillAllBtn") { startDrill(null); return; }
  const ds = el.dataset;
  if ("ompick" in ds) { om.pick = ds.ompick && om.pick !== ds.ompick ? ds.ompick : null; om.shown = 15; renderOpeningMistakes(); return; }
  if (ds.omboard) { om.open.has(ds.omboard) ? om.open.delete(ds.omboard) : om.open.add(ds.omboard); renderOpeningMistakes(); return; }
  if ("ominacc" in ds) { om.inacc = ds.ominacc === "1"; renderOpeningsView(); return; }
  if (ds.omsort) { om.sort = ds.omsort; renderOpeningMistakes(); return; }
  if (ds.ommore) { om.shown += 15; renderOpeningMistakes(); return; }
  if (ds.game) { loadReport(Number(ds.game), true); return; }
  if (ds.gmore) { loadGameList(true); return; }
  if (ds.report) { e.preventDefault(); gv.sel = Number(ds.report); gv.reportFor = null; setView("games"); loadReport(gv.sel); window.scrollTo(0, 0); return; }
  if (ds.lboard) { rp.open.has(ds.lboard) ? rp.open.delete(ds.lboard) : rp.open.add(ds.lboard); renderLeaks(); return; }
  if (ds.ldrill) { startDrill([ds.ldrill]); return; }
  if (ds.ltree) {
    const l = ((rp.leaks && rp.leaks.leaks) || []).find((x) => x.id === ds.ltree);
    if (!l) return;
    if (treeColor() !== l.color) { color = l.color; rp.treeSig = filterSig(treeColor()); renderFilters(); loadAll(); }
    loadTree(l.key);
    $id("treeCard").scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  if ("tkey" in ds) { loadTree(ds.tkey || null); return; }
  if (ds.dnext) { dr.idx += 1; if (dr.idx >= dr.items.length) { dr.state = "finished"; renderDrill(); } else openDrill(); return; }
  if (ds.dretry) { const keep = dr.first; openDrill(); dr.first = keep; return; }
  if (ds.dclose) { dr.state = "idle"; dr.items = []; renderDrill(); return; }
});

const tc = () => I18N_C[lang];
const POINT_INDEX = { threat: 1, chance: 2, safe: 3, reply: 4 };

// Zustand der Session und des einen Bretts.
const co = { data: null, error: null, poll: null, stage: null, idx: 0, ex: null, cv: null, boards: new Map() };
const bd = { board: null, white: true, legal: [], sel: null, last: null, marks: {}, hl: [], arrows: [], mover: "white", active: false, onMove: null };
// Alte Namen, die der Rest der Seite benutzt.
const tac = { get data() { return co.data; }, get pos() { return co.ex; } };

function loadTactics(keep = false) { return loadCoach(keep); }

async function loadCoach(keep = false) {
  clearTimeout(co.poll);
  let d;
  try {
    d = await api("coach/today?day=" + localDay());
    co.error = null;
  } catch (err) {
    co.error = err.message;
    renderTabs();
    if (view === "train") renderTraining();
    return;
  }
  const prevKey = keep && co.ex ? co.ex.item.key : null;
  const newDay = !co.data || co.data.day !== d.day;
  co.data = d;
  renderTabs();
  if (!d.items.length) {
    co.stage = null; co.ex = null;
    if (d.preparing) co.poll = setTimeout(() => loadCoach(), 4000);
    if (view === "train") renderTraining();
    return;
  }
  if (prevKey && !newDay) {
    // Die laufende Aufgabe behalten, nur Zaehler auffrischen.
    const item = d.items.find((i) => i.key === prevKey);
    if (item && co.ex) { co.ex.item = item; }
    if (view === "train") renderTraining();
    return;
  }
  co.stage = pickStage(d);
  co.ex = null; co.cv = null;
  if (co.stage === "exercise") co.idx = firstOpen(d);
  if (view === "train") renderTraining();
}

function firstOpen(d) {
  const i = d.items.findIndex((it) => !it.result);
  return i < 0 ? 0 : i;
}

function pickStage(d) {
  if (!d.lesson_seen && d.lesson && d.lesson.focus) return "lesson";
  if (d.items.some((it) => !it.result)) return "exercise";
  if (d.convert && !d.convert.result) return "convert";
  return "done";
}

function setStage(s) {
  co.stage = s;
  co.ex = null; co.cv = null;
  cancelDrag();
  if (s === "exercise") co.idx = firstOpen(co.data);
  renderTraining();
}

// Alles im Training neu zeichnen - nach Sprachwechsel oder Reiterwechsel.
function renderTraining() {
  const L = tc(), d = co.data;
  $id("coTitle").textContent = L.title;
  $id("coIntro").textContent = L.intro;
  $id("coIntro").hidden = !!(d && d.items.length && co.stage && co.stage !== "lesson");
  renderRail();
  renderHead();
  const body = $id("coBody");
  if (co.error) { body.innerHTML = `<div class="note err">${esc(co.error)}</div>`; return; }
  if (!d) { body.innerHTML = `<div class="tac-empty">${esc(L.loading)}</div>`; return; }
  if (!d.items.length) {
    let html;
    if (d.problem === "disabled") html = esc(L.disabled);
    else if (d.problem === "no_engine") html = esc(L.noEngine);
    else if (d.preparing) html = `${esc(L.preparing)}<br><span class="muted">${esc(L.preparingSub)}</span>`;
    else if (d.problem === "failed") html = esc(L.failed(d.error || ""));
    else html = esc(L.none);
    body.innerHTML = `<div class="tac-empty">${html}</div>`;
    return;
  }
  if (!co.stage) co.stage = pickStage(d);
  if (co.stage === "lesson") renderLesson();
  else if (co.stage === "exercise") renderExercise();
  else if (co.stage === "convert") renderConvert();
  else renderDone();
}

function renderHead() {
  const L = tc(), d = co.data;
  const el = $id("coHead");
  if (!d || !d.items.length) { el.textContent = ""; return; }
  const done = d.items.filter((i) => i.result).length;
  el.textContent = L.head(done, d.items.length, d.stats ? d.stats.streak : 0);
}

function renderRail() {
  const L = tc(), d = co.data, el = $id("coRail");
  if (!d || !d.items.length) { el.innerHTML = ""; return; }
  const done = d.items.filter((i) => i.result).length;
  const steps = [];
  if (d.lesson && d.lesson.focus) steps.push({ id: "lesson", label: L.rail.lesson, done: d.lesson_seen });
  steps.push({ id: "exercise", label: L.rail.ex(done, d.items.length), done: done === d.items.length });
  if (d.convert) steps.push({ id: "convert", label: L.rail.convert, done: !!d.convert.result });
  steps.push({ id: "done", label: L.rail.done, done: d.finished });
  el.innerHTML = steps.map((s, i) =>
    `<button type="button" data-stage="${s.id}" class="${co.stage === s.id ? "on" : ""} ${s.done ? "done" : ""}"><span class="n">${s.done ? "✓" : i + 1}</span>${esc(s.label)}</button>`).join("");
}

// --------------------------------------------------------------------------
// Das Brett: ein einziges, mit Pfeilen darueber
// --------------------------------------------------------------------------
function boardHtml() {
  return `<div class="board-wrap"><div class="board" id="board" aria-label="Chessboard"></div><svg class="board-ar" id="boardAr" viewBox="0 0 800 800"></svg></div>`;
}

function drawBoard() {
  const el = $id("board"), ar = $id("boardAr");
  if (!el || !bd.board) return;
  const white = bd.white;
  const dests = new Set(bd.sel == null ? [] : bd.legal.filter((u) => u.startsWith(sqName(bd.sel))).map((u) => sqIndex(u.slice(2, 4))));
  let html = "";
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const rank = white ? 7 - r : r, file = white ? c : 7 - c, i = rank * 8 + file;
      const cls = ["sq", (rank + file) % 2 ? "l" : "d"];
      if (bd.last && bd.last.includes(i)) cls.push("last");
      if (bd.sel === i) cls.push("sel");
      if (dests.has(i)) cls.push("dest", bd.board[i] ? "occ" : "");
      if (bd.marks[i]) cls.push(bd.marks[i]);
      if (bd.hl.includes(i)) cls.push("hl");
      const p = bd.board[i];
      const piece = p ? `<span class="pc ${p === p.toUpperCase() ? "w" : "b"}">${GLYPH[p.toLowerCase()]}︎</span>` : "";
      const coords = (c === 0 ? `<span class="coord r">${rank + 1}</span>` : "") + (r === 7 ? `<span class="coord f">${FILES[file]}</span>` : "");
      html += `<div class="${cls.join(" ")}" data-i="${i}">${coords}${piece}</div>`;
    }
  }
  el.innerHTML = html;
  if (ar) ar.innerHTML = bd.arrows.map((a) => arrow(a.uci, a.cls, white)).join("");
}

function setBoard(fen, opts = {}) {
  bd.board = fenBoard(fen);
  bd.white = opts.white !== false;
  bd.legal = opts.legal || [];
  bd.sel = null;
  bd.last = opts.last ? moveSquares(opts.last) : null;
  bd.marks = {};
  bd.hl = [];
  bd.arrows = opts.arrows || [];
  bd.mover = opts.mover || (fen.split(" ")[1] === "b" ? "black" : "white");
  bd.active = !!opts.active;
  bd.onMove = opts.onMove || null;
}

function ownPiece(p) {
  if (!p) return false;
  return (bd.mover === "white") === (p === p.toUpperCase());
}
function isDest(from, to) {
  const base = sqName(from) + sqName(to);
  return bd.legal.some((u) => u.startsWith(base));
}
function pickUci(from, to) {
  const base = sqName(from) + sqName(to);
  const cands = bd.legal.filter((u) => u.startsWith(base));
  if (!cands.length) return null;
  // Umwandlung: Dame. Eine Unterverwandlung als Loesung ist selten, und wenn
  // die Dame genauso gewinnt, zaehlt sie ohnehin.
  return cands.find((u) => u.length === 4 || u[4] === "q") || cands[0];
}
function userMove(from, to) {
  const uci = pickUci(from, to);
  if (!uci || !bd.active || !bd.onMove) return;
  bd.sel = null;
  bd.active = false;
  bd.onMove(uci, from, to);
}
function markMove(uci, cls) {
  if (!uci) return;
  bd.marks[sqIndex(uci.slice(0, 2))] = cls;
  bd.marks[sqIndex(uci.slice(2, 4))] = cls;
}
async function animate(uciList, delay = 650) {
  for (const u of uciList) {
    bd.board = applyUci(bd.board, u);
    bd.last = moveSquares(u);
    drawBoard();
    await sleep(delay);
  }
}

// Ziehen und Tippen. Tippen: Figur, dann Zielfeld. Ziehen: Figur festhalten
// und auf das Zielfeld fallen lassen. Der Zeiger wird am Brett-Element
// festgehalten (setPointerCapture); das Element bleibt beim Neuzeichnen
// bestehen - nur sein Inhalt wechselt.
let drag = null;
function cancelDrag() {
  if (drag) {
    const b = $id("board");
    if (b && drag.pointerId != null && b.hasPointerCapture && b.hasPointerCapture(drag.pointerId)) {
      try { b.releasePointerCapture(drag.pointerId); } catch { /* egal */ }
    }
  }
  drag = null;
  document.querySelectorAll(".drag-ghost").forEach((g) => g.remove());
  document.querySelectorAll("#board .sq.dragging").forEach((q) => q.classList.remove("dragging"));
}
function sqFromPoint(x, y) {
  const el = document.elementFromPoint(x, y);
  const s = el && el.closest ? el.closest(".sq") : null;
  return s && s.closest("#board") ? Number(s.dataset.i) : null;
}
$id("coBody").addEventListener("pointerdown", (e) => {
  const boardEl = e.target.closest("#board");
  if (!boardEl) return;
  cancelDrag();
  if (e.button != null && e.button > 0) return;
  const s = e.target.closest(".sq");
  if (!s || !bd.active) return;
  const i = Number(s.dataset.i);
  if (bd.sel != null && bd.sel !== i && isDest(bd.sel, i)) { e.preventDefault(); userMove(bd.sel, i); return; }
  if (!ownPiece(bd.board[i])) { if (bd.sel != null) { bd.sel = null; drawBoard(); } return; }
  e.preventDefault();
  try { boardEl.setPointerCapture(e.pointerId); } catch { /* egal */ }
  const wasSel = bd.sel === i;
  bd.sel = i;
  drawBoard();
  const size = boardEl.clientWidth / 8;
  const src = boardEl.querySelector(`.sq[data-i="${i}"] .pc`);
  if (!src) return;
  const ghost = src.cloneNode(true);
  ghost.classList.add("drag-ghost");
  ghost.style.fontSize = `${size * 0.9}px`;
  ghost.style.display = "none";
  document.body.appendChild(ghost);
  drag = { from: i, ghost, moved: false, x0: e.clientX, y0: e.clientY, wasSel, pointerId: e.pointerId };
});
$id("coBody").addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.pointerId) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
  if (!drag.moved) {
    drag.moved = true;
    drag.ghost.style.display = "";
    const sq = document.querySelector(`#board .sq[data-i="${drag.from}"]`);
    if (sq) sq.classList.add("dragging");
  }
  drag.ghost.style.left = `${e.clientX}px`;
  drag.ghost.style.top = `${e.clientY}px`;
});
function endDrag(e, cancel) {
  if (!drag || (e && e.pointerId !== drag.pointerId)) return;
  const d = drag;
  const to = !cancel && d.moved && e ? sqFromPoint(e.clientX, e.clientY) : null;
  cancelDrag();
  if (d.moved) {
    if (to != null && to !== d.from && isDest(d.from, to) && bd.active) { userMove(d.from, to); return; }
    drawBoard();
  } else if (d.wasSel) {
    bd.sel = null;
    drawBoard();
  }
}
$id("coBody").addEventListener("pointerup", (e) => endDrag(e, false));
$id("coBody").addEventListener("pointercancel", (e) => endDrag(e, true));
$id("coBody").addEventListener("lostpointercapture", (e) => { if (drag && e.pointerId === drag.pointerId) endDrag(e, true); });
window.addEventListener("blur", () => { if (drag) { cancelDrag(); drawBoard(); } });

// Handy aus der Tasche: nach laengerer Pause oder an einem neuen Tag frische
// Aufgaben holen - aber nie mitten in einen Zug hinein.
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); if (drag) cancelDrag(); return; }
  const newDay = co.data && co.data.day !== localDay();
  const busy = co.ex && co.ex.phase === "busy";
  if ((newDay || Date.now() - hiddenAt > 10 * 60 * 1000) && !busy) loadCoach(!newDay);
});

// --------------------------------------------------------------------------
// Lektion
// --------------------------------------------------------------------------
function pointQ(point) {
  const S = tj().steps[point];
  return S ? S.q : "";
}
function pointBadge(point, small = false) {
  const L = tc();
  if (!point) return `<span class="co-point muted">${esc(t().errors.positional)}</span>`;
  return `<span class="co-point">${esc(L.question(POINT_INDEX[point], pointQ(point)))}</span>`;
}

function renderLesson() {
  const L = tc(), d = co.data, ls = d.lesson;
  const body = $id("coBody");
  if (!ls || !ls.focus) {
    body.innerHTML = `<p class="muted">${esc(L.lesson.noFocus)}</p>
      <div class="tac-actions"><button type="button" class="btn primary" data-co="lessonDone">${esc(L.lesson.start)}</button></div>`;

  const allBars = Object.entries(ls.points).map(([k, v]) =>

  const examples = (ls.examples || []).map((e, i) =>
    `<div class="item">
      <div data-lb="${e.move_id}" class="co-lb">${co.boards.get(e.move_id) ? lessonBoard(e.move_id) : `<p class="muted">${esc(L.loading)}</p>`}</div>
      <p><strong>${e.move_number}. ${esc(e.san)}</strong> · ${esc(t().errors[e.error_type] || "")}</p>
      <p class="muted">${esc(L.lesson.exLine(e.opponent || "?", date(e.played_at), e.san))}</p>
      ${e.best_san ? `<p>${esc(L.lesson.exBest(e.best_san))}${e.refutation_san ? ` · ${esc(L.lesson.exReply(e.refutation_san))}` : ""}</p>` : ""}
    </div>`).join("");
  body.innerHTML = `<div class="co-lesson">
    <span class="co-point">${esc(L.lesson.kicker)}</span>
    <div class="q">${esc(L.question(POINT_INDEX[point], S.q))}</div>
    <p class="how">${esc(S.how)}</p>
    <p>${esc(T.what)}</p>
    <h3>${esc(L.lesson.yourNumbers(ls.games, ls.days))}</h3>
    <div class="co-nums">
      <div class="t"><b>${ls.serious}</b><span>${esc(L.lesson.serious)}</span></div>
      <div class="t"><b>${n}</b><span>${esc(L.lesson.would)}</span></div>
      <div class="t"><b>${ls.focus_lost_games}</b><span>${esc(L.lesson.lost)}</span></div>
    </div>
    <div class="co-bars">${allBars}</div>
    ${types.length ? `<h3>${esc(L.lesson.byType)}</h3><div class="co-bars">${bars}</div>` : ""}
    <h3>${esc(L.lesson.routine)}</h3>
    ${T.steps.map((s, i) => `<div class="co-tip"><b>${i + 1}.</b> ${esc(s)}</div>`).join("")}
    ${examples ? `<h3>${esc(L.lesson.examples)}</h3><div class="co-ex">${examples}</div>` : ""}
    <div class="tac-actions" style="margin-top:14px">
      <button type="button" class="btn primary grow" data-co="lessonDone">${esc(L.lesson.start)}</button>

  (ls.examples || []).forEach((e) => { if (!co.boards.has(e.move_id)) loadLessonBoard(e.move_id); });
}

function lessonBoard(id) {
  const d = co.boards.get(id);
  if (!d || d === "loading") return `<p class="muted">${esc(tc().loading)}</p>`;
  if (d === "error" || !d.consistent) return "";
  return miniBoard(d, "co" + id);
}
async function loadLessonBoard(id) {
  co.boards.set(id, "loading");
  try { co.boards.set(id, await api(`moves/${id}/board`)); } catch { co.boards.set(id, "error"); }
  document.querySelectorAll(`[data-lb="${id}"]`).forEach((el) => { el.innerHTML = lessonBoard(id); });
}

async function lessonDone() {
  const d = co.data;
  if (d.lesson && d.lesson.focus && !d.lesson_seen) {
    d.lesson_seen = true;
    apiJson("coach/lesson", { day: d.day }).catch(() => {});
  }
  setStage("exercise");
}

// --------------------------------------------------------------------------
// Aufgaben: Schritt 1 seine Antwort, Schritt 2 dein Zug, Schritt 3 verstehen
// --------------------------------------------------------------------------
function openExercise(i, keep = false) {
  const d = co.data, item = d.items[i];
  if (!item) return;
  co.idx = i;
  cancelDrag();
  const ex = item.exercise;
  const hasStep1 = !!ex.refute && !item.result && !item.refute_result;
  co.ex = { item, step: item.result ? 3 : (hasStep1 ? 1 : 2), phase: "solve", msg: "", msgCls: "", moves: [],
            tries: 0, hint: false, explain: item.explain || null, done: !!item.result, busy: false };
  if (co.ex.step === 1) startStep1();
  else if (co.ex.step === 2) startStep2();
  else startStep3();
}

function exMeta() {
  const L = tc(), E = co.ex, d = co.data, ex = E.item.exercise;
  const tag = ex.habit ? `<span class="tag mistake">${esc(L.ex.habit)}</span>` :
    (ex.review ? `<span class="tag">${esc(L.ex.review(ex.box))}</span>` : `<span class="tag accent">${esc(L.ex.fresh)}</span>`);
  const steps = L.ex.steps.map((s, i) => {
    const n = i + 1;
    if (n === 1 && !ex.refute && !E.item.refute_result) return "";
    const cls = n === E.step ? "on" : (n < E.step ? "ok" : "");
    return `<span class="${cls}">${n < E.step ? "✓ " : ""}${esc(s)}</span>`;
  }).join("");
  return `<div class="co-meta"><span>${esc(L.ex.counter(co.idx + 1, d.items.length))} · ${tag}</span>${pointBadge(ex.point)}</div>
    <div class="co-steps">${steps}</div>`;
}

function exShell(ask) {
  $id("coBody").innerHTML = `${exMeta()}
    <div class="co-ask" id="coAsk">${ask}</div>
    ${boardHtml()}
    <div class="tac-msg" id="coMsg"></div>
    <div class="tac-actions" id="coActions"></div>
    <div id="coExplain"></div>`;
  renderDots();
}

function renderDots() {
  const d = co.data;
  const dots = d.items.map((it, i) => {
    const cls = it.result === "solved" ? "solved" : it.result === "failed" ? "failed" : "";
    return `<button type="button" class="tac-dot ${cls} ${i === co.idx && co.stage === "exercise" ? "cur" : ""}" data-exi="${i}">${it.result === "solved" ? "✓" : it.result === "failed" ? "✗" : i + 1}</button>`;
  }).join("");
  const el = $id("coDots") || (() => { const e = document.createElement("div"); e.className = "tac-dots"; e.id = "coDots"; $id("coBody").prepend(e); return e; })();
  el.innerHTML = dots;
}

function setMsg(html, cls = "") {
  if (!co.ex) return;
  co.ex.msg = html; co.ex.msgCls = cls;
  const el = $id("coMsg");
  if (el) { el.innerHTML = html; el.className = "tac-msg " + cls; }
}
function setActions(html) { const el = $id("coActions"); if (el) el.innerHTML = html; }

function gameInfo(ex) {
  const g = ex.game || {};
  return { opp: g.opponent || "?", d: g.played_at ? date(g.played_at) : "", url: g.url };
}

// --- Schritt 1 -------------------------------------------------------------
function startStep1() {
  const L = tc(), E = co.ex, ex = E.item.exercise, g = gameInfo(ex);
  E.step = 1; E.phase = "solve"; E.tries = 0;
  const him = tc().side(ex.refute.to_move);
  exShell(L.ex.ask1(esc(g.opp), esc(g.d), esc(ex.played_san), him));
  setBoard(ex.refute.fen, { white: ex.orientation !== "black", legal: ex.refute.legal, last: ex.played_uci,
                            mover: ex.refute.to_move, active: true, onMove: step1Move });
  drawBoard();
  setActions(`<button type="button" class="btn" data-co="show1">${esc(L.ex.show1)}</button>
    <span class="grow"></span><button type="button" class="btn" data-co="skip1">${esc(L.ex.skip1)}</button>`);
}

async function step1Move(uci) {
  const L = tc(), E = co.ex, ex = E.item.exercise;
  if (!E || E.step !== 1) return;
  const before = bd.board.slice(), beforeLast = bd.last;
  bd.board = applyUci(bd.board, uci); bd.last = moveSquares(uci);
  drawBoard();
  E.phase = "busy";
  setMsg(`<span class="muted">${esc(L.ex.thinking)}</span>`);
  let res;
  try {
    res = await apiJson("coach/refute", { day: co.data.day, key: E.item.key, uci });
  } catch (err) {
    bd.board = before; bd.last = beforeLast; bd.active = true; E.phase = "solve"; drawBoard();
    setMsg(esc(err.message), "bad");
    return;
  }
  if (co.ex !== E) return;
  if (res.counted) E.item.refute_result = res.result;
  if (res.result === "good") {
    markMove(uci, "good"); drawBoard();
    const facts = factsHtml(res.facts, "reply");
    setMsg((res.alternative ? L.ex.alt1(esc(res.san), esc(res.punish_san)) : L.ex.good1(esc(res.san))) + facts, "good");
    E.phase = "done1";
    setActions(`<button type="button" class="btn primary grow" data-co="toStep2">${esc(L.ex.toStep2)}</button>`);
    return;
  }
  E.tries += 1;
  markMove(uci, "bad"); drawBoard();
  if (E.tries >= 2) {
    setMsg(L.ex.bad1b(esc(res.san)), "bad");
    await sleep(900);
    if (co.ex !== E) return;
    await revealStep1(before, beforeLast, null);
    return;
  }
  setMsg(L.ex.bad1(esc(res.san)), "bad");
  await sleep(1100);
  if (co.ex !== E) return;
  bd.board = before; bd.last = beforeLast; bd.marks = {}; bd.active = true; E.phase = "solve";
  drawBoard();
}

async function revealStep1(board, last, known) {
  const L = tc(), E = co.ex;
  E.phase = "busy"; bd.active = false;
  let res = known;
  if (!res || !res.punish_uci) {
    try { res = await apiJson("coach/refute", { day: co.data.day, key: E.item.key, reveal: true }); }
    catch (err) { setMsg(esc(err.message), "bad"); bd.active = true; E.phase = "solve"; return; }
    if (res.counted) E.item.refute_result = "revealed";
  }
  if (co.ex !== E) return;
  bd.board = board.slice(); bd.last = last; bd.marks = {}; drawBoard();
  await sleep(350);
  if (co.ex !== E) return;
  await animate([res.punish_uci], 0);
  markMove(res.punish_uci, "good"); drawBoard();
  setMsg(L.ex.revealed1(esc(res.punish_san)) + factsHtml(res.facts || [], "reply"), "");
  E.phase = "done1";
  setActions(`<button type="button" class="btn primary grow" data-co="toStep2">${esc(L.ex.toStep2)}</button>`);
}

// --- Schritt 2 (wie die Tagesaufgaben: der Server kennt die Loesung) --------
function startStep2(practice = false) {
  const L = tc(), E = co.ex, ex = E.item.exercise;
  E.step = 2; E.phase = "solve"; E.moves = []; E.hint = false;
  const ask = ex.open ? L.ex.ask2open(esc(ex.played_san)) :
    (ex.refute || E.item.refute_result ? L.ex.ask2(esc(ex.played_san)) : L.ex.noStep1(esc(ex.played_san))) +
    (ex.moves_to_find > 1 ? L.ex.ask2line(ex.moves_to_find) : "");
  exShell(ask);
  setBoard(ex.fen, { white: ex.orientation !== "black", legal: ex.legal, last: ex.last_move, mover: ex.to_move,
                     active: true, onMove: step2Move });
  drawBoard();
  if (practice) setMsg(esc(L.ex.practice));
  else if (E.item.result) setMsg(esc(E.item.result === "solved" ? L.ex.alreadySolved : L.ex.alreadyFailed), E.item.result === "solved" ? "good" : "bad");
  step2Actions();
}
function step2Actions() {
  const L = tc(), E = co.ex;
  const busy = E.phase === "busy";
  setActions(`<button type="button" class="btn" data-co="hint" ${busy || E.hint ? "disabled" : ""}>${esc(L.ex.hint)}</button>
    <button type="button" class="btn" data-co="reveal" ${busy ? "disabled" : ""}>${esc(L.ex.reveal)}</button>` +
    (E.item.result ? `<span class="grow"></span><button type="button" class="btn" data-co="next" ${busy ? "disabled" : ""}>${esc(L.ex.next)}</button>` : ""));
}
function hintText(ex) {
  const L = tr(), h = ex.hint || {};
  if (ex.habit) return tx().habitHint;
  if (h.mate_in) return L.hintMate(h.mate_in);
  if (h.missed_motif && L.motif[h.missed_motif]) return L.hintMotif(L.motif[h.missed_motif]);
  return L.errHint[h.error_type] ? `${L.hintWord} ${L.errHint[h.error_type]}` : L.hintDefault;
}

async function step2Move(uci) {
  const L = tc(), E = co.ex;
  if (!E || E.step !== 2) return;
  const step = { board: bd.board.slice(), last: bd.last, legal: bd.legal.slice(), moves: E.moves.slice() };
  bd.board = applyUci(bd.board, uci); bd.last = moveSquares(uci);
  E.phase = "busy"; drawBoard(); setMsg(""); step2Actions();
  let res;
  try {
    res = await apiJson("tactics/move", { day: co.data.day, key: E.item.key, moves: [...E.moves, uci] });
  } catch (err) {
    bd.board = step.board; bd.last = step.last; bd.active = true; E.phase = "solve"; drawBoard(); step2Actions();
    toast(err.message);
    return;
  }
  if (co.ex !== E) return;
  if (res.result === "correct") {
    E.moves.push(uci, res.reply);
    setMsg(esc(L.ex.correct(res.san)), "good");
    await sleep(420);
    if (co.ex !== E) return;
    bd.board = applyUci(bd.board, res.reply); bd.last = moveSquares(res.reply); bd.legal = res.legal;
    bd.active = true; E.phase = "solve"; drawBoard();
    setMsg(esc(L.ex.correctReply(res.san, res.reply_san)), "good");
    step2Actions();
  } else if (res.result === "solved") {
    E.moves.push(uci);
    markMove(uci, "good"); drawBoard();
    finishStep2(res, E.item.exercise.open ? L.ex.holds(res.san) : (res.alternative ? L.ex.alt(res.san, res.main_san) : L.ex.solved(res.san)));
  } else {
    markMove(uci, "bad"); drawBoard();
    if (res.counted && !E.item.result) { E.item.result = "failed"; renderDots(); renderRail(); renderHead(); renderTabs(); }
    const txt = esc(L.ex.wrong(res.san) + (res.punish_san ? L.ex.punish(res.punish_san) : ""));
    setMsg(txt, "bad");
    if (res.punish) {
      await sleep(450);
      if (co.ex !== E) return;
      bd.board = applyUci(bd.board, res.punish); bd.last = moveSquares(res.punish); drawBoard();
    }
    await sleep(900);
    if (co.ex !== E) return;
    bd.board = step.board; bd.last = step.last; bd.legal = step.legal; bd.marks = {}; E.moves = step.moves;
    bd.active = true; E.phase = "solve"; drawBoard();
    setMsg(txt + esc(L.ex.tryAgain), "bad");
    step2Actions();
  }
}

function nextText(box, due) {
  const L = tc();
  if (box >= 6) return L.ex.learned;
  return due ? L.ex.comesBack(date(due)) : "";
}

async function finishStep2(res, text) {
  const L = tc(), E = co.ex;
  if (res.counted) E.item.result = "solved";
  if (res.explain) E.item.explain = res.explain;
  let txt = text;
  if (res.counted) txt += " " + nextText(res.box, res.due);
  else if (E.item.result === "failed") txt += L.ex.stillFailed;
  setMsg(esc(txt), "good");
  E.phase = "done";
  renderDots(); renderRail(); renderHead(); renderTabs();
  if (res.day_complete) toast(L.done.allDone);
  refreshStats();
  await sleep(700);
  if (co.ex !== E) return;
  startStep3();
}

async function revealStep2() {
  const L = tc(), E = co.ex;
  E.phase = "busy"; bd.active = false; step2Actions();
  let res;
  try { res = await apiJson("tactics/reveal", { day: co.data.day, key: E.item.key }); }
  catch (err) { E.phase = "solve"; bd.active = true; step2Actions(); toast(err.message); return; }
  if (co.ex !== E) return;
  if (!E.item.result) E.item.result = "failed";
  E.item.explain = res.explain;
  renderDots(); renderRail(); renderHead(); renderTabs();
  setMsg(esc(L.ex.howItGoes));
  setActions("");
  setBoard(E.item.exercise.fen, { white: E.item.exercise.orientation !== "black", last: E.item.exercise.last_move });
  drawBoard();
  await sleep(350);
  if (co.ex !== E) return;
  await animate(res.explain.solution, 750);
  if (co.ex !== E) return;
  setMsg(esc(L.ex.solution(res.explain.solution_san) + (res.counted ? nextText(res.box, res.due) : "")));
  if (res.day_complete) toast(L.done.allDone);
  refreshStats();
  await sleep(500);
  if (co.ex !== E) return;
  startStep3();
}

function refreshStats() {
  api("coach/today?day=" + localDay()).then((d) => {
    if (co.data && d.day === co.data.day) { co.data.stats = d.stats; co.data.progress = d.progress; co.data.history = d.history; renderHead(); }
  }).catch(() => {});
}

// --- Schritt 3: verstehen --------------------------------------------------
async function startStep3() {
  const L = tc(), E = co.ex, ex = E.item.exercise;
  E.step = 3; E.phase = "explain";
  exShell(`<b>${esc(L.ex.steps[2])}</b>`);
  setBoard(ex.fen, { white: ex.orientation !== "black", last: ex.last_move });
  drawBoard();
  if (!E.explain) {
    $id("coExplain").innerHTML = `<p class="muted">${esc(L.loading)}</p>`;
    try { E.explain = await api(`coach/explain?day=${co.data.day}&key=${encodeURIComponent(E.item.key)}`); }
    catch (err) { $id("coExplain").innerHTML = `<p class="note err">${esc(err.message)}</p>`; return; }
    if (co.ex !== E) return;
    E.item.explain = E.explain;
  }
  renderExplain();
}

function renderExplain() {
  const L = tc(), E = co.ex, X = E.explain, ex = E.item.exercise, g = gameInfo(ex);
  bd.arrows = [];

    <div class="box"><h4>${esc(L.xp.why)}</h4>

      ${g.url ? `<p><a href="${esc(g.url)}" target="_blank" rel="noopener noreferrer">${esc(L.xp.openGame)}</a></p>` : ""}

async function playExplain(which) {
  const E = co.ex, X = E.explain, ex = E.item.exercise;
  if (!X || E.phase === "busy") return;
  E.phase = "busy";
  setBoard(ex.fen, { white: ex.orientation !== "black", last: ex.last_move });
  drawBoard();
  await sleep(300);
  if (co.ex !== E) return;
  const line = which === "best" ? X.best.line : [X.played.uci, X.refutation.uci].filter(Boolean);
  await animate(line, 800);
  if (co.ex !== E) return;
  await sleep(600);
  if (co.ex !== E) return;
  E.phase = "explain";
  setBoard(ex.fen, { white: ex.orientation !== "black", last: ex.last_move });
  renderExplain();
}

// Figurennamen in den Formen, die ein Satz braucht (s Subjekt, a Objekt,
// d nach "mit", y "dein"; Grossbuchstabe = Satzanfang).
function pieceName(sym) {
  const f = tc().pieces[(sym || "").toLowerCase()] || [sym, sym, sym, sym];
  const cap = (x) => x.charAt(0).toUpperCase() + x.slice(1);
  return { s: f[0], a: f[1], d: f[2], y: f[3], S: cap(f[0]), Y: cap(f[3]) };
}
function factText(f) {
  const F = tc().xp.f, P = pieceName;
  switch (f.kind) {
    case "mate": return F.mate(P(f.piece), f.to);
    case "mate_in": return F.mate_in(f.n);
    case "check": return F.check(P(f.piece), f.to);
    case "capture": return F.capture(P(f.piece), P(f.taken), f.square, f.free);
    case "fork": return F.fork(P(f.piece), f.to, f.targets.map((x) => `${P(x.piece).a} ${tc().xp.on} ${x.square}`).join(tc().xp.and));
    case "pin": return F.pin(P(f.front_piece), f.front, P(f.back_piece), f.back);
    case "skewer": return F.skewer(P(f.front_piece), f.front, P(f.back_piece), f.back);
    case "discovered": return F.discovered(P(f.by_piece), f.by, P(f.target_piece), f.target);
    case "attacks": return F.attacks(P(f.target_piece), f.target, P(f.by_piece), f.undefended);
    case "mate_threat": return F.mate_threat(f.move);
    case "promotion": return F.promotion(f.to);
    case "quiet": return F.quiet;
    case "moved_into_capture": return F.moved_into_capture(P(f.piece), f.to);
    case "left_hanging": return F.left_hanging(P(f.piece), f.square, P(f.by_piece), f.by);
    case "was_already_attacked": return F.was_already_attacked(P(f.piece), f.square);
    default: return "";
  }
}
function factsHtml(facts, cls, asList = false, san = null) {
  const items = (facts || []).map(factText).filter(Boolean);
  if (!items.length) return "";
  if (!asList) return `<ul class="co-facts">${items.map((s) => `<li class="${cls}">${esc(s)}</li>`).join("")}</ul>`;
  return `<ul class="co-facts">${items.map((s) => `<li class="${cls}">${san ? `<span class="san">${esc(san)}</span> ` : ""}${esc(s)}</li>`).join("")}</ul>`;
}

function renderExercise() {
  const d = co.data;
  if (!d.items.length) return;
  if (!co.ex) { openExercise(Math.min(co.idx, d.items.length - 1)); return; }
  // Neu zeichnen (Sprachwechsel): den Schritt neu aufbauen, Brett behalten.
  const E = co.ex, keepBoard = { board: bd.board, last: bd.last, marks: bd.marks, arrows: bd.arrows, legal: bd.legal, active: bd.active, onMove: bd.onMove, mover: bd.mover };
  const msg = E.msg, cls = E.msgCls;
  if (E.step === 1) startStep1(); else if (E.step === 2) startStep2(); else startStep3();
  Object.assign(bd, keepBoard);
  drawBoard();
  if (msg) setMsg(msg, cls);
}

function nextExercise() {
  const d = co.data;
  for (let k = 1; k <= d.items.length; k++) {
    const j = (co.idx + k) % d.items.length;
    if (!d.items[j].result) { openExercise(j); return; }
  }
  // Alle erledigt: weiter zum Verwerten oder zum Abschluss.
  if (d.convert && !d.convert.result) setStage("convert"); else finishSession();
}

function finishSession() {
  const d = co.data;
  if (!d.finished) { d.finished = true; apiJson("coach/finish", { day: d.day }).catch(() => {}); }
  setStage("done");
}

function renderConvert() {
  const L = tc(), d = co.data, it = d.convert;
  const body = $id("coBody");
  if (!it) {
    body.innerHTML = `<p class="muted">${esc(L.cv.none)}</p><div class="tac-actions"><button type="button" class="btn primary" data-co="finish">${esc(L.ex.finish)}</button></div>`;
    return;
  }
  if (!co.cv) {
    co.cv = { item: it, moves: [], state: it.result ? "done" : "move", msg: "", cls: "", extra: "" };
    setBoard(it.fen, { white: it.orientation !== "black", legal: it.legal, last: it.last_move, mover: it.to_move,
                       active: !it.result, onMove: convertMove });
    co.cv.msg = L.cv.ask(L.side(it.orientation), num(it.win_start, 0), esc(it.game.opponent || "?"), esc(date(it.game.played_at)), num(it.fail_below, 0));
    if (it.result) { co.cv.msg = esc(it.result === "success" ? L.cv.alreadyWin : L.cv.alreadyFail); co.cv.cls = it.result === "success" ? "good" : "bad"; }
  }
  const C = co.cv;
  body.innerHTML = `<div class="co-meta"><span><b>${esc(L.cv.title)}</b></span></div>
    <div class="co-ask">${C.msg}</div>
    ${boardHtml()}
    <div class="tac-msg ${C.cls}" id="coMsg">${C.extra}</div>
    <div class="tac-actions" id="coActions"></div>`;
  drawBoard();
  convertActions();
}
function convertActions() {
  const L = tc(), C = co.cv;
  let html = "";
  if (C.state === "move" || C.state === "busy") html = C.moves.length ? `<button type="button" class="btn" data-co="giveup" ${C.state === "busy" ? "disabled" : ""}>${esc(L.cv.giveup)}</button>` : "";
  else html = `<span class="grow"></span><button type="button" class="btn primary" data-co="finish">${esc(L.ex.finish)}</button>`;
  setActions(html);
}
async function convertMove(uci) {
  const L = tc(), C = co.cv;
  if (!C || C.state !== "move") return;
  bd.board = applyUci(bd.board, uci); bd.marks = {}; bd.last = moveSquares(uci);
  C.state = "busy"; C.extra = `<span class="muted">${esc(L.cv.thinking)}</span>`;
  $id("coMsg").innerHTML = C.extra; convertActions(); drawBoard();
  C.moves.push(uci);
  let res;
  try { res = await apiJson("practice/convert/move", { key: C.item.key, moves: C.moves, day: co.data.day }); }
  catch (err) {
    C.moves.pop(); C.state = "move"; C.extra = esc(err.message);
    let arr = fenBoard(C.item.fen); C.moves.forEach((u) => { arr = applyUci(arr, u); }); bd.board = arr; bd.active = true;
    renderConvert(); return;
  }
  if (co.cv !== C) return;
  if (res.reply) { bd.board = applyUci(bd.board, res.reply); C.moves.push(res.reply); bd.last = moveSquares(res.reply); }
  if (res.status === "continue") {
    bd.legal = res.legal; bd.active = true; C.state = "move"; C.cls = "";
    C.extra = esc(L.cv.state(num(res.win, 0), res.own_moves + 1, 15)) + (res.reply_san ? ` · <span class="san">${esc(res.reply_san)}</span>` : "");
  } else {
    const ok = res.status === "success";
    C.state = "done"; C.cls = ok ? "good" : "bad";
    C.extra = esc(ok ? (L.cv.win[res.reason] || L.cv.win.limit) : (L.cv.lose[res.reason] || L.cv.lose.no_reply)) + (res.better_san ? esc(L.cv.better(res.better_san)) : "");
    if (res.better_uci) markMove(res.better_uci, "good");
    C.item.result = ok ? "success" : "fail";
    co.data.convert.result = C.item.result;
    renderRail();
  }
  $id("coMsg").innerHTML = C.extra; $id("coMsg").className = "tac-msg " + C.cls;
  drawBoard(); convertActions();
}
async function convertGiveUp() {
  const L = tc(), C = co.cv;
  if (!C || C.state !== "move") return;
  try { await apiJson("practice/convert/giveup", { key: C.item.key, day: co.data.day }); } catch (err) { toast(err.message); return; }
  C.state = "done"; C.cls = "bad"; C.extra = esc(L.cv.lose.gave_up); bd.active = false;
  C.item.result = "fail"; co.data.convert.result = "fail";
  $id("coMsg").innerHTML = C.extra; $id("coMsg").className = "tac-msg bad";
  renderRail(); convertActions();
}

function renderDone() {
  const L = tc(), d = co.data, p = d.progress || {}, st = d.stats;
  const solved = d.items.filter((i) => i.result === "solved").length;
  const allDone = d.items.every((i) => i.result);
  const lines = [L.done.sub(solved, d.items.length)];
  if (p.refute_total) lines.push(L.done.refutes(p.refute_good || 0, p.refute_total));
  if (d.convert && d.convert.result) lines.push(d.convert.result === "success" ? L.done.convertOk : L.done.convertFail);
  if (st && st.streak) lines.push(L.done.streak(st.streak));
  const hist = (d.history || []).map((h) => `<i class="${h.done ? "done" : ""} ${h.day === d.day ? "today" : ""}" title="${h.day}: ${h.solved}/${h.total}"></i>`).join("");
  const stats = st ? `<p class="tac-stats muted">${esc(L.done.pool(st.new, st.learning, st.learned))}${st.last30_done ? " · " + esc(L.done.last30(Math.round(st.last30_solved / st.last30_done * 100))) : ""}</p>` : "";
  $id("coBody").innerHTML = `<div class="co-done">
      <div class="big">${allDone && solved === d.items.length ? "🏆" : allDone ? "✓" : "…"}</div>
      <h3>${esc(L.done.title)}</h3>
      ${lines.map((l) => `<p style="margin:3px 0">${esc(l)}</p>`).join("")}
      <p class="muted" style="margin-top:10px">${esc(L.done.lastDays)}</p>
      <div class="co-hist">${hist}</div>
      <p class="muted">${esc(L.done.tomorrow)}</p>
    </div>
    <div class="tac-dots" id="coDots"></div>
    ${stats}`;
  renderDots();
}

$id("coRail").addEventListener("click", (e) => {
  const b = e.target.closest("[data-stage]");
  if (!b || (co.ex && co.ex.phase === "busy")) return;
  setStage(b.dataset.stage);
});
$id("coBody").addEventListener("click", async (e) => {
  const dot = e.target.closest("[data-exi]");
  if (dot) { if (!(co.ex && co.ex.phase === "busy")) { co.stage = "exercise"; renderRail(); openExercise(Number(dot.dataset.exi)); } return; }
  const b = e.target.closest("[data-co]");
  if (!b || b.disabled) return;
  const a = b.dataset.co, E = co.ex;
  if (a === "lessonDone") { lessonDone(); return; }
  if (a === "finish") { finishSession(); return; }
  if (!E) return;
  if (a === "skip1") { if (!E.item.refute_result) { E.item.refute_result = "skipped"; apiJson("coach/refute", { day: co.data.day, key: E.item.key, reveal: true }).catch(() => {}); } startStep2(); return; }
  if (a === "show1") { if (E.phase === "solve") revealStep1(bd.board.slice(), bd.last, null); return; }
  if (a === "toStep2") { startStep2(); return; }
  if (a === "hint") { E.hint = true; setMsg(esc(hintText(E.item.exercise))); step2Actions(); return; }
  if (a === "reveal") { if (E.phase === "solve") revealStep2(); return; }
  if (a === "next") { nextExercise(); return; }
  if (a === "practice") { startStep2(true); return; }
  if (a === "playPlayed") { playExplain("played"); return; }
  if (a === "playBest") { playExplain("best"); return; }
  if (a === "giveup") { convertGiveUp(); return; }
});

const tg = () => I18N_G[lang];
const prog = { sig: null, data: null, loading: false, table: false };
const PHASE_SERIES = ["opening", "middlegame", "endgame"];

function monthLabel(m) {
  const [y, mo] = m.split("-").map(Number);
  try {
    return new Date(y, mo - 1, 1).toLocaleDateString(lang === "de" ? "de-CH" : "en-GB", { month: "short", year: "2-digit" });
  } catch { return m; }
}

async function loadProgress() {
  prog.loading = true;
  const parts = [];
  if (timeClass !== "all") parts.push("time_class=" + timeClass);
  if (platform !== "all") parts.push("platform=" + platform);
  try { prog.data = await api("progress" + (parts.length ? "?" + parts.join("&") : "")); }
  catch { prog.data = null; }
  prog.loading = false;
  renderProgress();
}

function renderProgress() {
  const el = $id("progBody");
  if (!el) return;
  const G = tg();
  $id("progTitle").textContent = G.title;
  $id("progIntro").textContent = G.intro;
  const sig = [timeClass, platform].join("|");
  if (prog.sig !== sig && !prog.loading) { prog.sig = sig; loadProgress(); }
  const d = prog.data;
  if (!d) { el.innerHTML = `<p class="muted">${esc(t().loading)}</p>`; return; }
  const months = d.months.filter((m) => m.enough);
  if (months.length < 2) { el.innerHTML = `<p class="muted">${esc(G.empty)}</p>`; return; }
  const first = months[0], last = months[months.length - 1];
  const trends = PHASE_SERIES.filter((p) => first[p] != null && last[p] != null)
    .map((p) => {
      const diff = last[p] - first[p];
      return `<span class="pg-trend">${esc(G.trend(phaseName(p), num(first[p], 0), num(last[p], 0)))} ${delta(diff, 0, "", true)}</span>`;
    }).join("");
  el.innerHTML = `${progressChart(d.months)}
    <p class="muted pg-trends">${esc(G.trendIntro)} ${trends}</p>
    <details class="pg-table"${prog.table ? " open" : ""}><summary>${esc(G.showTable)}</summary>
    <div class="tbl-wrap"><table class="tt"><thead><tr>${G.head.map((h, i) => `<th${i && i < 5 ? ' class="num"' : ""}>${esc(h)}</th>`).join("")}</tr></thead><tbody>
    ${d.months.slice().reverse().map((m) => `<tr${m.enough ? "" : ' class="thin"'}>
      <td>${esc(monthLabel(m.month))}</td><td class="num">${m.games}</td><td class="num">${num(m.score, 0, "%")}</td>
      <td class="num">${num(m.accuracy, 0, "%")}</td><td class="num">${num(m.blunders_per_game, 2)}</td>
      <td>${esc(G.conv(m.converted, m.won_positions, m.conversion == null ? null : num(m.conversion, 0)))}</td>
      <td>${esc(G.habits(m.habit_repeated, m.habit_avoided))}</td></tr>`).join("")}
    </tbody></table></div></details>`;
}

function progressChart(months) {
  const W = 640, H = 220, padL = 34, padR = 96, padT = 12, padB = 26;
  const n = months.length;
  const vals = [];
  months.forEach((m) => PHASE_SERIES.forEach((p) => { if (m[p] != null) vals.push(m[p]); }));
  if (!vals.length) return "";
  // Achse eng um die Werte, aber auf 5er gerundet - Genauigkeiten liegen dicht beieinander.
  let lo = Math.floor((Math.min(...vals) - 2) / 5) * 5, hi = Math.ceil((Math.max(...vals) + 2) / 5) * 5;
  lo = Math.max(0, lo); hi = Math.min(100, Math.max(hi, lo + 10));
  const x = (i) => padL + (n === 1 ? 0.5 : i / (n - 1)) * (W - padL - padR);
  const y = (v) => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
  let grid = "";
  for (let v = lo; v <= hi; v += (hi - lo) > 20 ? 10 : 5)
    grid += `<line class="grid-ln" x1="${padL}" x2="${W - padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="ax" x="${padL - 6}" y="${(y(v) + 4).toFixed(1)}">${v}</text>`;
  const step = Math.ceil(n / 8);
  const xl = months.map((m, i) => (i % step === 0 || i === n - 1)
    ? `<text class="ax mid" x="${x(i).toFixed(1)}" y="${H - 6}">${esc(monthLabel(m.month))}</text>` : "").join("");
  let lines = "", labels = "";
  const ends = [];
  PHASE_SERIES.forEach((p, k) => {
    let path = "", pen = false, lastPt = null;
    months.forEach((m, i) => {
      if (m[p] == null) { pen = false; return; }
      path += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(m[p]).toFixed(1)} `;
      pen = true; lastPt = [x(i), y(m[p]), m[p]];
      lines += `<circle class="pg-pt s${k + 1}" cx="${x(i).toFixed(1)}" cy="${y(m[p]).toFixed(1)}" r="4"/>`;
    });
    lines = `<path class="pg-ln s${k + 1}" d="${path}"/>` + lines;
    if (lastPt) ends.push({ k, p, y: lastPt[1], x: lastPt[0], v: lastPt[2] });
  });
  // Direkte Beschriftung am Linienende, ueberlappungsfrei gestapelt.
  ends.sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
  ends.forEach((e) => { labels += `<text class="pg-lbl" x="${(W - padR + 8).toFixed(1)}" y="${(e.y + 4).toFixed(1)}">${esc(phaseName(e.p))} ${num(e.v, 0)}</text>`; });
  // Unsichtbare Spalten fuer den Hover: eine pro Monat.
  const colW = n > 1 ? (W - padL - padR) / (n - 1) : W - padL - padR;
  const hits = months.map((m, i) => `<rect class="pg-hit" data-pgm="${i}" x="${(x(i) - colW / 2).toFixed(1)}" y="${padT}" width="${colW.toFixed(1)}" height="${H - padT - padB}"/>`).join("");
  const legend = PHASE_SERIES.map((p, k) => `<span><i class="pg-key s${k + 1}"></i>${esc(phaseName(p))}</span>`).join("");
  return `<div class="pg-wrap"><svg class="pg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tg().title)}">
    ${grid}${xl}<line class="pg-cross" id="pgCross" x1="0" x2="0" y1="${padT}" y2="${H - padB}" visibility="hidden"/>${lines}${labels}${hits}</svg>
    <div class="pg-tip" id="pgTip" hidden></div></div>
    <div class="evc-key">${legend}</div>`;
}

document.addEventListener("pointermove", (e) => {
  const tip = $id("pgTip"), cross = $id("pgCross");
  if (!tip || !cross) return;
  const hit = e.target.closest && e.target.closest("[data-pgm]");
  if (!hit || !prog.data) { tip.hidden = true; cross.setAttribute("visibility", "hidden"); return; }
  const m = prog.data.months[Number(hit.dataset.pgm)];
  const G = tg();
  const cx = Number(hit.getAttribute("x")) + Number(hit.getAttribute("width")) / 2;
  cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
  tip.innerHTML = `<strong>${esc(G.tip(monthLabel(m.month), m.games))}</strong>` +
    PHASE_SERIES.map((p, k) => `<div><i class="pg-key s${k + 1}"></i>${esc(phaseName(p))} <b>${num(m[p], 0, "%")}</b></div>`).join("") +
    `<div class="muted">${esc(G.head[5])}: ${esc(G.conv(m.converted, m.won_positions, m.conversion == null ? null : num(m.conversion, 0)))}</div>`;
  const wrap = tip.parentElement.getBoundingClientRect();
  tip.hidden = false;
  const left = Math.min(Math.max(8, e.clientX - wrap.left + 12), wrap.width - tip.offsetWidth - 8);
  tip.style.left = left + "px";
  tip.style.top = Math.max(0, e.clientY - wrap.top - tip.offsetHeight - 10) + "px";
});
document.addEventListener("toggle", (e) => {
  if (e.target.classList && e.target.classList.contains("pg-table")) prog.table = e.target.open;
}, true);

// Waehrend ein Durchgang laeuft, den Status nachziehen.
setInterval(() => {
  if (data.status && data.status.run && data.status.run.running) loadStatus();
}, 4000);

renderTabs();
if (view === "train") renderTraining();
loadAll();
loadTactics();

// --------------------------------------------------------------------------
// Hell / dunkel
// --------------------------------------------------------------------------
function currentTheme() {
  const t = document.documentElement.dataset.theme;
  if (t === "light" || t === "dark") return t;
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function renderThemeBtn() {
  const b = document.getElementById("themeBtn");
  const dark = currentTheme() === "dark";
  b.textContent = dark ? "☀" : "☾";
  const label = dark ? t().theme.light : t().theme.dark;
  b.title = label;
  b.setAttribute("aria-label", label);
}
document.getElementById("themeBtn").addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("knightmare.theme", next); } catch { /* egal */ }
  renderThemeBtn();
});
</script>
