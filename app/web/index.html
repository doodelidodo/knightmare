<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knightmare</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: light;
    --bg: #f5f7fa;
    --surface: #ffffff;
    --surface-soft: #eef2f7;
    --border: rgba(18, 32, 55, 0.13);
    --text: #16202e;
    --muted: #5d6b7e;
    --heading: #0a1420;
    --accent: #5b6ef5;
    --good: #16794a;
    --warn: #9a6100;
    --bad: #c2410c;
    --shadow: 0 12px 40px rgba(15, 23, 42, 0.09);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0a1018;
      --surface: #121b27;
      --surface-soft: #0e1623;
      --border: rgba(148, 163, 184, 0.18);
      --text: #e4ecf7;
      --muted: #94a3b8;
      --heading: #f6fafe;
      --accent: #8098ff;
      --good: #5fd39b;
      --warn: #e5b567;
      --bad: #ff9a68;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0a1018; --surface: #121b27; --surface-soft: #0e1623;
    --border: rgba(148, 163, 184, 0.18); --text: #e4ecf7; --muted: #94a3b8;
    --heading: #f6fafe; --accent: #8098ff; --good: #5fd39b; --warn: #e5b567;
    --bad: #ff9a68; --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--accent); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }

  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
           justify-content: space-between; margin-bottom: 8px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 40px; height: 40px; }
  .brand h1 { margin: 0; font-size: 1.5rem; color: var(--heading); letter-spacing: -0.02em; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 0.88rem; }
  .head-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  button { font: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--border); background: var(--surface);
         color: var(--text); border-radius: 9px; padding: 7px 13px; }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); color: #fff; }
  .btn.danger { border-color: var(--bad); color: var(--bad); }

  .chip { border: 1px solid var(--border); background: transparent; color: var(--muted);
          border-radius: 999px; padding: 5px 12px; font-size: 0.85rem; }
  .chip:hover { color: var(--text); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* Eingerichtet, aber noch keine Partie geholt: sichtbar, nicht anwaehlbar. */
  .chip.empty { opacity: 0.45; cursor: default; border-style: dashed; }
  .chip.empty:hover { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin: 12px 0; }
  .chips .label { color: var(--muted); font-size: 0.78rem; text-transform: uppercase;
                  letter-spacing: 0.06em; margin-right: 4px; }

  .card { background: var(--surface); border: 1px solid var(--border);
          border-radius: 14px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .card h2 { margin: 0 0 4px; font-size: 1.05rem; color: var(--heading); }
  .muted { color: var(--muted); font-size: 0.88rem; }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
          margin-bottom: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
         padding: 16px; box-shadow: var(--shadow); }
  .kpi .num { font-size: 2rem; font-weight: 700; color: var(--heading); line-height: 1.1; }
  .kpi h3 { margin: 6px 0 4px; font-size: 0.92rem; }
  .kpi p { margin: 0; color: var(--muted); font-size: 0.82rem; }

  .rows { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
  .row { border: 1px solid var(--border); border-radius: 11px; padding: 12px 14px;
         background: var(--surface-soft); }
  .row-btn { display: flex; flex-direction: column; gap: 6px; width: 100%;
             padding: 0; border: 0; background: none; color: inherit; text-align: left; }
  .row-top, .row-bot { display: flex; flex-wrap: wrap; gap: 8px;
                       justify-content: space-between; align-items: baseline; }
  .row-bot { font-size: 0.82rem; color: var(--muted); }
  .row-btn:hover .row-top strong { color: var(--accent); }

  .bar { height: 7px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
  .bar > i.good { background: var(--good); }
  .bar > i.warn { background: var(--warn); }
  .bar > i.bad { background: var(--bad); }

  .detail { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .detail .advice { margin: 0 0 10px; color: var(--muted); font-size: 0.88rem; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
             justify-content: space-between; margin-bottom: 8px; }
  .items { display: flex; flex-direction: column; gap: 8px;
           max-height: 60vh; overflow-y: auto; padding-right: 4px; }
  .item { border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px;
          background: var(--surface); }
  .item p { margin: 0; }
  .item p + p { margin-top: 3px; font-size: 0.82rem; color: var(--muted); }

  .tag { display: inline-block; border-radius: 999px; padding: 1px 8px;
         font-size: 0.72rem; font-weight: 600; border: 1px solid var(--border); }
  .tag.blunder { color: var(--bad); border-color: var(--bad); }
  .tag.mistake { color: var(--warn); border-color: var(--warn); }
  .tag.inaccuracy { color: var(--muted); }
  .tag.win { color: var(--good); border-color: var(--good); }
  .tag.loss { color: var(--bad); border-color: var(--bad); }

  .note { border-radius: 10px; padding: 11px 13px; margin-bottom: 14px; font-size: 0.9rem; }
  .note.err { background: rgba(194, 65, 12, 0.12); color: var(--bad); }
  .note.ok { background: rgba(22, 121, 74, 0.12); color: var(--good); }
  .note.info { background: rgba(91, 110, 245, 0.12); color: var(--accent); }

  .week { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
          gap: 12px; margin: 10px 0; }
  .week .num { font-size: 1.4rem; font-weight: 700; color: var(--heading); }
  .week .cap { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em;
               color: var(--muted); }
  .delta.up { color: var(--good); font-size: 0.8rem; font-weight: 600; }
  .delta.down { color: var(--bad); font-size: 0.8rem; font-weight: 600; }

  footer { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--border);
           color: var(--muted); font-size: 0.82rem; }
  footer a { margin-right: 14px; }
  .two { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  code { background: var(--surface-soft); padding: 1px 5px; border-radius: 4px; font-size: 0.85em; }
  /* --- Tabs -------------------------------------------------------------- */
  .tabs { display: flex; gap: 6px; margin: 14px 0 6px; border-bottom: 1px solid var(--border); }
  .tab { border: 0; background: none; color: var(--muted); padding: 9px 14px 10px; font-weight: 600;
         border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .badge { font-weight: 500; font-size: 0.78rem; color: var(--muted); margin-left: 6px; }
  [hidden] { display: none !important; }

  /* --- Training ---------------------------------------------------------- */
  .tac-top { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: baseline; }
  .tac-dots { display: grid; grid-template-columns: repeat(10, minmax(0, 36px)); gap: 5px; margin: 14px 0 12px; }
  .tac-dot { height: 30px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-soft);
             font-size: 12px; font-weight: 600; color: var(--muted); padding: 0; display: grid; place-items: center; }
  .tac-dot.solved { background: rgba(22, 121, 74, 0.14); color: var(--good); border-color: transparent; }
  .tac-dot.failed { background: rgba(194, 65, 12, 0.14); color: var(--bad); border-color: transparent; }
  .tac-dot.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tac-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
              font-size: 0.9rem; margin-bottom: 8px; }
  .tag.accent { color: var(--accent); border-color: var(--accent); }
  .tac-empty { text-align: center; color: var(--muted); padding: 28px 8px; }
  .tac-empty .big { font-size: 28px; }
  .tac-empty strong { color: var(--text); }
  .board-wrap { max-width: 440px; margin: 0 auto; }
  .board {
    position: relative; display: grid; aspect-ratio: 1 / 1;
    /* Feste Zeilen: manche Schriften haben hoehere Figurenzeichen als ein
       Feld, ohne das wuerden sie die Reihen auseinanderdruecken. */
    grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr));
    border-radius: 10px; overflow: hidden; container-type: inline-size;
    user-select: none; -webkit-user-select: none; touch-action: none; -webkit-touch-callout: none;
  }
  .sq { position: relative; display: grid; place-items: center; min-height: 0; overflow: hidden; }
  .sq.l { background: #dee3e6; }
  .sq.d { background: #8ca2ad; }
  .sq.last::before, .sq.sel::before, .sq.good::before, .sq.bad::before { content: ""; position: absolute; inset: 0; }
  .sq.last::before { background: rgba(255, 214, 10, 0.38); }
  .sq.sel::before { background: rgba(79, 124, 255, 0.45); }
  .sq.good::before { background: rgba(21, 160, 90, 0.55); }
  .sq.bad::before { background: rgba(220, 70, 20, 0.55); }
  .sq.dest::after { content: ""; position: absolute; width: 28%; height: 28%; border-radius: 50%;
                    background: rgba(20, 35, 62, 0.3); z-index: 2; pointer-events: none; }
  .sq.dest.occ::after { width: 94%; height: 94%; background: transparent;
                        border: 0.9cqw solid rgba(20, 35, 62, 0.35); box-sizing: border-box; }
  .sq.dragging .pc { opacity: 0.25; }
  .coord { position: absolute; font-size: 2.3cqw; font-weight: 700; line-height: 1; pointer-events: none; z-index: 1; }
  .coord.f { right: 4%; bottom: 4%; }
  .coord.r { left: 4%; top: 4%; }
  .sq.l .coord { color: #6f8591; }
  .sq.d .coord { color: #eef1f3; }
  .pc { position: relative; z-index: 1; font-size: 10.4cqw; line-height: 1; height: 1em; cursor: grab;
        font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "Noto Sans Symbols", "DejaVu Sans", "Arial Unicode MS", sans-serif; }
  .pc.w { color: #ffffff; -webkit-text-stroke: 0.28cqw #1b1d22; paint-order: stroke fill;
          text-shadow: 0 0.3cqw 0.4cqw rgba(0, 0, 0, 0.35); }
  .pc.b { color: #1b1d22; text-shadow: 0 0 0.3cqw rgba(255, 255, 255, 0.35); }
  .drag-ghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -55%); line-height: 1; }
  .tac-msg { min-height: 42px; margin: 10px 0 0; font-size: 0.95rem; }
  .tac-msg.good { color: var(--good); }
  .tac-msg.bad { color: var(--bad); }
  .tac-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .tac-actions .grow { flex: 1; }
  .explain { margin-top: 12px; padding: 10px 12px; border-radius: 11px; background: var(--surface-soft); font-size: 0.92rem; }
  .explain p { margin: 4px 0; }
  .san { font-weight: 700; }
  .tac-stats { margin-top: 14px; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--heading);
           color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 0.9rem; opacity: 0;
           transition: opacity 0.2s; pointer-events: none; z-index: 60; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; }
  @media (max-width: 480px) {
    .tac-dots { grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; }
    .tac-dot { height: 28px; font-size: 11px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="assets/logo.svg" alt="">
      <div>
        <h1>Knightmare</h1>
        <p id="tagline"></p>
      </div>
    </div>
    <div class="head-actions">
      <button class="chip" id="langBtn" type="button"></button>
      <button class="btn" id="refreshBtn" type="button"></button>
      <button class="btn primary" id="syncBtn" type="button"></button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab" type="button" data-view="analyse" id="tabAnalyse"></button>
    <button class="tab" type="button" data-view="train" id="tabTrain"></button>
  </nav>

  <div id="notes"></div>

  <div id="viewAnalyse">

  <div class="chips" id="platformChips"></div>
  <div class="chips" id="classChips"></div>
  <div class="chips" id="rangeChips"></div>

  <div class="grid" id="kpis"></div>

  <div class="card">
    <h2 id="errTitle"></h2>
    <p class="muted" id="errIntro"></p>
    <div class="rows" id="errRows"></div>
  </div>

  <div class="card">
    <h2 id="missTitle"></h2>
    <p class="muted" id="missIntro"></p>
    <div class="rows" id="missRows"></div>
  </div>

  <div class="two">
    <div class="card">
      <h2 id="weekTitle"></h2>
      <div id="weekBody"></div>
    </div>
    <div class="card">
      <h2 id="notableTitle"></h2>
      <div id="notableBody"></div>
    </div>
  </div>

  <div class="two">
    <div class="card">
      <h2 id="phaseTitle"></h2>
      <p class="muted" id="phaseIntro"></p>
      <div class="rows" id="phaseRows"></div>
    </div>
    <div class="card">
      <h2 id="pressTitle"></h2>
      <p class="muted" id="pressIntro"></p>
      <div class="rows" id="pressRows"></div>
      <p class="muted" id="pressLong"></p>
    </div>
  </div>

  <div class="card">
    <h2 id="openTitle"></h2>
    <p class="muted" id="openIntro"></p>
    <div class="chips" id="colorChips"></div>
    <div class="rows" id="openRows"></div>
  </div>

  <div class="card">
    <h2 id="gamesTitle"></h2>
    <div class="items" id="gamesRows" style="max-height:none"></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <div>
        <h2 id="reTitle"></h2>
        <p class="muted" id="reIntro"></p>
      </div>
      <button class="btn" id="reBtn" type="button"></button>
    </div>
    <p class="muted" id="statusLine"></p>
  </div>
  </div>

  <div id="viewTrain" hidden>
    <div class="card">
      <div class="tac-top">
        <h2 id="trTitle"></h2>
        <span class="muted" id="tacHead"></span>
      </div>
      <p class="muted" id="trIntro"></p>
      <div class="tac-dots" id="tacDots"></div>
      <div id="tacBody"></div>
      <p class="tac-stats muted" id="tacStats"></p>
    </div>
  </div>

  <footer id="footer"></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
"use strict";

// --------------------------------------------------------------------------
// Texte. Alles was der Nutzer sieht, steht hier - die API liefert nur
// sprachneutrale Schluessel.
// --------------------------------------------------------------------------
const I18N = {
  en: {
    lang: "Deutsch", tagline: "Find the patterns behind your mistakes",
    refresh: "Refresh", loading: "Loading…", sync: "Fetch & analyse", running: "Running…",
    notConfigured: "No Chess.com username set. Start the container with <code>-e CHESSCOM_USERNAME=yourname</code>.",
    runNote: (p, f, a) => `Run in progress: ${p}. ${f} new games, ${a} analysed so far.`,
    unreachable: (m) => `Backend unreachable: ${m}`,
    noData: (m) => `Could not load data: ${m}`,
    gameType: "Game type", period: "Period", all: "All", platform: "Platform",
    d30: "Last 30 days", d90: "Last 90 days", dAll: "All time",
    ultrabullet: "UltraBullet", bullet: "Bullet", blitz: "Blitz", rapid: "Rapid",
    classical: "Classical", daily: "Daily",
    chesscom: "Chess.com", lichess: "Lichess",
    kAnalysed: "Games analysed",
    kAnalysedSub: (g, p, f) => `${g} fetched${p ? `, ${p} pending` : ""}${f ? `, ${f} unreadable` : ""}.`,
    kScore: "Score", kScoreSub: (w, d, l) => `${w} wins, ${d} draws, ${l} losses.`,
    kAcpl: "Avg. loss per move", kAcplSub: (a) => `In centipawns — lower is better. Chess.com accuracy: ${a}.`,
    kBlunders: "Blunders per game", kBlundersSub: (m, i) => `Plus ${m} mistakes and ${i} inaccuracies.`,
    errTitle: "What actually goes wrong",
    errIntro: "Every mistake grouped by what it was, derived from the move your opponent could have punished you with. Click to see every single one.",
    errEmpty: "No analysed mistakes yet in this selection.",
    errCounts: (b, m, i) => `${b} blunders, ${m} mistakes, ${i} inaccuracies`,
    errShare: (c, s) => `${c}× · ${s} of all mistakes`,
    missShare: (n, pct) => `${n}× · ${pct} of the tactics you missed`,
    avgCp: (v) => `avg ${v} cp`, mostlyIn: (p) => `mostly in the ${p}`,
    avgClock: (t) => `avg clock left ${t}`,
    shown: (n, t) => `${n} of ${t} shown`, none: "Nothing found.",
    sortCost: "Costliest first", sortNew: "Newest first",
    loadMore: (n) => `Load ${n} more`,
    lost: (cp) => `lost ${cp} cp`,
    punished: (m) => `, punished by ${m}`, better: (m) => `. ${m} was better`,
    against: (o) => ` · vs ${o}`, clockLeft: (t) => ` · ${t} left`,
    thought: (t) => ` · thought ${t}`, openGame: (n) => `Open game (move ${n})`,
    weekTitle: "This week", weekNone: "No games in the last seven days.",
    wGames: "Games", wScore: "Score", wAcpl: "Avg. loss", wBlunders: "Blunders/game",
    weekCompare: "Compared with the seven days before.",
    unchanged: "unchanged",
    notableTitle: "Notable this week",
    topError: (l, c, s) => `Most frequent: <strong>${l}</strong> — ${c}× (${s} of this week's mistakes).`,
    worstOpening: (o, s, g, w, d, l) => `<strong>${o}</strong> went badly: ${s} from ${g} games (${w}/${d}/${l}).`,
    noOpening: "No opening came up more than once this week.",
    worstMove: (n, s, p) => `Biggest blunder: <strong>${n}. ${s}</strong> in the ${p}`,
    noErrors: "No analysed mistakes this week yet.",
    phaseTitle: "Where it slips", phaseIntro: "Average loss per move and error rate by game phase.",
    pressTitle: "Time pressure", pressIntro: "Mistakes by remaining clock — daily games excluded.",
    pressNone: "No clock information found in these games.",
    longThink: (n, a, b) => `After long thinks (20 s+): ${n} moves, avg ${a} cp, ${b} blunders per 100 moves.`,
    moves: (n) => `${n} moves`, per100: (v) => `${v} blunders per 100 moves`,
    opening: "Opening", middlegame: "middlegame", endgame: "endgame",
    phOpening: "Opening", phMiddlegame: "Middlegame", phEndgame: "Endgame",
    openTitle: "Openings", openIntro: "Worst score first, from three games up. These are the ones to review.",
    openEmpty: "Not enough games for an opening breakdown in this selection.",
    bothColors: "Both colours", asWhite: "As White", asBlack: "As Black",
    games: (n) => `${n} games`, inOpening: (v) => ` · ${v} cp in the opening`,
    gamesTitle: "Recent games", gamesEmpty: "No games in this selection.",
    win: "Win", draw: "Draw", loss: "Loss",
    white: "White", black: "Black",
    notAnalysed: " · not analysed yet", failed: (e) => ` · analysis failed: ${e}`,
    gameStats: (a, b, m) => ` · avg ${a} cp · ${b} blunders, ${m} mistakes`,
    openOn: "open on Chess.com",
    reTitle: "Re-analyse", reIntro: "Only needed when older games are missing newer fields. Changed thresholds apply on the next start by themselves. Nothing is re-fetched — only re-evaluated.",
    reBtn: "Re-analyse", reConfirm: "Sure? Click again",
    statusLine: (u, e, t, i, done, total, pending) =>
      `User: ${u} · engine: ${e} · ${t}s per position · auto run every ${i} h · ${done} of ${total} games analysed${pending ? `, ${pending} pending` : ""}.`,
    thresholds: (i, m, b, u) => u === "win%"
      ? ` Thresholds in win probability lost: inaccuracy from ${i} points, mistake from ${m}, blunder from ${b}.`
      : ` Thresholds: inaccuracy from ${i} cp, mistake from ${m} cp, blunder from ${b} cp.`,
    blunder: "Blunder", mistake: "Mistake", inaccuracy: "Inaccuracy",
    missTitle: "What you left on the board",
    missIntro: "When you went wrong, this is what was available instead \u2014 the engine's best move, grouped by motif. Click to see every position.",
    missEmpty: "Nothing found. Either you took your chances, or there was nothing tactical to take.",
    missScanned: (n, total) => `Something concrete was available in ${n} of ${total} mistakes.`,
    missStale: (n) => `${n} games were analysed before this section existed, so they carry no motifs yet. Hit \u201cRe-analyse\u201d at the bottom of the page \u2014 nothing is re-fetched, only re-evaluated.`,
    missCounts: (b, m) => `${b} in blunders, ${m} in mistakes`,
    couldHave: (san) => `${san} was there`,

// --------------------------------------------------------------------------
// Zustand
// --------------------------------------------------------------------------
const store = {
  get(key, fallback) { try { return localStorage.getItem(key) || fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch { /* egal */ } },
};

let lang = store.get("knightmare.lang", (navigator.language || "en").startsWith("de") ? "de" : "en");
let timeClass = store.get("knightmare.timeClass", "rapid");
let platform = store.get("knightmare.platform", "all");
let range = store.get("knightmare.range", "90");
let color = "all";

let data = {};
let expanded = null;
let list = { items: [], total: 0, sort: "cp_loss", loading: false };
// Eigener Zustand fuer die verpasste Taktik - sonst wuerde das Aufklappen
// der einen Liste die andere zuklappen.
let missExpanded = null;
let missList = { items: [], total: 0, sort: "cp_loss", loading: false };
let confirmRe = false;
const PAGE = 25;

const t = () => I18N[lang];

// Der Wochenreport kennt keinen Zeitraum, nur die beiden anderen Filter.
function weeklyQuery() {
  const parts = [];
  if (timeClass !== "all") parts.push("time_class=" + timeClass);
  if (platform !== "all") parts.push("platform=" + platform);
  return parts.length ? "?" + parts.join("&") : "";
}
const RANGES = { "30": 30, "90": 90, "all": null };

// Relative Pfade: funktioniert unter / genauso wie hinter /chess/
async function api(path) {
  // no-store zusaetzlich zum Header des Servers: ein Zwischenspeicher, der
  // veraltete Zahlen ausliefert, ist schlimmer als einer, der nichts spart.
  const res = await fetch("api/" + path, { cache: "no-store" });
  if (!res.ok) throw new Error((await res.text()) || `HTTP ${res.status}`);
  return res.json();
}
async function post(path) {
  const res = await fetch("api/" + path, { method: "POST", cache: "no-store" });
  return res.json();
}

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (v, d = 1, suffix = "") =>
  v === null || v === undefined ? "–" : Number(v).toFixed(d) + suffix;

function secs(v) {
  if (v === null || v === undefined) return "–";
  const total = Math.round(Number(v));
  if (total < 60) return total + "s";
  return Math.floor(total / 60) + ":" + String(total % 60).padStart(2, "0");
}
function date(v) {
  if (!v) return "–";
  try {
    return new Date(v).toLocaleDateString(lang === "de" ? "de-CH" : "en-GB",
      { day: "2-digit", month: "2-digit", year: "numeric" });
  } catch { return v; }
}
function bar(value, max, tone) {
  const pct = max > 0 && value ? Math.min(100, (value / max) * 100) : 0;
  return `<div class="bar"><i class="${tone}" style="width:${pct}%"></i></div>`;
}
function delta(value, digits, suffix, positiveIsGood) {
  if (value === null || value === undefined) return `<span class="muted">–</span>`;
  const v = Number(value);
  if (Math.abs(v) < 0.005) return `<span class="muted">${t().unchanged}</span>`;
  const good = positiveIsGood ? v > 0 : v < 0;
  return `<span class="delta ${good ? "up" : "down"}">${v > 0 ? "+" : ""}${v.toFixed(digits)}${suffix}</span>`;
}
const phaseName = (p) => ({ opening: t().phOpening, middlegame: t().phMiddlegame, endgame: t().phEndgame }[p] || p);
const phaseInline = (p) => ({ opening: t().opening, middlegame: t().middlegame, endgame: t().endgame }[p] || p);

// --------------------------------------------------------------------------
// Laden
// --------------------------------------------------------------------------
function query(extra) {
  const parts = [];
  const days = RANGES[range];
  if (days) parts.push("days=" + days);
  if (timeClass !== "all") parts.push("time_class=" + timeClass);
  if (platform !== "all") parts.push("platform=" + platform);
  (extra || []).forEach((p) => parts.push(p));
  return parts.length ? "?" + parts.join("&") : "";
}

async function loadAll() {
  expanded = null;
  list = { items: [], total: 0, sort: list.sort, loading: false };
  missExpanded = null;
  missList = { items: [], total: 0, sort: missList.sort, loading: false };
  setBusy(true);
  try {
    const openParts = ["min_games=3", "limit=12"];
    if (RANGES[range]) openParts.push("days=" + RANGES[range]);
    if (timeClass !== "all") openParts.push("time_class=" + timeClass);
    if (platform !== "all") openParts.push("platform=" + platform);
    if (color !== "all") openParts.push("color=" + color);
    const gameParts = ["limit=12"];
    if (timeClass !== "all") gameParts.push("time_class=" + timeClass);
    if (platform !== "all") gameParts.push("platform=" + platform);

    const [status, overview, weekly, errors, missed, phases, pressure, openings, games] =
      await Promise.all([
        api("status"),
        api("overview" + query()),
        api("report/weekly" + weeklyQuery()),
        api("error-types" + query(["examples=0"])),
        api("missed" + query()),
        api("phases" + query()),
        api("time-pressure" + query()),
        api("openings?" + openParts.join("&")),
        api("games?" + gameParts.join("&")),
      ]);
    data = { status, overview, weekly, errors, missed, phases, pressure, openings, games };
    data.error = null;
  } catch (err) {
    data.error = t().noData(err.message);
  } finally {
    setBusy(false);
    render();
  }
}

async function loadStatus() {
  try { data.status = await api("status"); render(); } catch { /* still */ }
}

async function loadErrors(type, opts) {
  const o = opts || {};
  const sort = o.sort || "cp_loss";
  const append = !!o.append;
  const mate = o.mate || null;
  list = { items: append ? list.items : [], total: append ? list.total : 0, sort, mate, loading: true };
  render();
  try {
    const parts = [
      "error_type=" + encodeURIComponent(type), "sort=" + sort,
      "limit=" + PAGE, "offset=" + (o.offset || 0),
    ];
    if (RANGES[range]) parts.push("days=" + RANGES[range]);
    if (timeClass !== "all") parts.push("time_class=" + timeClass);
    if (platform !== "all") parts.push("platform=" + platform);
    if (mate) parts.push("mate_in=" + encodeURIComponent(mate));
    const res = await api("errors?" + parts.join("&"));
    list = {
      sort, mate, loading: false, total: res.total || 0,
      items: append ? list.items.concat(res.moves || []) : (res.moves || []),
    };
  } catch (err) {
    list.loading = false;
    data.error = t().noData(err.message);
  }
  render();
}
async function loadMissed(motif, opts) {
  const o = opts || {};
  const sort = o.sort || "cp_loss";
  const append = !!o.append;
  const mate = o.mate || null;
  missList = {
    items: append ? missList.items : [],
    total: append ? missList.total : 0,
    sort, mate, loading: true,
  };
  render();
  try {
    const parts = [
      "motif=" + encodeURIComponent(motif), "sort=" + sort,
      "limit=" + PAGE, "offset=" + (o.offset || 0),
    ];
    if (RANGES[range]) parts.push("days=" + RANGES[range]);
    if (timeClass !== "all") parts.push("time_class=" + timeClass);
    if (platform !== "all") parts.push("platform=" + platform);
    if (mate) parts.push("mate_in=" + encodeURIComponent(mate));
    const res = await api("missed/moves?" + parts.join("&"));
    missList = {
      sort, mate, loading: false, total: res.total || 0,
      items: append ? missList.items.concat(res.moves || []) : (res.moves || []),
    };
  } catch (err) {
    missList.loading = false;
    data.error = t().noData(err.message);
  }
  render();
}


let busy = false;
function setBusy(value) { busy = value; }

// --------------------------------------------------------------------------
// Darstellung
// --------------------------------------------------------------------------
function render() {
  const L = t();
  document.documentElement.lang = lang;
  document.getElementById("tagline").textContent = L.tagline;
  document.getElementById("langBtn").textContent = L.lang;
  document.getElementById("refreshBtn").textContent = busy ? L.loading : L.refresh;
  document.getElementById("refreshBtn").disabled = busy;

  const run = data.status && data.status.run;
  const syncBtn = document.getElementById("syncBtn");
  syncBtn.textContent = run && run.running ? L.running : L.sync;
  syncBtn.disabled = !!(run && run.running) || (data.status && data.status.configured === false);

  // Hinweise
  const notes = [];
  if (data.error) notes.push(`<div class="note err">${data.error}</div>`);
  if (data.status && data.status.configured === false)
    notes.push(`<div class="note err">${L.notConfigured}</div>`);
  if (run && run.running)
    notes.push(`<div class="note info">${esc(L.runNote(run.phase, run.fetched || 0, run.analyzed || 0))}</div>`);
  document.getElementById("notes").innerHTML = notes.join("");

  renderFilters();
  renderKpis();
  renderErrors();
  renderMissed();
  renderWeek();
  renderPhases();
  renderPressure();
  renderOpenings();
  renderGames();
  renderFooter();
  renderTabs();
}

function renderFilters() {
  const L = t();
  const classes = (data.status && data.status.time_classes) || [];
  const platforms = (data.status && data.status.platforms) || [];

  // Massgeblich ist, was EINGERICHTET ist, nicht was schon an Partien da ist.
  // Sonst verschwindet die Reihe genau dann, wenn man wissen will, ob die
  // zweite Quelle ueberhaupt ankommt - und man sieht nichts statt einer Null.
  const configured = (data.status && data.status.configured_platforms) || [];
  const counted = new Map(platforms.map((p) => [p.platform, p.games]));
  const sources = configured.length ? configured : platforms.map((p) => p.platform);

  document.getElementById("platformChips").innerHTML =
    sources.length > 1
      ? `<span class="label">${L.platform}</span>` +
        `<button class="chip ${platform === "all" ? "on" : ""}" data-pf="all">${L.all}</button>` +
        sources.map((name) => {
          const games = counted.get(name) || 0;
          // Eine Quelle ohne Partien bleibt sichtbar, aber nicht anwaehlbar -
          // ein leerer Filter waere nur verwirrend.
          const off = games === 0 ? " empty" : "";
          return `<button class="chip ${platform === name ? "on" : ""}${off}" ` +
                 `data-pf="${esc(name)}"${games === 0 ? " disabled" : ""}>` +
                 `${esc(L[name] || name)} (${games})</button>`;
        }).join("")

// Filter nach Mattlaenge. Nur dort, wo es um verpasste Matts geht - fuer
// Anfaenger der wichtigste Schnitt: erst alle Matt-in-1 durchgehen.
function mateChips(breakdown, current, attr, forValue) {
  const L = t();
  const entries = Object.entries(breakdown || {});
  if (!entries.length) return "";
  const chip = (value, label) =>
    `<button class="chip ${(current || "") === value ? "on" : ""}" ${attr}="${esc(value)}" data-mfor2="${esc(forValue)}">${esc(label)}</button>`;
  return `<div class="chips" style="margin:6px 0 10px"><span class="label">${esc(L.mateLabel)}</span>` +
    chip("", L.all) +
    entries.map(([bucket, count]) => chip(bucket, `${L.mateBucket(bucket)} (${count})`)).join("") +
    `</div><p class="muted" style="margin:0 0 10px">${esc(L.mateNote)}</p>`;
}

function errorDetail(row) {
  const L = t();
  const head = list.total
    ? esc(L.shown(list.items.length, list.total))
    : list.loading ? esc(L.loading) : esc(L.none);
  const sorts = [["cp_loss", L.sortCost], ["recent", L.sortNew]].map(([k, label]) =>
    `<button class="chip ${list.sort === k ? "on" : ""}" data-sort="${k}" data-for="${esc(row.error_type)}">${label}</button>`).join("");

  const items = list.items.map((m) => {
    const num_ = `${m.move_number}. ${m.color === "black" ? "… " : ""}${esc(m.san)}`;
    let line = `<strong>${num_}</strong> <span class="tag ${esc(m.category)}">${esc(L[m.category] || m.category)}</span> — ${esc(L.lost(m.cp_loss))}`;
    if (m.refutation_san) line += esc(L.punished(m.refutation_san));
    if (m.best_move_san) line += esc(L.better(m.best_move_san));
    if (m.mate_in) line += esc(L.mateIn(m.mate_in));
    // Die zweite Achse hier mit anzeigen: "Stellungsfehler" sagt wenig, wenn
    // daneben steht, dass eine Gabel bereitlag.
    if (m.missed_motif) {
      line += esc(" · " + (L.missed[m.missed_motif] || m.missed_label || m.missed_motif));
    }
    let meta = esc(phaseName(m.phase));
    if (m.opponent) meta += esc(L.against(m.opponent)) + (m.opponent_rating ? ` (${m.opponent_rating})` : "");
    if (m.result) meta += " · " + esc(L[m.result] || m.result);
    if (m.opening) meta += " · " + esc(m.opening);
    meta += " · " + esc(date(m.played_at));
    if (m.clock_seconds != null) meta += esc(L.clockLeft(secs(m.clock_seconds)));
    if (m.seconds_spent != null) meta += esc(L.thought(secs(m.seconds_spent)));
    const link = m.game_url
      ? ` · <a href="${esc(m.game_url)}" target="_blank" rel="noreferrer">${esc(L.openGame(m.move_number))}</a>`
      : "";
    return `<div class="item"><p>${line}.</p><p>${meta}${link}</p></div>`;
  }).join("");

  const more = list.items.length < list.total
    ? `<p style="margin-top:10px"><button class="btn" data-more="${esc(row.error_type)}"${list.loading ? " disabled" : ""}>` +
      `${list.loading ? esc(L.loading) : esc(L.loadMore(Math.min(PAGE, list.total - list.items.length)))}</button></p>`
    : "";

  return `<div class="detail">
    <p class="advice">${esc(L.advice[row.error_type] || "")}</p>
    ${row.error_type === "missed_mate" ? mateChips(row.mate_in, list.mate, "data-emate", row.error_type) : ""}
    <div class="toolbar"><span class="muted">${head}</span><span class="chips" style="margin:0">${sorts}</span></div>
    <div class="items">${items}</div>${more}</div>`;
}

function missedDetail(row) {
  const L = t();
  const head = missList.total
    ? esc(L.shown(missList.items.length, missList.total))
    : missList.loading ? esc(L.loading) : esc(L.none);
  const sorts = [["cp_loss", L.sortCost], ["recent", L.sortNew]].map(([k, label]) =>
    `<button class="chip ${missList.sort === k ? "on" : ""}" data-msort="${k}" data-mfor="${esc(row.motif)}">${label}</button>`).join("");

  const items = missList.items.map((m) => {
    const num_ = `${m.move_number}. ${m.color === "black" ? "… " : ""}${esc(m.san)}`;
    // Hier steht der beste Zug vorn: um den geht es, nicht um den gespielten.
    let line = `<strong>${num_}</strong> <span class="tag ${esc(m.category)}">${esc(L[m.category] || m.category)}</span>`;
    if (m.best_move_san) line += " — " + esc(L.couldHave(m.best_move_san));
    if (m.mate_in) line += esc(L.mateIn(m.mate_in));
    line += " · " + esc(L.lost(m.cp_loss));
    let meta = esc(phaseName(m.phase));
    if (m.opponent) meta += esc(L.against(m.opponent)) + (m.opponent_rating ? ` (${m.opponent_rating})` : "");
    if (m.opening) meta += " · " + esc(m.opening);
    meta += " · " + esc(date(m.played_at));
    if (m.clock_seconds != null) meta += esc(L.clockLeft(secs(m.clock_seconds)));
    if (m.seconds_spent != null) meta += esc(L.thought(secs(m.seconds_spent)));
    const link = m.game_url
      ? ` · <a href="${esc(m.game_url)}" target="_blank" rel="noreferrer">${esc(L.openGame(m.move_number))}</a>`
      : "";
    return `<div class="item"><p>${line}.</p><p>${meta}${link}</p></div>`;
  }).join("");

  const more = missList.items.length < missList.total
    ? `<p style="margin-top:10px"><button class="btn" data-mmore="${esc(row.motif)}"${missList.loading ? " disabled" : ""}>` +
      `${missList.loading ? esc(L.loading) : esc(L.loadMore(Math.min(PAGE, missList.total - missList.items.length)))}</button></p>`
    : "";

  return `<div class="detail">
    <p class="advice">${esc(L.madvice[row.motif] || "")}</p>
    ${row.motif === "mate" ? mateChips(row.mate_in, missList.mate, "data-mmate", row.motif) : ""}
    <div class="toolbar"><span class="muted">${head}</span><span class="chips" style="margin:0">${sorts}</span></div>
    <div class="items">${items}</div>${more}</div>`;
}


function renderWeek() {

    : `<p class="muted">${L.weekNone}</p>`;

  const parts = [];
  if (w.top_error) {
    const label = L.errors[w.top_error.error_type] || w.top_error.label;
    parts.push(`<div class="item"><p>${L.topError(esc(label), w.top_error.count, num(w.top_error.share_percent, 0, "%"))}</p></div>`);
  }
  if (w.worst_opening) {
    const o = w.worst_opening;
    parts.push(`<div class="item"><p>${L.worstOpening(esc(o.opening), num(o.score_percent, 0, "%"), o.games, o.wins, o.draws, o.losses)}</p></div>`);
  } else {
    parts.push(`<div class="item"><p class="muted">${L.noOpening}</p></div>`);
  }
  if (w.worst_move) {
    const m = w.worst_move;
    let line = L.worstMove(m.move_number, esc(m.san), esc(phaseInline(m.phase))) + " — " + esc(L.lost(m.cp_loss));
    if (m.best_move_san) line += esc(L.better(m.best_move_san));

    const link = m.game_url ? ` · <a href="${esc(m.game_url)}" target="_blank" rel="noreferrer">${esc(L.openGame(m.move_number))}</a>` : "";
    parts.push(`<div class="item"><p>${line}.</p><p>${link}</p></div>`);
  } else {
    parts.push(`<div class="item"><p class="muted">${L.noErrors}</p></div>`);
  }
  document.getElementById("notableBody").innerHTML = `<div class="items" style="max-height:none">${parts.join("")}</div>`;

document.getElementById("tabs").addEventListener("click", (e) => {

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
}

async function apiJson(path, body) {
  const res = await fetch("api/" + path, {
    method: "POST", cache: "no-store",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  if (!res.ok) {
    let code = `HTTP ${res.status}`;
    try { const j = await res.json(); if (typeof j.detail === "string") code = j.detail; } catch { /* egal */ }
    throw new Error(tr().errors[code] || code);
  }
  return res.json();
}

// Der Tag des Browsers, nicht des Servers: um 00:30 sollen die neuen Aufgaben
// kommen, auch wenn der Server in UTC noch gestern hat.
function localDay() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// Der Server kennt die Loesung und prueft jeden Zug; hier wird nur gezeigt,
// gezogen und nachgespielt.
const GLYPH = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
const FILES = "abcdefgh";
const sqName = (i) => FILES[i % 8] + (Math.floor(i / 8) + 1);
const sqIndex = (n) => FILES.indexOf(n[0]) + (Number(n[1]) - 1) * 8;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const $id = (id) => document.getElementById(id);

const tac = { data: null, idx: -1, pos: null, poll: null, error: null };

function fenBoard(fen) {
  const arr = new Array(64).fill(null);
  fen.split(" ")[0].split("/").forEach((row, r) => {
    let f = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) f += Number(ch);
      else { arr[(7 - r) * 8 + f] = ch; f++; }
    }
  });
  return arr;
}

// Zug auf dem Anzeige-Brett ausfuehren. Keine Regelpruefung - das macht der
// Server -, nur die drei Sonderfaelle, die sonst falsch aussaehen.
function applyUci(arr, uci) {
  const b = arr.slice();
  const from = sqIndex(uci.slice(0, 2)), to = sqIndex(uci.slice(2, 4));
  let p = b[from];
  if (!p) return b;
  const kind = p.toLowerCase();
  if (kind === "k" && Math.abs(to - from) === 2) {
    const base = from - (from % 8);
    if (to > from) { b[base + 5] = b[base + 7]; b[base + 7] = null; }
    else { b[base + 3] = b[base]; b[base] = null; }
  }
  if (kind === "p" && (to - from) % 8 !== 0 && !b[to]) b[to + (p === "P" ? -8 : 8)] = null;
  if (uci.length === 5) p = p === "P" ? uci[4].toUpperCase() : uci[4];
  b[to] = p;
  b[from] = null;
  return b;
}
const moveSquares = (uci) => uci ? [sqIndex(uci.slice(0, 2)), sqIndex(uci.slice(2, 4))] : null;

async function loadTactics(keepIdx = false) {
  clearTimeout(tac.poll);
  let d;
  try {
    d = await api("tactics/today?day=" + localDay());
    tac.error = null;
  } catch (err) {
    tac.error = err.message;
    renderTabs();
    if (view === "train") renderTraining();
    return;
  }
  const prevKey = keepIdx && tac.pos ? tac.pos.item.key : null;
  tac.data = d;
  renderTabs();
  if (!d.items.length) {
    tac.idx = -1; tac.pos = null;
    if (d.preparing) tac.poll = setTimeout(() => loadTactics(), 4000);
    if (view === "train") renderTraining();
    return;
  }
  let idx = prevKey ? d.items.findIndex((i) => i.key === prevKey) : -1;
  if (idx < 0) idx = d.items.findIndex((i) => !i.result);
  if (idx < 0) { tac.idx = -1; tac.pos = null; if (view === "train") renderTraining(); return; }
  openItem(idx, view !== "train");
}

// Alles im Training neu zeichnen - nach Sprachwechsel oder Reiterwechsel.
function renderTraining() {
  const L = tr();
  $id("trTitle").textContent = L.title;
  $id("trIntro").textContent = L.intro;
  renderTacHead();
  if (tac.error) { $id("tacBody").innerHTML = `<div class="note err">${esc(tac.error)}</div>`; return; }
  if (!tac.data) { $id("tacBody").innerHTML = `<div class="tac-empty">${esc(L.loading)}</div>`; return; }
  if (!tac.data.items.length) { renderTacEmpty(); return; }
  if (!tac.pos) { renderTacSummary(); return; }
  openItem(tac.idx, false, true);
}

function renderTacHead() {
  const L = tr(), d = tac.data, items = d ? d.items : [];
  const done = items.filter((i) => i.result).length;
  const st = d ? d.stats : null;
  $id("tacHead").textContent = items.length ? L.done(done, items.length) + (st && st.streak ? L.streak(st.streak) : "") : "";
  $id("tacDots").innerHTML = items.map((it, i) =>
    `<button type="button" class="tac-dot ${it.result || ""} ${i === tac.idx ? "cur" : ""}" data-ti="${i}" title="${esc(L.taskTitle(i + 1, it.puzzle.review))}">${it.result === "solved" ? "✓" : it.result === "failed" ? "✗" : i + 1}</button>`
  ).join("");
  $id("tacDots").hidden = !items.length;
  if (st) {
    const parts = [L.pool(st.new, st.learning, st.learned)];
    if (st.last30_done) parts.push(L.last30(Math.round((st.last30_solved / st.last30_done) * 100)));
    $id("tacStats").textContent = parts.join(" · ");
  } else {
    $id("tacStats").textContent = "";
  }
  renderTabs();
}

function renderTacEmpty() {
  const L = tr(), d = tac.data;
  let html;
  if (d.problem === "disabled") html = esc(L.disabled);
  else if (d.problem === "no_engine") html = esc(L.noEngine);
  else if (d.preparing) html = `${esc(L.preparing)}<br><span class="muted">${esc(L.preparingSub)}</span>`;
  else if (d.problem === "failed") html = esc(L.failed(d.error || ""));
  else html = esc(L.none);
  $id("tacBody").innerHTML = `<div class="tac-empty">${html}</div>`;
}

// Stellung zu Beginn des aktuellen Schritts. Nach einem falschen Zug geht es
// genau hierhin zurueck - nicht auf eine Kopie, die ein zweiter, gleichzeitig
// laufender Zug schon veraendert haben koennte.
function saveStep(P) {
  P.step = { board: P.board.slice(), last: P.last ? P.last.slice() : null, legal: P.legal.slice(), moves: P.moves.slice() };
}
function restoreStep(P) {
  const st = P.step;
  P.board = st.board.slice();
  P.last = st.last ? st.last.slice() : null;
  P.legal = st.legal.slice();
  P.moves = st.moves.slice();
  P.sel = null;
  P.marks = {};
}

function renderTacSummary() {
  cancelDrag();
  tac.idx = -1; tac.pos = null;
  renderTacHead();
  const L = tr(), items = tac.data.items;
  const solved = items.filter((i) => i.result === "solved").length;
  const again = items.filter((i) => i.result === "failed").length;
  $id("tacBody").innerHTML = `<div class="tac-empty">
    <div class="big">${solved === items.length ? "🏆" : "✓"}</div>
    <p style="margin:6px 0 2px"><strong>${esc(L.summary(solved, items.length))}</strong></p>
    <p class="muted" style="margin:0">${again ? esc(L.again(again)) : ""}${esc(L.tapNumber)}</p>
  </div>`;
}

// keep: nur neu zeichnen (Sprachwechsel), Zustand der Aufgabe behalten.
function openItem(i, quiet = false, keep = false) {
  const item = tac.data.items[i];
  if (!item) return;
  const L = tr();
  if (!keep || !tac.pos || tac.pos.item !== item) {
    tac.idx = i;
    cancelDrag();
    const pz = item.puzzle;
    tac.pos = {
      item, board: fenBoard(pz.fen), legal: pz.legal, moves: [], last: moveSquares(pz.last_move),
      sel: null, marks: {}, phase: item.result ? "done" : "solve", msg: "", msgCls: "", hint: false,
      step: null,
    };
    saveStep(tac.pos);
    if (item.result) {
      tac.pos.msgKey = item.result === "solved" ? "alreadySolved" : "alreadyFailed";
      tac.pos.msgCls = item.result === "solved" ? "good" : "bad";
    }
  }
  if (quiet) { renderTacHead(); return; }
  const P = tac.pos, pz = item.puzzle;
  if (P.msgKey) P.msg = L[P.msgKey];
  const task = pz.moves_to_find > 1 ? L.findLine(pz.moves_to_find) : L.findBest;
  const tag = pz.review ? `<span class="tag">${esc(L.tagReview(pz.box))}</span>` : `<span class="tag accent">${esc(L.tagNew)}</span>`;
  $id("tacBody").innerHTML = `
    <div class="tac-meta"><span><b>${esc(pz.to_move === "white" ? L.white : L.black)}</b> · ${esc(task)}</span>${tag}</div>
    <div class="board-wrap"><div class="board" id="board" aria-label="Chessboard"></div></div>
    <div class="tac-msg" id="tacMsg"></div>
    <div class="tac-actions" id="tacActions"></div>
    <div id="tacExplain"></div>`;
  renderTacHead();
  renderBoard();
  renderTacControls();
}

function renderBoard() {
  const P = tac.pos, el = $id("board");
  if (!P || !el) return;
  const white = P.item.puzzle.orientation === "white";
  const dests = new Set(P.sel == null ? [] :
    P.legal.filter((u) => u.startsWith(sqName(P.sel))).map((u) => sqIndex(u.slice(2, 4))));
  let html = "";
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const rank = white ? 7 - r : r, file = white ? c : 7 - c, i = rank * 8 + file;
      const cls = ["sq", (rank + file) % 2 ? "l" : "d"];
      if (P.last && P.last.includes(i)) cls.push("last");
      if (P.sel === i) cls.push("sel");
      if (dests.has(i)) cls.push("dest", P.board[i] ? "occ" : "");
      if (P.marks[i]) cls.push(P.marks[i]);
      const p = P.board[i];
      const piece = p ? `<span class="pc ${p === p.toUpperCase() ? "w" : "b"}">${GLYPH[p.toLowerCase()]}︎</span>` : "";
      const coords = (c === 0 ? `<span class="coord r">${rank + 1}</span>` : "") + (r === 7 ? `<span class="coord f">${FILES[file]}</span>` : "");
      html += `<div class="${cls.join(" ")}" data-i="${i}">${coords}${piece}</div>`;
    }
  }
  el.innerHTML = html;
}

function hintText(pz) {
  const L = tr(), h = pz.hint || {};
  if (h.mate_in) return L.hintMate(h.mate_in);
  if (h.missed_motif && L.motif[h.missed_motif]) return L.hintMotif(L.motif[h.missed_motif]);
  return L.errHint[h.error_type] ? `${L.hintWord} ${L.errHint[h.error_type]}` : L.hintDefault;
}

function nextText(box, due) {
  const L = tr();
  if (box >= 6) return L.learned;
  return due ? L.comesBack(date(due)) : "";
}

function explainHtml(item) {
  const L = tr(), e = item.explain;
  if (!e) return "";
  const g = item.puzzle.game;
  const pct = (v) => (v == null ? "?" : `${Math.round(v)} %`);
  const who = (g.opponent ? L.vs(g.opponent) : "") + (g.played_at ? L.on(date(g.played_at)) : "");
  const san = (s) => `<span class="san">${esc(s)}</span>`;
  return `<div class="explain">
    <p>${esc(L.inGame(who, "\u0000", pct(e.win_played), pct(e.win_best))).replace("\u0000", san(e.played_san))}${e.punish_san ? esc(L.bestAfter("\u0000")).replace("\u0000", san(e.punish_san)) : ""}</p>
    <p>${esc(L.better("\u0000")).replace("\u0000", san(e.solution_san))}</p>
    ${g.url ? `<p><a href="${esc(g.url)}" target="_blank" rel="noopener noreferrer">${esc(L.openGame)}</a></p>` : ""}
  </div>`;
}

function renderTacControls() {
  const P = tac.pos, L = tr();
  if (!P || !$id("tacMsg")) return;
  const msg = $id("tacMsg");
  msg.textContent = P.msg;
  msg.className = "tac-msg " + (P.msgCls || "");
  const busy = P.phase === "busy" || P.phase === "replay";
  let html = "";
  if (P.phase === "solve" || P.phase === "busy") {
    html = `<button type="button" class="btn" data-ta="hint" ${busy || P.hint ? "disabled" : ""}>${esc(L.hint)}</button>
            <button type="button" class="btn" data-ta="reveal" ${busy ? "disabled" : ""}>${esc(L.reveal)}</button>`;
    if (P.item.result) html += `<span class="grow"></span><button type="button" class="btn" data-ta="next" ${busy ? "disabled" : ""}>${esc(L.next)}</button>`;
  } else {
    html = `<button type="button" class="btn" data-ta="replay" ${busy ? "disabled" : ""}>${esc(L.replay)}</button>
            <button type="button" class="btn" data-ta="retry" ${busy ? "disabled" : ""}>${esc(L.retry)}</button>
            <span class="grow"></span>
            <button type="button" class="btn primary" data-ta="next" ${busy ? "disabled" : ""}>${esc(L.next)}</button>`;
  }
  $id("tacActions").innerHTML = html;
  $id("tacExplain").innerHTML = P.phase === "done" || P.phase === "replay" ? explainHtml(P.item) : "";
}

// Meldungen werden als Text gespeichert; ein Sprachwechsel mitten in einer
// Aufgabe laesst die letzte Meldung stehen - die naechste kommt neu.
function setMsg(text, cls = "") {
  if (!tac.pos) return;
  tac.pos.msg = text;
  tac.pos.msgKey = null;
  tac.pos.msgCls = cls;
  renderTacControls();
}

function own(piece) {
  if (!piece || !tac.pos) return false;
  const white = tac.pos.item.puzzle.to_move === "white";
  return white ? piece === piece.toUpperCase() : piece === piece.toLowerCase();
}
function isDest(from, to) {
  const base = sqName(from) + sqName(to);
  return tac.pos.legal.some((u) => u.startsWith(base));
}

async function tryMove(from, to) {
  const P = tac.pos, L = tr();
  // Nie zwei Zuege gleichzeitig: solange einer unterwegs ist oder die
  // Widerlegung laeuft, wird nichts angenommen.
  if (!P || P.phase !== "solve") return;
  const base = sqName(from) + sqName(to);
  const cands = P.legal.filter((u) => u.startsWith(base));
  if (!cands.length) return;
  // Umwandlung: Dame. Eine Unterverwandlung als Loesung ist selten, und wenn
  // die Dame genauso gewinnt, zaehlt sie ohnehin.
  const uci = cands.find((u) => u.length === 4 || u[4] === "q") || cands[0];
  P.sel = null;
  P.board = applyUci(P.board, uci);
  P.last = [from, to];
  P.phase = "busy";
  renderBoard();
  setMsg("");
  let res;
  try {
    res = await apiJson("tactics/move", { day: tac.data.day, key: P.item.key, moves: [...P.moves, uci] });
  } catch (err) {
    restoreStep(P);
    P.phase = "solve";
    renderBoard(); setMsg(""); toast(err.message);
    return;
  }
  if (tac.pos !== P) return;
  if (res.result === "correct") {
    P.moves.push(uci, res.reply);
    setMsg(L.correct(res.san), "good");
    await sleep(420);
    if (tac.pos !== P) return;
    P.board = applyUci(P.board, res.reply);
    P.last = moveSquares(res.reply);
    P.legal = res.legal;
    P.phase = "solve";
    saveStep(P);
    renderBoard();
    setMsg(tr().correctReply(res.san, res.reply_san), "good");
  } else if (res.result === "solved") {
    P.moves.push(uci);
    P.marks = { [to]: "good" };
    P.phase = "done";
    renderBoard();
    finishItem(res);
  } else {
    P.marks = { [to]: "bad" };
    renderBoard();
    if (res.counted && !P.item.result) { P.item.result = "failed"; renderTacHead(); }
    const txt = L.wrong(res.san) + (res.punish_san ? L.punish(res.punish_san) : "");
    setMsg(txt, "bad");
    if (res.punish) {
      await sleep(450);
      if (tac.pos !== P) return;
      P.board = applyUci(P.board, res.punish);
      P.last = moveSquares(res.punish);
      renderBoard();
    }
    await sleep(900);
    if (tac.pos !== P) return;
    restoreStep(P);
    P.phase = "solve";
    renderBoard();
    setMsg(txt + tr().tryAgain, "bad");
  }
}

function finishItem(res) {
  const P = tac.pos, item = P.item, L = tr();
  if (res.counted) item.result = "solved";
  if (res.explain) item.explain = res.explain;
  let txt = res.alternative ? L.alt(res.san, res.main_san) : L.solved(res.san);
  if (res.counted) txt += " " + nextText(res.box, res.due);
  else if (item.result === "failed") txt += L.stillFailed;
  P.phase = "done";
  setMsg(txt, "good");
  renderTacHead();
  afterResult(res);
}

function afterResult(res) {
  if (res.day_complete) toast(tr().dayComplete);
  api("tactics/today?day=" + localDay())
    .then((d) => { if (tac.data && d.day === tac.data.day) { tac.data.stats = d.stats; renderTacHead(); } })
    .catch(() => {});
}

async function playLine(P, line, firstDelay = 350) {
  P.board = fenBoard(P.item.puzzle.fen);
  P.last = moveSquares(P.item.puzzle.last_move);
  P.marks = {};
  P.sel = null;
  renderBoard();
  await sleep(firstDelay);
  for (const u of line) {
    if (tac.pos !== P) return;
    P.board = applyUci(P.board, u);
    P.last = moveSquares(u);
    renderBoard();
    await sleep(750);
  }
}

async function reveal() {
  const P = tac.pos;
  P.phase = "busy";
  renderTacControls();
  let res;
  try {
    res = await apiJson("tactics/reveal", { day: tac.data.day, key: P.item.key });
  } catch (err) { P.phase = "solve"; renderTacControls(); toast(err.message); return; }
  if (!P.item.result) P.item.result = "failed";
  P.item.explain = res.explain;
  renderTacHead();
  P.phase = "replay";
  setMsg(tr().howItGoes);
  await playLine(P, res.explain.solution);
  if (tac.pos !== P) return;
  P.phase = "done";
  setMsg(tr().solution(res.explain.solution_san) + (res.counted ? nextText(res.box, res.due) : ""), "");
  afterResult(res);
}

function nextOpen() {
  const items = tac.data.items;
  for (let k = 1; k <= items.length; k++) {
    const j = (tac.idx + k) % items.length;
    if (!items[j].result) return j;
  }
  return -1;
}

$id("tacDots").addEventListener("click", (e) => {
  const b = e.target.closest("[data-ti]");
  if (b && (!tac.pos || tac.pos.phase !== "busy")) openItem(Number(b.dataset.ti));
});

$id("tacBody").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-ta]");
  if (!b || !tac.pos || b.disabled) return;
  const P = tac.pos;
  const a = b.dataset.ta;
  if (a === "hint") { P.hint = true; setMsg(hintText(P.item.puzzle)); }
  else if (a === "reveal") reveal();
  else if (a === "next") { const j = nextOpen(); if (j < 0) renderTacSummary(); else openItem(j); }
  else if (a === "retry") {
    openItem(tac.idx);
    tac.pos.phase = "solve";
    setMsg(tr().practice);
  }
  else if (a === "replay" && P.item.explain) {
    P.phase = "replay"; renderTacControls();
    await playLine(P, P.item.explain.solution);
    if (tac.pos === P) { P.phase = "done"; renderTacControls(); }
  }
});

// Ziehen und Tippen. Tippen: Figur, dann Zielfeld. Ziehen: Figur festhalten
// und auf das Zielfeld fallen lassen.
// Der Zeiger wird am Brett-Element festgehalten (setPointerCapture). Das
// Element bleibt beim Neuzeichnen bestehen - nur sein Inhalt wechselt. Ohne
// das gingen Loslassen-Ereignisse verloren: in Safari, weil das beruehrte
// Feld beim Neuzeichnen verschwindet, und am PC, wenn man ausserhalb eines
// iframes loslaesst. Dann blieb die gezogene Figur als Geist stehen.
let drag = null;
function cancelDrag() {
  if (drag) {
    const b = $id("board");
    if (b && drag.pointerId != null && b.hasPointerCapture && b.hasPointerCapture(drag.pointerId)) {
      try { b.releasePointerCapture(drag.pointerId); } catch { /* egal */ }
    }
  }
  drag = null;
  document.querySelectorAll(".drag-ghost").forEach((g) => g.remove());
  document.querySelectorAll("#board .sq.dragging").forEach((q) => q.classList.remove("dragging"));
}
function sqFromPoint(x, y) {
  const el = document.elementFromPoint(x, y);
  const s = el && el.closest ? el.closest(".sq") : null;
  return s && s.closest("#board") ? Number(s.dataset.i) : null;
}
$id("tacBody").addEventListener("pointerdown", (e) => {
  const boardEl = e.target.closest("#board");
  if (!boardEl) return;
  cancelDrag(); // was auch immer vorher haengen blieb
  if (e.button != null && e.button > 0) return; // nur linke Maustaste / Finger
  const s = e.target.closest(".sq");
  const P = tac.pos;
  if (!s || !P || P.phase !== "solve") return;
  const i = Number(s.dataset.i);
  if (P.sel != null && P.sel !== i && isDest(P.sel, i)) { e.preventDefault(); tryMove(P.sel, i); return; }
  if (!own(P.board[i])) { if (P.sel != null) { P.sel = null; renderBoard(); } return; }
  e.preventDefault();
  try { boardEl.setPointerCapture(e.pointerId); } catch { /* egal */ }
  const wasSel = P.sel === i;
  P.sel = i;
  renderBoard();
  const size = boardEl.clientWidth / 8;
  const src = boardEl.querySelector(`.sq[data-i="${i}"] .pc`);
  const ghost = src.cloneNode(true);
  ghost.classList.add("drag-ghost");
  ghost.style.fontSize = `${size * 0.9}px`;
  ghost.style.display = "none";
  document.body.appendChild(ghost);
  drag = { from: i, ghost, moved: false, x0: e.clientX, y0: e.clientY, wasSel, pointerId: e.pointerId };
});
$id("tacBody").addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.pointerId) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
  if (!drag.moved) {
    drag.moved = true;
    drag.ghost.style.display = "";
    const sq = document.querySelector(`#board .sq[data-i="${drag.from}"]`);
    if (sq) sq.classList.add("dragging");
  }
  drag.ghost.style.left = `${e.clientX}px`;
  drag.ghost.style.top = `${e.clientY}px`;
});
function endDrag(e, cancel) {
  if (!drag || (e && e.pointerId !== drag.pointerId)) return;
  const d = drag;
  const to = !cancel && d.moved && e ? sqFromPoint(e.clientX, e.clientY) : null;
  cancelDrag();
  const P = tac.pos;
  if (!P) return;
  if (d.moved) {
    if (to != null && to !== d.from && isDest(d.from, to)) { tryMove(d.from, to); return; }
    renderBoard();
  } else if (d.wasSel) {
    P.sel = null; // zweiter Tipp auf dieselbe Figur hebt die Auswahl auf
    renderBoard();
  }
}
$id("tacBody").addEventListener("pointerup", (e) => endDrag(e, false));
$id("tacBody").addEventListener("pointercancel", (e) => endDrag(e, true));
$id("tacBody").addEventListener("lostpointercapture", (e) => { if (drag && e.pointerId === drag.pointerId) endDrag(e, true); });
// Sicherheitsnetz: Fenster verliert den Fokus mitten im Ziehen.
window.addEventListener("blur", () => { if (drag) { cancelDrag(); if (tac.pos && tac.pos.phase === "solve") renderBoard(); } });

// Handy aus der Tasche: nach laengerer Pause oder an einem neuen Tag frische
// Aufgaben holen - aber nie mitten in einen Zug hinein.
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); if (drag) cancelDrag(); return; }
  const newDay = tac.data && tac.data.day !== localDay();
  if ((newDay || Date.now() - hiddenAt > 10 * 60 * 1000) && (!tac.pos || tac.pos.phase !== "busy")) loadTactics(!newDay);
});

// --------------------------------------------------------------------------
// Klicks
// --------------------------------------------------------------------------
document.addEventListener("click", (event) => {
  const el = event.target.closest("[data-tc],[data-pf],[data-range],[data-color],[data-err],[data-sort],[data-more],[data-miss],[data-msort],[data-mmore],[data-mmate],[data-emate]");
  if (!el) return;

  if (el.dataset.pf) {
    platform = el.dataset.pf;
    store.set("knightmare.platform", platform);
    // Partiearten hängen von der Plattform ab (Classical gibt es nur bei
    // Lichess) - eine Auswahl, die es nicht mehr gibt, würde leer aussehen.
    timeClass = "all";
    store.set("knightmare.timeClass", timeClass);
    loadAll();
    return;
  }
  if (el.dataset.tc) { timeClass = el.dataset.tc; store.set("knightmare.timeClass", timeClass); loadAll(); return; }
  if (el.dataset.range) { range = el.dataset.range; store.set("knightmare.range", range); loadAll(); return; }
  if (el.dataset.color) { color = el.dataset.color; loadAll(); return; }
  // Leerer Wert = "Alle" - darum auf das Vorhandensein pruefen, nicht auf den Inhalt.
  if ("emate" in el.dataset) {
    loadErrors(el.dataset.mfor2, { sort: list.sort, mate: el.dataset.emate });
    return;
  }
  if ("mmate" in el.dataset) {
    loadMissed(el.dataset.mfor2, { sort: missList.sort, mate: el.dataset.mmate });
    return;
  }
  if (el.dataset.sort) { loadErrors(el.dataset.for, { sort: el.dataset.sort, mate: list.mate }); return; }
  if (el.dataset.more) {
    loadErrors(el.dataset.more, { sort: list.sort, mate: list.mate, append: true, offset: list.items.length });
    return;
  }
  if (el.dataset.msort) { loadMissed(el.dataset.mfor, { sort: el.dataset.msort, mate: missList.mate }); return; }
  if (el.dataset.mmore) {
    loadMissed(el.dataset.mmore, {
      sort: missList.sort, mate: missList.mate, append: true, offset: missList.items.length,
    });
    return;
  }
  if (el.dataset.miss) {
    if (missExpanded === el.dataset.miss) { missExpanded = null; render(); }
    else { missExpanded = el.dataset.miss; loadMissed(el.dataset.miss, { sort: missList.sort }); }
    return;
  }
  if (el.dataset.err) {
    if (expanded === el.dataset.err) { expanded = null; render(); }
    else { expanded = el.dataset.err; loadErrors(el.dataset.err, { sort: list.sort }); }
  }
});

document.getElementById("langBtn").addEventListener("click", () => {
  lang = lang === "de" ? "en" : "de";
  store.set("knightmare.lang", lang);
  render();
  if (view === "train") renderTraining();
});
document.getElementById("refreshBtn").addEventListener("click", () => {
  loadAll();
  if (!tac.pos || tac.pos.phase !== "busy") loadTactics(true);
});
document.getElementById("syncBtn").addEventListener("click", async () => {
  await post("sync");
  loadStatus();
});
document.getElementById("reBtn").addEventListener("click", async () => {
  if (!confirmRe) {
    confirmRe = true; render();
    setTimeout(() => { confirmRe = false; render(); }, 5000);
    return;
  }
  confirmRe = false;
  await post("reanalyze" + (timeClass !== "all" ? "?time_class=" + timeClass : ""));
  loadStatus();
});

// Waehrend ein Durchgang laeuft, den Status nachziehen.
setInterval(() => {
  if (data.status && data.status.run && data.status.run.running) loadStatus();
}, 4000);

renderTabs();
if (view === "train") renderTraining();
loadAll();
loadTactics();
</script>
