// --------------------------------------------------------------------------
// Eroeffnungs-Drill: Stellung aus einem wiederkehrenden Fehler, finde den
// besseren Zug. Geprueft vom Server mit Stockfish - jeder Zug, der hoechstens
// ein paar Punkte schlechter ist als der beste, zaehlt.
// --------------------------------------------------------------------------
const dr = { items: [], idx: 0, board: null, sel: null, state: "idle", res: null, first: true, solved: 0, marks: {} };

function startDrill(ids) {
  const all = (rp.leaks && rp.leaks.leaks) || [];
  dr.items = ids ? all.filter((l) => ids.includes(l.id)) : all.slice();
  dr.idx = 0; dr.solved = 0;
  if (!dr.items.length) return;
  openDrill();
  const box = $id("drillBox");
  if (box) box.scrollIntoView({ behavior: "smooth", block: "start" });
}
function openDrill() {
  const l = dr.items[dr.idx];
  dr.board = fenBoard(l.fen); dr.sel = null; dr.state = "move"; dr.res = null; dr.first = true; dr.marks = {};
  renderDrill();
}
function renderDrill() {
  const box = $id("drillBox");
  if (!box) return;
  if (dr.state === "idle" || !dr.items.length) { box.innerHTML = ""; return; }
  const X = tx(), L = t();
  if (dr.state === "finished") {
    box.innerHTML = `<div class="drill"><p class="tac-msg good">${esc(X.drillDone(dr.solved, dr.items.length))}</p>
      <div class="tac-actions"><button class="btn" type="button" data-dclose="1">${esc(X.drillClose)}</button></div></div>`;
    return;
  }
  const l = dr.items[dr.idx];
  const white = l.color === "white";
  const dests = new Set(dr.sel == null ? [] : l.legal.filter((u) => u.startsWith(sqName(dr.sel))).map((u) => sqIndex(u.slice(2, 4))));
  const last = l.last_move ? [sqIndex(l.last_move.slice(0, 2)), sqIndex(l.last_move.slice(2, 4))] : [];
  let html = "";
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const rank = white ? 7 - r : r, file = white ? c : 7 - c, i = rank * 8 + file;
    const cls = ["sq", (rank + file) % 2 ? "l" : "d"];
    if (last.includes(i) && dr.state === "move") cls.push("last");
    if (dr.sel === i) cls.push("sel");
    if (dests.has(i)) cls.push("dest", dr.board[i] ? "occ" : "");
    if (dr.marks[i]) cls.push(dr.marks[i]);
    const p = dr.board[i];
    const piece = p ? `<span class="pc ${p === p.toUpperCase() ? "w" : "b"}">${GLYPH[p.toLowerCase()]}︎</span>` : "";
    const coords = (c === 0 ? `<span class="coord r">${rank + 1}</span>` : "") + (r === 7 ? `<span class="coord f">${FILES[file]}</span>` : "");
    html += `<div class="${cls.join(" ")}" data-di="${i}">${coords}${piece}</div>`;
  }
  let msg = "", cls = "";
  const res = dr.res;
  if (dr.state === "busy") msg = esc(X.drillThinking);
  else if (dr.state === "move") msg = X.drillAsk(esc(sideName(l.color)), esc(l.san));
  else if (res && res.error) { msg = esc(res.error); cls = "bad"; }
  else if (res && res.result === "good") {
    cls = "good";
    msg = res.best_san && res.best_san !== res.san ? X.drillGoodAlt(esc(res.san), esc(res.best_san)) : X.drillGood(esc(res.san));
  } else if (res) {
    cls = "bad";
    msg = (res.san === l.san ? X.drillSame(esc(res.san)) + " " : "") + X.drillBad(esc(res.san), res.reply_san ? esc(res.reply_san) : "", esc(res.best_san || l.best_san || "?"));
  }
  const actions = dr.state === "result"
    ? (res && res.result === "good"
        ? `<button class="btn primary grow" type="button" data-dnext="1">${esc(X.drillNext)}</button>`
        : `<button class="btn" type="button" data-dretry="1">${esc(X.drillRetry)}</button><button class="btn primary grow" type="button" data-dnext="1">${esc(X.drillNext)}</button>`)
    : "";
  box.innerHTML = `<div class="drill">
    <div class="tac-meta"><strong>${esc(X.drillTitle(dr.idx + 1, dr.items.length))}</strong>
      <span class="muted">${esc(l.path_text)}</span>
      <button class="linkbtn" type="button" data-dclose="1">${esc(X.drillClose)}</button></div>
    <div class="board-wrap"><div class="board" id="drillBoard">${html}</div></div>
    <p class="tac-msg ${cls}">${msg}</p>
    <div class="tac-actions">${actions}</div>
  </div>`;
}

async function drillMove(from, to) {
  const l = dr.items[dr.idx];
  let uci = sqName(from) + sqName(to);
  if (!l.legal.includes(uci)) {
    if (l.legal.includes(uci + "q")) uci += "q";
    else return;
  }
  dr.board = applyUci(dr.board, uci);
  dr.sel = null; dr.state = "busy"; dr.marks = {};
  renderDrill();
  let res;
  try {
    res = await apiJson("repertoire/check", { fen: l.fen, uci });
  } catch (err) {
    const msg = String(err.message || err);
    res = { error: msg.includes("no_engine") ? tx().drillNoEngine : tx().drillErr(msg) };
  }
  dr.res = res; dr.state = "result";
  if (!res.error) {
    const ok = res.result === "good";
    dr.marks[sqIndex(uci.slice(0, 2))] = ok ? "good" : "bad";
    dr.marks[sqIndex(uci.slice(2, 4))] = ok ? "good" : "bad";
    if (!ok && res.best_uci) {
      dr.marks[sqIndex(res.best_uci.slice(0, 2))] = dr.marks[sqIndex(res.best_uci.slice(0, 2))] || "good";
      dr.marks[sqIndex(res.best_uci.slice(2, 4))] = "good";
    }
    if (dr.first) {
      if (ok) dr.solved += 1;
      drillStore.set(l.id, ok);
    }
    dr.first = false;
  }
  renderDrill();
  renderLeaks();
}

document.addEventListener("click", (e) => {
  const sq = e.target.closest("[data-di]");
  if (sq && dr.state === "move") {
    const i = Number(sq.dataset.di), l = dr.items[dr.idx];
    const p = dr.board[i];
    const mine = p && ((p === p.toUpperCase()) === (l.color === "white"));
    if (dr.sel != null && dr.sel !== i && l.legal.some((u) => u.startsWith(sqName(dr.sel) + sqName(i)))) { drillMove(dr.sel, i); return; }
    dr.sel = mine && dr.sel !== i ? i : null;
    renderDrill();
    return;
  }
  const el = e.target.closest("[data-ompick],[data-omboard],[data-ominacc],[data-omsort],[data-ommore],[data-game],[data-gmore],[data-report],[data-lboard],[data-ldrill],[data-ltree],[data-tkey],[data-dnext],[data-dretry],[data-dclose],#drillAllBtn");
  if (!el) return;
  if (el.id === "drillAllBtn") { startDrill(null); return; }
  const ds = el.dataset;
  if ("ompick" in ds) { om.pick = ds.ompick && om.pick !== ds.ompick ? ds.ompick : null; om.shown = 15; renderOpeningMistakes(); return; }
  if (ds.omboard) { om.open.has(ds.omboard) ? om.open.delete(ds.omboard) : om.open.add(ds.omboard); renderOpeningMistakes(); return; }
  if ("ominacc" in ds) { om.inacc = ds.ominacc === "1"; renderOpeningsView(); return; }
  if (ds.omsort) { om.sort = ds.omsort; renderOpeningMistakes(); return; }
  if (ds.ommore) { om.shown += 15; renderOpeningMistakes(); return; }
  if (ds.game) { loadReport(Number(ds.game), true); return; }
  if (ds.gmore) { loadGameList(true); return; }
  if (ds.report) { e.preventDefault(); gv.sel = Number(ds.report); gv.reportFor = null; setView("games"); loadReport(gv.sel); window.scrollTo(0, 0); return; }
  if (ds.lboard) { rp.open.has(ds.lboard) ? rp.open.delete(ds.lboard) : rp.open.add(ds.lboard); renderLeaks(); return; }
  if (ds.ldrill) { startDrill([ds.ldrill]); return; }
  if (ds.ltree) {
    const l = ((rp.leaks && rp.leaks.leaks) || []).find((x) => x.id === ds.ltree);
    if (!l) return;
    if (treeColor() !== l.color) { color = l.color; rp.treeSig = filterSig(treeColor()); renderFilters(); loadAll(); }
    loadTree(l.key);
    $id("treeCard").scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  if ("tkey" in ds) { loadTree(ds.tkey || null); return; }
  if (ds.dnext) { dr.idx += 1; if (dr.idx >= dr.items.length) { dr.state = "finished"; renderDrill(); } else openDrill(); return; }
  if (ds.dretry) { const keep = dr.first; openDrill(); dr.first = keep; return; }
  if (ds.dclose) { dr.state = "idle"; dr.items = []; renderDrill(); return; }
});

}
async function loadWood() {
  px.woodLoading = true;
  try { px.wood = await api("woodpecker"); } catch (err) { px.wood = { error: err.message }; }
  px.woodLoading = false;
  if (trMode === "woodpecker") renderPractice();
}

function renderPractice() {
  if (view !== "train" || trMode === "daily") return;
  const P = tp();
  $id("pxTitle").textContent = P.modes[trMode];
  $id("pxIntro").textContent = P.intro[trMode];
  if (trMode === "woodpecker") { renderWood(); return; }
  const d = px.data[trMode];
  if (!d && !px.loading[trMode]) { loadPractice(trMode); }
  if (!d || px.loading[trMode] && !d.items) {
    $id("pxBody").innerHTML = `<p class="muted">${esc(P.preparing)}</p>`; return;
  }
  if (d.error) { $id("pxBody").innerHTML = `<p class="note err">${esc(d.error)}</p>`; return; }
  if (!d.items.length) {
    $id("pxBody").innerHTML = `<p class="muted">${esc(d.engine === false ? P.noEngine : P.none[trMode])}</p>`; return;
  }
  if (pb.kind !== trMode || pb.state === "idle") {
    const i = Math.min(px.idx[trMode] || 0, d.items.length - 1);
    startItem(trMode, i);
    return;
  }
  drawPractice();
}

function startItem(kind, i) {
  const d = px.data[kind], item = d.items[i];
  px.idx[kind] = i;
  Object.assign(pb, {
    kind, item, board: fenBoard(item.fen), legal: kind === "threat" ? item.legal_them : item.legal,
    sel: null, marks: {}, last: moveSquares(item.last_move), white: item.orientation !== "black",
    moves: [], state: "move", msg: "", cls: "", extra: "", started: Date.now(),
  });
  pb.msg = promptFor(item);
  drawPractice();
}

function promptFor(item) {
  const P = tp(), g = item.game || {};
  const opp = g.opponent || "?";
  if (pb.kind === "convert") return P.convertAsk(P.side(item.orientation), num(item.win_start, 0), opp, date(g.played_at), num(item.fail_below, 0));
  if (pb.kind === "threat") return P.threatAsk(opp, P.side(item.orientation));
  return "";
}

function myPiece(p) {
  if (!p) return false;
  const white = p === p.toUpperCase();
  // Bei "Was droht?" zieht man die Figuren des Gegners.
  const mover = pb.kind === "threat" ? !pb.white : pb.white;
  if (pb.kind === "woodpecker") return white === (pb.item.puzzle.to_move === "white");
  return white === mover;
}

function drawPractice() {
  const P = tp(), d = px.data[pb.kind];
  if (pb.kind === "woodpecker") { renderWood(); return; }
  const list = d.items.map((it, i) =>
    `<button class="tac-dot ${it.solved ? "solved" : it.last_result === "failed" ? "failed" : ""} ${i === px.idx[pb.kind] ? "cur" : ""}" type="button" data-pxi="${i}" title="${esc(P.pick)} ${i + 1}">${i + 1}</button>`).join("");
  $id("pxBody").innerHTML = `
    <p class="muted">${esc(P.mastered(d.mastered, d.total))}</p>
    <div class="tac-dots">${list}</div>
    ${boardHtml()}
    <p class="tac-msg ${pb.cls}">${pb.msg}</p>
    ${pb.extra}
    <div class="tac-actions">${actionsHtml()}</div>`;
}

function boardHtml() {
  const dests = new Set(pb.sel == null ? [] : pb.legal.filter((u) => u.startsWith(sqName(pb.sel))).map((u) => sqIndex(u.slice(2, 4))));
  let html = "";
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const rank = pb.white ? 7 - r : r, file = pb.white ? c : 7 - c, i = rank * 8 + file;
    const cls = ["sq", (rank + file) % 2 ? "l" : "d"];
    if (pb.last && pb.last.includes(i)) cls.push("last");
    if (pb.sel === i) cls.push("sel");
    if (dests.has(i)) cls.push("dest", pb.board[i] ? "occ" : "");
    if (pb.marks[i]) cls.push(pb.marks[i]);
    const p = pb.board[i];
    const piece = p ? `<span class="pc ${p === p.toUpperCase() ? "w" : "b"}">${GLYPH[p.toLowerCase()]}︎</span>` : "";
    const coords = (c === 0 ? `<span class="coord r">${rank + 1}</span>` : "") + (r === 7 ? `<span class="coord f">${FILES[file]}</span>` : "");
    html += `<div class="${cls.join(" ")}" data-pi="${i}">${coords}${piece}</div>`;
  }
  return `<div class="board-wrap"><div class="board" id="pxBoard">${html}</div></div>`;
}

function actionsHtml() {
  const P = tp();
  const b = (attr, label, primary) => `<button class="btn${primary ? " primary grow" : ""}" type="button" ${attr}="1">${esc(label)}</button>`;
  if (pb.kind === "convert") {
    if (pb.state === "move" || pb.state === "busy") return pb.moves.length ? b("data-pxgive", P.giveup) : "";
    return b("data-pxretry", P.retry) + b("data-pxnext", P.next, true);
  }
  if (pb.kind === "threat") {
    if (pb.state === "move") return b("data-pxreveal", P.reveal);
    if (pb.state === "busy") return "";
    return b("data-pxnext", P.next, true);
  }
  return "";
}

function markMove(uci, cls) {
  if (!uci) return;
  pb.marks[sqIndex(uci.slice(0, 2))] = cls;
  pb.marks[sqIndex(uci.slice(2, 4))] = cls;
}

async function practiceMove(from, to) {
  let uci = sqName(from) + sqName(to);
  if (!pb.legal.includes(uci)) {
    if (pb.legal.includes(uci + "q")) uci += "q"; else return;
  }
  const P = tp();
  pb.board = applyUci(pb.board, uci);
  pb.sel = null; pb.marks = {}; pb.last = moveSquares(uci);
  pb.state = "busy"; pb.msg = esc(P.engineThinking); pb.cls = "";
  if (pb.kind === "woodpecker") return woodMove(uci);
  drawPractice();
  try {
    if (pb.kind === "convert") {
      pb.moves.push(uci);
      const res = await apiJson("practice/convert/move", { key: pb.item.key, moves: pb.moves });
      if (res.reply) {
        pb.board = applyUci(pb.board, res.reply);
        pb.moves.push(res.reply);
        pb.last = moveSquares(res.reply);
      }
      if (res.status === "continue") {
        pb.legal = res.legal; pb.state = "move";
        pb.msg = esc(P.convertState(num(res.win, 0), res.own_moves + 1, 15)) + (res.reply_san ? ` · <span class="san">${esc(res.reply_san)}</span>` : "");
      } else {
        finishConvert(res);
      }
    } else {
      const res = await apiJson("practice/threat/check", { key: pb.item.key, uci });
      finishThreat(res, uci);
    }
  } catch (err) {
    pb.state = "move"; pb.msg = esc(err.message); pb.cls = "bad";
    if (pb.kind === "convert") { pb.moves.pop(); }
    pb.board = fenBoard(pb.kind === "convert" ? replayFen() : pb.item.fen);
  }
  drawPractice();
}

function replayFen() {
  // Fuer den Fehlerfall: Brett aus der Ausgangsstellung und den Zuegen neu aufbauen.
  let arr = fenBoard(pb.item.fen);
  pb.moves.forEach((u) => { arr = applyUci(arr, u); });
  pb.board = arr;
  return pb.item.fen;
}

function finishConvert(res) {
  const P = tp(), ok = res.status === "success";
  pb.state = "done"; pb.cls = ok ? "good" : "bad";
  pb.msg = esc(ok ? (P.convertWin[res.reason] || P.convertWin.limit) : (P.convertLose[res.reason] || P.convertLose.no_reply)) +
    (res.better_san ? esc(P.convertBetter(res.better_san)) : "");
  if (res.better_uci) markMove(res.better_uci, "good");
  const it = pb.item;
  it.last_result = ok ? "solved" : "failed";
  if (ok && !it.solved) px.data[pb.kind].mastered += 1;
  if (ok) it.solved = (it.solved || 0) + 1;
  pb.extra = gameLink(it);
}

function finishThreat(res, uci) {
  const P = tp(), it = pb.item;
  pb.state = "done";
  const sol = `<span class="san">${esc(res.solution_san)}</span>`;
  if (res.result === "good") { pb.cls = "good"; pb.msg = P.threatGood(sol); markMove(uci, "good"); }
  else if (res.result === "revealed") { pb.cls = "bad"; pb.msg = P.threatRevealed(sol); }
  else { pb.cls = "bad"; pb.msg = P.threatBad(`<span class="san">${esc(res.san)}</span>`, sol); if (uci) markMove(uci, "bad"); }
  if (res.result !== "good") {
    pb.board = fenBoard(it.fen);
    pb.board = applyUci(pb.board, res.solution);
    markMove(res.solution, "good");
  }
  it.last_result = res.result === "good" ? "solved" : "failed";
  if (res.result === "good" && !it.solved) px.data[pb.kind].mastered += 1;
  if (res.result === "good") it.solved = (it.solved || 0) + 1;
  pb.extra = `<div class="explain"><p>${P.threatGame(`<span class="san">${esc(res.played_san)}</span>`, res.best_san ? `<span class="san">${esc(res.best_san)}</span>` : "")}</p>${gameLinkInner(it)}</div>`;
}

function gameLinkInner(it) {
  const g = it.game || {};
  return g.url && g.platform !== "pgn" ? `<p><a href="${esc(g.url)}" target="_blank" rel="noopener noreferrer">${esc(tp().openGame)}</a></p>` : "";
}
function gameLink(it) {
  const inner = gameLinkInner(it);
  return inner ? `<div class="explain">${inner}</div>` : "";
}

// --- Woodpecker -----------------------------------------------------------
function fmtTime(sec) {
  const s = Math.round(sec || 0);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function woodCurrent() {
  const w = px.wood;
  if (!w || !w.active || w.finished) return -1;
  return w.items.findIndex((it) => !it.result);
}
function renderWood() {
  const P = tp(), w = px.wood;
  if (!w && !px.woodLoading) { loadWood(); }
  if (!w) { $id("pxBody").innerHTML = `<p class="muted">${esc(P.loading)}</p>`; return; }
  if (w.error) { $id("pxBody").innerHTML = `<p class="note err">${esc(w.error)}</p>`; return; }
  const hist = w.rounds && w.rounds.length
    ? `<h3 class="px-h3">${esc(P.wpHist)}</h3><table class="tt wp"><thead><tr>${P.wpHead.map((h, i) => `<th${i ? ' class="num"' : ""}>${esc(h)}</th>`).join("")}</tr></thead><tbody>` +
      w.rounds.map((r) => `<tr><td>${r.round}</td><td class="num">${r.solved}/${r.total}</td><td class="num">${fmtTime(r.seconds)}${r.finished ? "" : " …"}</td></tr>`).join("") + `</tbody></table>`
    : "";
  if (!w.active) {
    const enough = w.available >= w.min;
    $id("pxBody").innerHTML = enough
      ? `<div class="tac-actions"><button class="btn primary" type="button" data-wpstart="new">${esc(P.wpStart)}</button></div>`
      : `<p class="muted">${esc(P.wpNotEnough(w.available, w.min))}</p>`;
    return;
  }
  let idx = woodCurrent();
  // Nach dem Loesen bleibt die Aufgabe stehen, bis "Weiter" gedrueckt ist.
  if (pb.kind === "woodpecker" && pb.state === "done" && w.items.includes(pb.item)) idx = w.items.indexOf(pb.item);
  if (idx < 0) {
    const last = w.rounds[w.rounds.length - 1];
    $id("pxBody").innerHTML = `<p class="tac-msg good">${esc(P.wpDone(w.round, last.solved, last.total, fmtTime(last.seconds)))}</p>
      <p class="muted">${esc(P.wpTarget(fmtTime(last.seconds / 2)))}</p>
      <div class="tac-actions"><button class="btn primary" type="button" data-wpstart="next">${esc(P.wpNextRound(w.round + 1))}</button>
      <button class="btn" type="button" data-wpstart="new">${esc(P.wpNewSet)}</button></div>${hist}`;
    pb.state = "idle";
    return;
  }
  const item = w.items[idx];
  if (pb.kind !== "woodpecker" || pb.item !== item || pb.state === "idle") {
    const pz = item.puzzle;
    Object.assign(pb, {
      kind: "woodpecker", item, board: fenBoard(pz.fen), legal: pz.legal, sel: null, marks: {},
      last: moveSquares(pz.last_move), white: pz.orientation !== "black", moves: [], state: "move",
      msg: esc(P.wpFind(pz.moves_to_find)), cls: "", extra: "", started: Date.now(),
    });
  }
  const done = w.items.filter((it) => it.result).length;
  const dots = w.items.map((it, i) => `<span class="tac-dot ${it.result === "solved" ? "solved" : it.result ? "failed" : ""} ${i === idx ? "cur" : ""}">${i + 1}</span>`).join("");
  const elapsed = (w.seconds || 0);
  $id("pxBody").innerHTML = `
    <div class="tac-meta"><strong>${esc(P.wpRound(w.round, done, w.items.length))}</strong>
      <span class="muted" id="wpClock">${esc(P.wpTime(fmtTime(elapsed)))}</span></div>
    <div class="tac-dots wp-dots">${dots}</div>
    ${boardHtml()}
    <p class="tac-msg ${pb.cls}">${pb.msg}</p>
    ${pb.extra}
    <div class="tac-actions">${pb.state === "done"
      ? `<button class="btn primary grow" type="button" data-wpnext="1">${esc(tp().next)}</button>`
      : pb.state === "move" ? `<button class="btn" type="button" data-wpreveal="1">${esc(P.reveal)}</button>` : ""}</div>
    ${hist}`;
}

// Uhr: laufende Rundenzeit = gespeicherte Zeit + aktuelle Aufgabe.
setInterval(() => {
  const el = $id("wpClock");
  if (!el || pb.kind !== "woodpecker" || pb.state !== "move" && pb.state !== "busy" || !px.wood) return;
  el.textContent = tp().wpTime(fmtTime((px.wood.seconds || 0) + (Date.now() - pb.started) / 1000));
}, 1000);

async function woodMove(uci, reveal) {
  const P = tp(), item = pb.item;
  if (!reveal) pb.moves.push(uci);
  renderWood();
  const secs = (Date.now() - pb.started) / 1000;
  let res;
  try {
    res = await apiJson("woodpecker/move", { key: item.key, moves: reveal ? [] : pb.moves, seconds: secs, reveal: !!reveal });
  } catch (err) {
    pb.moves.pop(); pb.state = "move"; pb.msg = esc(err.message); pb.cls = "bad";
    let arr = fenBoard(item.puzzle.fen); pb.moves.forEach((u) => { arr = applyUci(arr, u); }); pb.board = arr;
    renderWood(); return;
  }
  if (res.result === "correct") {
    pb.board = applyUci(pb.board, res.reply);
    pb.moves.push(res.reply);
    pb.last = moveSquares(res.reply);
    pb.legal = res.legal; pb.state = "move"; pb.msg = esc(P.wpCorrect); pb.cls = "good";
    renderWood(); return;
  }
  const solved = res.result === "solved";
  if (uci) markMove(uci, solved ? "good" : "bad");
  const sol = (res.explain && res.explain.solution_san) || res.solution_san;
  pb.state = "done"; pb.cls = solved ? "good" : "bad";
  pb.msg = esc(solved ? P.wpSolved : reveal ? P.wpSolution(sol || "") : P.wpWrong(res.san || ""));
  if (!solved && sol) pb.extra = `<div class="explain"><p>${esc(P.wpSolution(sol))}</p></div>`;
  if (res.counted !== false) {
    item.result = solved ? "solved" : "failed";
    px.wood.seconds = (px.wood.seconds || 0) + secs;
  }
  renderWood();
}

document.addEventListener("click", async (e) => {
  const sq = e.target.closest("[data-pi]");
  if (sq && pb.state === "move") {
    const i = Number(sq.dataset.pi);
    if (pb.sel != null && pb.sel !== i && pb.legal.some((u) => u.startsWith(sqName(pb.sel) + sqName(i)))) { practiceMove(pb.sel, i); return; }
    pb.sel = myPiece(pb.board[i]) && pb.sel !== i ? i : null;
    if (pb.kind === "woodpecker") renderWood(); else drawPractice();
    return;
  }
  const el = e.target.closest("[data-trmode],[data-pxi],[data-pxnext],[data-pxretry],[data-pxgive],[data-pxreveal],[data-wpstart],[data-wpnext],[data-wpreveal]");
  if (!el) return;
  const ds = el.dataset;
  if (ds.trmode) { setTrMode(ds.trmode); return; }
  if (ds.pxi) { startItem(pb.kind, Number(ds.pxi)); return; }
  if (ds.pxretry) { startItem(pb.kind, px.idx[pb.kind]); return; }
  if (ds.pxnext) {
    const d = px.data[pb.kind];
    const next = (px.idx[pb.kind] + 1) % d.items.length;
    startItem(pb.kind, next); return;
  }
  if (ds.pxgive) {
    try { const res = await apiJson("practice/convert/giveup", { key: pb.item.key }); finishConvert(res); }
    catch (err) { pb.msg = esc(err.message); pb.cls = "bad"; }
    drawPractice(); return;
  }
  if (ds.pxreveal) {
    pb.state = "busy"; drawPractice();
    try { finishThreat(await apiJson("practice/threat/check", { key: pb.item.key, uci: "", reveal: true }), null); }
    catch (err) { pb.state = "move"; pb.msg = esc(err.message); pb.cls = "bad"; }
    drawPractice(); return;
  }
  if (ds.wpstart) {
    try { px.wood = await apiJson("woodpecker/start", { new_cycle: ds.wpstart === "new" }); pb.state = "idle"; }
    catch (err) { toast(err.message); }
    renderWood(); return;
  }
  if (ds.wpnext) { pb.state = "idle"; renderWood(); return; }
  if (ds.wpreveal) { pb.state = "busy"; woodMove(null, true); return; }
});

const I18N_G = {

    trend: (ph, a, b) => `${ph}: ${a}% → ${b}%`,
    trendIntro: "First vs. latest month with enough games:",

  },
  de: {

    empty: "Noch zu wenige analysierte Partien – mindestens zwei Monate mit je fünf Partien.",
    head: ["Monat", "Partien", "Ergebnis", "Genauigkeit", "Patzer/Partie", "Gewinnstellungen verwertet", "Eröffnungs-Gewohnheiten"],
    habits: (r, a) => (r + a ? `${r}× wiederholt · ${a}× vermieden` : "–"),
    conv: (c, n, p) => (p == null ? (n ? `${c}/${n}` : "–") : `${p} % (${c}/${n})`),
    trend: (ph, a, b) => `${ph}: ${a} % → ${b} %`,
    trendIntro: "Erster gegen letzten Monat mit genug Partien:",
    tip: (m, g) => `${m} · ${g} Partien`,
    showTable: "Als Tabelle zeigen",
  },
};
const tg = () => I18N_G[lang];
const prog = { sig: null, data: null, loading: false, table: false };
const PHASE_SERIES = ["opening", "middlegame", "endgame"];

function monthLabel(m) {
  const [y, mo] = m.split("-").map(Number);
  try {
    return new Date(y, mo - 1, 1).toLocaleDateString(lang === "de" ? "de-CH" : "en-GB", { month: "short", year: "2-digit" });
  } catch { return m; }
}

async function loadProgress() {
  prog.loading = true;
  const parts = [];
  if (timeClass !== "all") parts.push("time_class=" + timeClass);
  if (platform !== "all") parts.push("platform=" + platform);
  try { prog.data = await api("progress" + (parts.length ? "?" + parts.join("&") : "")); }
  catch { prog.data = null; }
  prog.loading = false;
  renderProgress();
}

function renderProgress() {
  const el = $id("progBody");
  if (!el) return;
  const G = tg();
  $id("progTitle").textContent = G.title;
  $id("progIntro").textContent = G.intro;
  const sig = [timeClass, platform].join("|");
  if (prog.sig !== sig && !prog.loading) { prog.sig = sig; loadProgress(); }
  const d = prog.data;
  if (!d) { el.innerHTML = `<p class="muted">${esc(t().loading)}</p>`; return; }
  const months = d.months.filter((m) => m.enough);
  if (months.length < 2) { el.innerHTML = `<p class="muted">${esc(G.empty)}</p>`; return; }
  const first = months[0], last = months[months.length - 1];
  const trends = PHASE_SERIES.filter((p) => first[p] != null && last[p] != null)
    .map((p) => {
      const diff = last[p] - first[p];
      return `<span class="pg-trend">${esc(G.trend(phaseName(p), num(first[p], 0), num(last[p], 0)))} ${delta(diff, 0, "", true)}</span>`;
    }).join("");
  el.innerHTML = `${progressChart(d.months)}
    <p class="muted pg-trends">${esc(G.trendIntro)} ${trends}</p>
    <details class="pg-table"${prog.table ? " open" : ""}><summary>${esc(G.showTable)}</summary>
    <div class="tbl-wrap"><table class="tt"><thead><tr>${G.head.map((h, i) => `<th${i && i < 5 ? ' class="num"' : ""}>${esc(h)}</th>`).join("")}</tr></thead><tbody>
    ${d.months.slice().reverse().map((m) => `<tr${m.enough ? "" : ' class="thin"'}>
      <td>${esc(monthLabel(m.month))}</td><td class="num">${m.games}</td><td class="num">${num(m.score, 0, "%")}</td>
      <td class="num">${num(m.accuracy, 0, "%")}</td><td class="num">${num(m.blunders_per_game, 2)}</td>
      <td>${esc(G.conv(m.converted, m.won_positions, m.conversion == null ? null : num(m.conversion, 0)))}</td>
      <td>${esc(G.habits(m.habit_repeated, m.habit_avoided))}</td></tr>`).join("")}
    </tbody></table></div></details>`;
}

function progressChart(months) {
  const W = 640, H = 220, padL = 34, padR = 96, padT = 12, padB = 26;
  const n = months.length;
  const vals = [];
  months.forEach((m) => PHASE_SERIES.forEach((p) => { if (m[p] != null) vals.push(m[p]); }));
  if (!vals.length) return "";
  // Achse eng um die Werte, aber auf 5er gerundet - Genauigkeiten liegen dicht beieinander.
  let lo = Math.floor((Math.min(...vals) - 2) / 5) * 5, hi = Math.ceil((Math.max(...vals) + 2) / 5) * 5;
  lo = Math.max(0, lo); hi = Math.min(100, Math.max(hi, lo + 10));
  const x = (i) => padL + (n === 1 ? 0.5 : i / (n - 1)) * (W - padL - padR);
  const y = (v) => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
  let grid = "";
  for (let v = lo; v <= hi; v += (hi - lo) > 20 ? 10 : 5)
    grid += `<line class="grid-ln" x1="${padL}" x2="${W - padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="ax" x="${padL - 6}" y="${(y(v) + 4).toFixed(1)}">${v}</text>`;
  const step = Math.ceil(n / 8);
  const xl = months.map((m, i) => (i % step === 0 || i === n - 1)
    ? `<text class="ax mid" x="${x(i).toFixed(1)}" y="${H - 6}">${esc(monthLabel(m.month))}</text>` : "").join("");
  let lines = "", labels = "";
  const ends = [];
  PHASE_SERIES.forEach((p, k) => {
    let path = "", pen = false, lastPt = null;
    months.forEach((m, i) => {
      if (m[p] == null) { pen = false; return; }
      path += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(m[p]).toFixed(1)} `;
      pen = true; lastPt = [x(i), y(m[p]), m[p]];
      lines += `<circle class="pg-pt s${k + 1}" cx="${x(i).toFixed(1)}" cy="${y(m[p]).toFixed(1)}" r="4"/>`;
    });
    lines = `<path class="pg-ln s${k + 1}" d="${path}"/>` + lines;
    if (lastPt) ends.push({ k, p, y: lastPt[1], x: lastPt[0], v: lastPt[2] });
  });
  // Direkte Beschriftung am Linienende, ueberlappungsfrei gestapelt.
  ends.sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
  ends.forEach((e) => { labels += `<text class="pg-lbl" x="${(W - padR + 8).toFixed(1)}" y="${(e.y + 4).toFixed(1)}">${esc(phaseName(e.p))} ${num(e.v, 0)}</text>`; });
  // Unsichtbare Spalten fuer den Hover: eine pro Monat.
  const colW = n > 1 ? (W - padL - padR) / (n - 1) : W - padL - padR;
  const hits = months.map((m, i) => `<rect class="pg-hit" data-pgm="${i}" x="${(x(i) - colW / 2).toFixed(1)}" y="${padT}" width="${colW.toFixed(1)}" height="${H - padT - padB}"/>`).join("");
  const legend = PHASE_SERIES.map((p, k) => `<span><i class="pg-key s${k + 1}"></i>${esc(phaseName(p))}</span>`).join("");
  return `<div class="pg-wrap"><svg class="pg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tg().title)}">
    ${grid}${xl}<line class="pg-cross" id="pgCross" x1="0" x2="0" y1="${padT}" y2="${H - padB}" visibility="hidden"/>${lines}${labels}${hits}</svg>
    <div class="pg-tip" id="pgTip" hidden></div></div>
    <div class="evc-key">${legend}</div>`;
}

document.addEventListener("pointermove", (e) => {
  const tip = $id("pgTip"), cross = $id("pgCross");
  if (!tip || !cross) return;
  const hit = e.target.closest && e.target.closest("[data-pgm]");
  if (!hit || !prog.data) { tip.hidden = true; cross.setAttribute("visibility", "hidden"); return; }
  const m = prog.data.months[Number(hit.dataset.pgm)];
  const G = tg();
  const cx = Number(hit.getAttribute("x")) + Number(hit.getAttribute("width")) / 2;
  cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
  tip.innerHTML = `<strong>${esc(G.tip(monthLabel(m.month), m.games))}</strong>` +
    PHASE_SERIES.map((p, k) => `<div><i class="pg-key s${k + 1}"></i>${esc(phaseName(p))} <b>${num(m[p], 0, "%")}</b></div>`).join("") +
    `<div class="muted">${esc(G.head[5])}: ${esc(G.conv(m.converted, m.won_positions, m.conversion == null ? null : num(m.conversion, 0)))}</div>`;
  const wrap = tip.parentElement.getBoundingClientRect();
  tip.hidden = false;
  const left = Math.min(Math.max(8, e.clientX - wrap.left + 12), wrap.width - tip.offsetWidth - 8);
  tip.style.left = left + "px";
  tip.style.top = Math.max(0, e.clientY - wrap.top - tip.offsetHeight - 10) + "px";
});
document.addEventListener("toggle", (e) => {
  if (e.target.classList && e.target.classList.contains("pg-table")) prog.table = e.target.open;
}, true);

// Waehrend ein Durchgang laeuft, den Status nachziehen.
setInterval(() => {
  if (data.status && data.status.run && data.status.run.running) loadStatus();
}, 4000);

renderTabs();
if (view === "train") renderTraining();
loadAll();
loadTactics();

// --------------------------------------------------------------------------
// Hell / dunkel
// --------------------------------------------------------------------------
function currentTheme() {
  const t = document.documentElement.dataset.theme;
  if (t === "light" || t === "dark") return t;
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function renderThemeBtn() {
  const b = document.getElementById("themeBtn");
  const dark = currentTheme() === "dark";
  b.textContent = dark ? "☀" : "☾";
  const label = dark ? t().theme.light : t().theme.dark;
  b.title = label;
  b.setAttribute("aria-label", label);
}
document.getElementById("themeBtn").addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("knightmare.theme", next); } catch { /* egal */ }
  renderThemeBtn();
});
</script>
