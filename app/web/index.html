<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knightmare</title>
<script>
  // Helles oder dunkles Erscheinungsbild: gewaehlt (Knopf oben) oder vom System.
  // Hier im Kopf, damit die Seite nicht erst dunkel aufblitzt.
  (function () { try { var v = localStorage.getItem("knightmare.theme"); if (v === "light" || v === "dark") document.documentElement.dataset.theme = v; } catch (e) { /* egal */ } })();
</script>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: light;
    --bg: #f5f7fa;
    --surface: #ffffff;
    --surface-soft: #eef2f7;
    --border: rgba(18, 32, 55, 0.13);
    --text: #16202e;
    --muted: #5d6b7e;
    --heading: #0a1420;
    --accent: #5b6ef5;
    --good: #16794a;
    --warn: #9a6100;
    --bad: #c2410c;
    --shadow: 0 12px 40px rgba(15, 23, 42, 0.09);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0a1018;
      --surface: #121b27;
      --surface-soft: #0e1623;
      --border: rgba(148, 163, 184, 0.18);
      --text: #e4ecf7;
      --muted: #94a3b8;
      --heading: #f6fafe;
      --accent: #8098ff;
      --good: #5fd39b;
      --warn: #e5b567;
      --bad: #ff9a68;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0a1018; --surface: #121b27; --surface-soft: #0e1623;
    --border: rgba(148, 163, 184, 0.18); --text: #e4ecf7; --muted: #94a3b8;
    --heading: #f6fafe; --accent: #8098ff; --good: #5fd39b; --warn: #e5b567;
    --bad: #ff9a68; --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--accent); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }

  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
           justify-content: space-between; margin-bottom: 8px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 40px; height: 40px; }
  .brand h1 { margin: 0; font-size: 1.5rem; color: var(--heading); letter-spacing: -0.02em; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 0.88rem; }
  .head-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  button { font: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--border); background: var(--surface);
         color: var(--text); border-radius: 9px; padding: 7px 13px; }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); color: #fff; }
  .btn.danger { border-color: var(--bad); color: var(--bad); }

  .chip { border: 1px solid var(--border); background: transparent; color: var(--muted);
          border-radius: 999px; padding: 5px 12px; font-size: 0.85rem; }
  .chip:hover { color: var(--text); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* Eingerichtet, aber noch keine Partie geholt: sichtbar, nicht anwaehlbar. */
  .chip.empty { opacity: 0.45; cursor: default; border-style: dashed; }
  .chip.empty:hover { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin: 12px 0; }
  .chips .label { color: var(--muted); font-size: 0.78rem; text-transform: uppercase;
                  letter-spacing: 0.06em; margin-right: 4px; }

  .card { background: var(--surface); border: 1px solid var(--border);
          border-radius: 14px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .card h2 { margin: 0 0 4px; font-size: 1.05rem; color: var(--heading); }
  .muted { color: var(--muted); font-size: 0.88rem; }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
          margin-bottom: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
         padding: 16px; box-shadow: var(--shadow); }
  .kpi .num { font-size: 2rem; font-weight: 700; color: var(--heading); line-height: 1.1; }
  .kpi h3 { margin: 6px 0 4px; font-size: 0.92rem; }
  .kpi p { margin: 0; color: var(--muted); font-size: 0.82rem; }

  .rows { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
  .row { border: 1px solid var(--border); border-radius: 11px; padding: 12px 14px;
         background: var(--surface-soft); }
  .row-btn { display: flex; flex-direction: column; gap: 6px; width: 100%;
             padding: 0; border: 0; background: none; color: inherit; text-align: left; }
  .row-top, .row-bot { display: flex; flex-wrap: wrap; gap: 8px;
                       justify-content: space-between; align-items: baseline; }
  .row-bot { font-size: 0.82rem; color: var(--muted); }
  .row-btn:hover .row-top strong { color: var(--accent); }

  .bar { height: 7px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
  .bar > i.good { background: var(--good); }
  .bar > i.warn { background: var(--warn); }
  .bar > i.bad { background: var(--bad); }

  .detail { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .detail .advice { margin: 0 0 10px; color: var(--muted); font-size: 0.88rem; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
             justify-content: space-between; margin-bottom: 8px; }
  .items { display: flex; flex-direction: column; gap: 8px;
           max-height: 60vh; overflow-y: auto; padding-right: 4px; }
  .item { border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px;
          background: var(--surface); }
  .item p { margin: 0; }
  .item p + p { margin-top: 3px; font-size: 0.82rem; color: var(--muted); }

  .tag { display: inline-block; border-radius: 999px; padding: 1px 8px;
         font-size: 0.72rem; font-weight: 600; border: 1px solid var(--border); }
  .tag.blunder { color: var(--bad); border-color: var(--bad); }
  .tag.mistake { color: var(--warn); border-color: var(--warn); }
  .tag.inaccuracy { color: var(--muted); }
  .tag.win { color: var(--good); border-color: var(--good); }
  .tag.loss { color: var(--bad); border-color: var(--bad); }

  .note { border-radius: 10px; padding: 11px 13px; margin-bottom: 14px; font-size: 0.9rem; }
  .note.err { background: rgba(194, 65, 12, 0.12); color: var(--bad); }
  .note.ok { background: rgba(22, 121, 74, 0.12); color: var(--good); }
  .note.info { background: rgba(91, 110, 245, 0.12); color: var(--accent); }
  .setup { margin-bottom: 18px; }
  .setup h2 { margin: 0 0 6px; }
  .setup p { margin: 0 0 14px; color: var(--muted); }
  .setup form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; align-items: end; }
  .setup label { display: grid; gap: 5px; font-size: 0.86rem; color: var(--muted); }
  .setup input { font: inherit; color: var(--text); background: var(--surface-soft);
                 border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; }
  .setup input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .setup .setup-msg { grid-column: 1 / -1; margin: 0; font-size: 0.88rem; }
  .setup .setup-msg.err { color: var(--bad); }

  .week { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
          gap: 12px; margin: 10px 0; }
  .week .num { font-size: 1.4rem; font-weight: 700; color: var(--heading); }
  .week .cap { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em;
               color: var(--muted); }
  .delta.up { color: var(--good); font-size: 0.8rem; font-weight: 600; }
  .delta.down { color: var(--bad); font-size: 0.8rem; font-weight: 600; }

  .focus { border-color: var(--accent); }
  .focus .row h3 { margin: 0; font-size: 0.98rem; color: var(--heading); }
  .focus .num-big { font-size: 1.5rem; font-weight: 700; color: var(--heading); line-height: 1.1; }
  .focus .row p { margin: 6px 0 0; font-size: 0.9rem; }
  .focus .row p.muted { font-size: 0.84rem; }
  .focus .tag.unsure { color: var(--warn); border-color: var(--warn); }
  .focus details { margin-top: 8px; font-size: 0.86rem; }
  .focus summary { cursor: pointer; color: var(--accent); }
  .focus details .items { margin-top: 8px; max-height: none; }
  .linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font: inherit;
             text-decoration: underline; cursor: pointer; }
  .mb { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; margin-top: 10px; }
  .mini { width: min(100%, 340px); height: auto; border-radius: 6px; display: block; flex: none; }
  .mini .l { fill: #dee3e6; } .mini .d { fill: #8ca2ad; }
  .mini .last { fill-opacity: 1; }
  .mini rect.l.last { fill: #e9e4a8; } .mini rect.d.last { fill: #b4b47a; }
  .mini text.pw, .mini text.pb { font-size: 80px; text-anchor: middle; dominant-baseline: central; }
  .mini .pw { fill: #ffffff; stroke: #1b1d22; stroke-width: 2.6; paint-order: stroke fill; }
  .mini .pb { fill: #1b1d22; }
  .mini .co { font-size: 20px; font-weight: 700; text-anchor: end; }
  .mini .co.st { text-anchor: start; }
  .mini .co.on-l { fill: #6f8591; } .mini .co.on-d { fill: #eef1f3; }
  .mini .ar { opacity: 0.88; }
  .mini .ar line { stroke-width: 17; stroke-linecap: round; }
  .mini .ar polygon { stroke: none; }
  .mini .ar.played line { stroke: #e5484d; } .mini .ar.played polygon { fill: #e5484d; }
  .mini .ar.best line { stroke: #2fa66a; } .mini .ar.best polygon { fill: #2fa66a; }
  .mini .ar.reply line { stroke: #f08c2e; stroke-dasharray: 16 10; stroke-linecap: butt; }
  .mini .ar.reply polygon { fill: #f08c2e; }
  .mb-key { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 0.86rem; }
  .mb-key .k { display: inline-block; width: 22px; height: 5px; border-radius: 3px; margin-right: 8px;
               vertical-align: middle; }
  .mb-key .k.played { background: #e5484d; } .mb-key .k.best { background: #2fa66a; }
  .mb-key .k.reply { background: repeating-linear-gradient(90deg, #f08c2e 0 7px, transparent 7px 11px); }
  .item .mb-key, .item .mb-key strong { color: var(--text); }
  footer { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--border);
           color: var(--muted); font-size: 0.82rem; }
  footer a { margin-right: 14px; }
  .two { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  code { background: var(--surface-soft); padding: 1px 5px; border-radius: 4px; font-size: 0.85em; }
  /* --- Tabs -------------------------------------------------------------- */
  .tabs { display: flex; gap: 6px; margin: 14px 0 6px; border-bottom: 1px solid var(--border); }
  .tab { border: 0; background: none; color: var(--muted); padding: 9px 14px 10px; font-weight: 600;
         border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .badge { font-weight: 500; font-size: 0.78rem; color: var(--muted); margin-left: 6px; }
  [hidden] { display: none !important; }

  /* --- Training ---------------------------------------------------------- */
  .tac-top { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: baseline; }
  .tac-dots { display: grid; grid-template-columns: repeat(10, minmax(0, 36px)); gap: 5px; margin: 14px 0 12px; }
  .tac-dot { height: 30px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-soft);
             font-size: 12px; font-weight: 600; color: var(--muted); padding: 0; display: grid; place-items: center; }
  .tac-dot.solved { background: rgba(22, 121, 74, 0.14); color: var(--good); border-color: transparent; }
  .tac-dot.failed { background: rgba(194, 65, 12, 0.14); color: var(--bad); border-color: transparent; }
  .tac-dot.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tac-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
              font-size: 0.9rem; margin-bottom: 8px; }
  .tag.accent { color: var(--accent); border-color: var(--accent); }
  .tac-empty { text-align: center; color: var(--muted); padding: 28px 8px; }
  .tac-empty .big { font-size: 28px; }
  .tac-empty strong { color: var(--text); }
  .board-wrap { max-width: 440px; margin: 0 auto; }
  .board {
    position: relative; display: grid; aspect-ratio: 1 / 1;
    /* Feste Zeilen: manche Schriften haben hoehere Figurenzeichen als ein
       Feld, ohne das wuerden sie die Reihen auseinanderdruecken. */
    grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr));
    border-radius: 10px; overflow: hidden; container-type: inline-size;
    user-select: none; -webkit-user-select: none; touch-action: none; -webkit-touch-callout: none;
  }
  .sq { position: relative; display: grid; place-items: center; min-height: 0; overflow: hidden; }
  .sq.l { background: #dee3e6; }
  .sq.d { background: #8ca2ad; }
  .sq.last::before, .sq.sel::before, .sq.good::before, .sq.bad::before { content: ""; position: absolute; inset: 0; }
  .sq.last::before { background: rgba(255, 214, 10, 0.38); }
  .sq.sel::before { background: rgba(79, 124, 255, 0.45); }
  .sq.good::before { background: rgba(21, 160, 90, 0.55); }
  .sq.bad::before { background: rgba(220, 70, 20, 0.55); }
  .sq.dest::after { content: ""; position: absolute; width: 28%; height: 28%; border-radius: 50%;
                    background: rgba(20, 35, 62, 0.3); z-index: 2; pointer-events: none; }
  .sq.dest.occ::after { width: 94%; height: 94%; background: transparent;
                        border: 0.9cqw solid rgba(20, 35, 62, 0.35); box-sizing: border-box; }
  .sq.dragging .pc { opacity: 0.25; }
  .coord { position: absolute; font-size: 2.3cqw; font-weight: 700; line-height: 1; pointer-events: none; z-index: 1; }
  .coord.f { right: 4%; bottom: 4%; }
  .coord.r { left: 4%; top: 4%; }
  .sq.l .coord { color: #6f8591; }
  .sq.d .coord { color: #eef1f3; }
  .pc { position: relative; z-index: 1; font-size: 10.4cqw; line-height: 1; height: 1em; cursor: grab;
        font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "Noto Sans Symbols", "DejaVu Sans", "Arial Unicode MS", sans-serif; }
  .pc.w { color: #ffffff; -webkit-text-stroke: 0.28cqw #1b1d22; paint-order: stroke fill;
          text-shadow: 0 0.3cqw 0.4cqw rgba(0, 0, 0, 0.35); }
  .pc.b { color: #1b1d22; text-shadow: 0 0 0.3cqw rgba(255, 255, 255, 0.35); }
  .drag-ghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -55%); line-height: 1; }
  .tac-msg { min-height: 42px; margin: 10px 0 0; font-size: 0.95rem; }
  .tac-msg.good { color: var(--good); }
  .tac-msg.bad { color: var(--bad); }
  .tac-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .tac-actions .grow { flex: 1; }
  .explain { margin-top: 12px; padding: 10px 12px; border-radius: 11px; background: var(--surface-soft); font-size: 0.92rem; }
  .explain p { margin: 4px 0; }
  .san { font-weight: 700; }
  .tac-stats { margin-top: 14px; }
  /* --- Coach (Training, seit 1.18) ---------------------------------------- */
  .co-rail { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 14px; }
  .co-rail button { border: 1px solid var(--border); background: var(--surface-soft); color: var(--muted); border-radius: 999px;
                    padding: 6px 12px; font-size: 0.82rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .co-rail button .n { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font-size: 0.7rem;
                       background: var(--border); color: var(--text); }
  .co-rail button.on { border-color: var(--accent); color: var(--accent); background: transparent; }
  .co-rail button.on .n { background: var(--accent); color: #fff; }
  .co-rail button.done { color: var(--good); }
  .co-rail button.done .n { background: var(--good); color: #fff; }
  .co-steps { display: flex; gap: 4px; align-items: center; font-size: 0.78rem; color: var(--muted); flex-wrap: wrap; }
  .co-steps span { padding: 3px 8px; border-radius: 6px; background: var(--surface-soft); }
  .co-steps span.on { background: var(--accent); color: #fff; }
  .co-steps span.ok { color: var(--good); }
  .co-ask { font-size: 1.02rem; margin: 10px 0 8px; line-height: 1.4; }
  .co-ask .san { color: var(--heading); }
  .co-point { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 700; color: var(--accent);
              border: 1px solid var(--accent); border-radius: 999px; padding: 2px 10px; }
  .co-point.muted { color: var(--muted); border-color: var(--border); }
  .board-wrap { position: relative; }
  .board-ar { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; border-radius: 10px; }
  .board-ar .ar { opacity: 0.9; }
  .board-ar .ar line { stroke-width: 17; stroke-linecap: round; }
  .board-ar .ar polygon { stroke: none; }
  .board-ar .ar.played line { stroke: #e5484d; } .board-ar .ar.played polygon { fill: #e5484d; }
  .board-ar .ar.best line { stroke: #2fa66a; } .board-ar .ar.best polygon { fill: #2fa66a; }
  .board-ar .ar.reply line { stroke: #f08c2e; stroke-dasharray: 16 10; stroke-linecap: butt; } .board-ar .ar.reply polygon { fill: #f08c2e; }
  .sq.hl::before { content: ""; position: absolute; inset: 0; background: rgba(240, 140, 46, 0.5); }
  .co-facts { list-style: none; padding: 0; margin: 8px 0; }
  .co-facts li { margin: 5px 0; padding-left: 20px; position: relative; font-size: 0.93rem; }
  .co-facts li::before { content: ""; position: absolute; left: 0; top: 7px; width: 10px; height: 10px; border-radius: 3px; background: var(--muted); }
  .co-facts li.reply::before { background: #f08c2e; } .co-facts li.best::before { background: #2fa66a; } .co-facts li.played::before { background: #e5484d; }
  .co-explain { margin-top: 12px; display: grid; gap: 10px; }
  .co-explain .box { padding: 10px 12px; border-radius: 11px; background: var(--surface-soft); }
  .co-explain .box h4 { margin: 0 0 4px; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  .co-win { display: flex; align-items: center; gap: 10px; font-size: 0.86rem; margin: 6px 0; }
  .co-win .track { flex: 1; height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; position: relative; }
  .co-win .track i { position: absolute; inset: 0 auto 0 0; background: var(--good); border-radius: 4px; }
  .co-win .track i.after { background: var(--bad); opacity: 0.85; }
  .co-lesson h3 { margin: 14px 0 6px; font-size: 1.15rem; color: var(--heading); }
  .co-lesson .q { font-size: 1.5rem; font-weight: 800; color: var(--heading); margin: 4px 0 2px; }
  .co-lesson .how { color: var(--muted); margin: 0 0 12px; }
  .co-nums { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin: 12px 0; }
  .co-nums .t { padding: 10px 12px; border-radius: 11px; background: var(--surface-soft); }
  .co-nums .t b { display: block; font-size: 1.5rem; color: var(--heading); line-height: 1.1; }
  .co-nums .t span { font-size: 0.82rem; color: var(--muted); }
  .co-bars { margin: 8px 0 4px; }
  .co-bars .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 0.86rem; margin: 6px 0; align-items: center; }
  .co-bars .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .co-bars .bar i { display: block; height: 100%; background: var(--accent); }
  .co-bars .row.focus .bar i { background: var(--bad); }
  .co-ex { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin: 10px 0; }
  .co-ex .item { padding: 10px; border-radius: 11px; border: 1px solid var(--border); font-size: 0.86rem; }
  .co-ex .item p { margin: 4px 0; }
  .co-ex .mini { width: 100%; }
  .co-tip { padding: 10px 12px; border-radius: 11px; border-left: 3px solid var(--accent); background: var(--surface-soft); margin: 10px 0; font-size: 0.92rem; }
  .co-done { text-align: center; padding: 10px 0 4px; }
  .co-done .big { font-size: 34px; }
  .co-done h3 { margin: 6px 0 2px; font-size: 1.3rem; color: var(--heading); }
  .co-hist { display: flex; gap: 4px; justify-content: center; margin: 12px 0; flex-wrap: wrap; }
  .co-hist i { width: 16px; height: 16px; border-radius: 4px; background: var(--border); display: block; }
  .co-hist i.done { background: var(--good); }

<script>

// --------------------------------------------------------------------------

const I18N = {

const store = {
  get(key, fallback) { try { return localStorage.getItem(key) || fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch { /* egal */ } },
};

let lang = store.get("knightmare.lang", (navigator.language || "en").startsWith("de") ? "de" : "en");
// Online-Fassung: viele Spieler unter einer Adresse. Filter gelten dort pro
// Spieler und beginnen bei "alles" - sonst zeigte der Filter des zuletzt
// angesehenen Spielers ins Leere.
const ONLINE_PATH = /^\/(lichess|chesscom|pgn)\/[A-Za-z0-9_-]{2,40}\//.test(location.pathname);
const scoped = (key) => (ONLINE_PATH ? key + ":" + location.pathname : key);
let timeClass = store.get(scoped("knightmare.timeClass"), ONLINE_PATH ? "all" : "rapid");
let platform = store.get(scoped("knightmare.platform"), "all");
let range = store.get(scoped("knightmare.range"), ONLINE_PATH ? "all" : "90");
let color = "all";

function weeklyQuery() {
  const parts = [];
  if (timeClass !== "all") parts.push("time_class=" + timeClass);
  if (platform !== "all") parts.push("platform=" + platform);
  return parts.length ? "?" + parts.join("&") : "";
}
const RANGES = { "30": 30, "90": 90, "all": null };

// Relative Pfade: funktioniert unter / genauso wie hinter /chess/
async function api(path) {
  // no-store zusaetzlich zum Header des Servers: ein Zwischenspeicher, der
  // veraltete Zahlen ausliefert, ist schlimmer als einer, der nichts spart.
  const res = await fetch("api/" + path, { cache: "no-store" });
  if (!res.ok) throw new Error((await res.text()) || `HTTP ${res.status}`);
  return res.json();
}
async function post(path) {
  const res = await fetch("api/" + path, { method: "POST", cache: "no-store" });
  return res.json();
}

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (v, d = 1, suffix = "") =>
  v === null || v === undefined ? "–" : Number(v).toFixed(d) + suffix;

function secs(v) {
  if (v === null || v === undefined) return "–";
  const total = Math.round(Number(v));
  if (total < 60) return total + "s";
  return Math.floor(total / 60) + ":" + String(total % 60).padStart(2, "0");
}
function date(v) {
  if (!v) return "–";
  try {
    return new Date(v).toLocaleDateString(lang === "de" ? "de-CH" : "en-GB",
      { day: "2-digit", month: "2-digit", year: "numeric" });
  } catch { return v; }
}
function bar(value, max, tone) {
  const pct = max > 0 && value ? Math.min(100, (value / max) * 100) : 0;
  return `<div class="bar"><i class="${tone}" style="width:${pct}%"></i></div>`;
}
function delta(value, digits, suffix, positiveIsGood) {
  if (value === null || value === undefined) return `<span class="muted">–</span>`;
  const v = Number(value);
  if (Math.abs(v) < 0.005) return `<span class="muted">${t().unchanged}</span>`;
  const good = positiveIsGood ? v > 0 : v < 0;
  return `<span class="delta ${good ? "up" : "down"}">${v > 0 ? "+" : ""}${v.toFixed(digits)}${suffix}</span>`;
}
const phaseName = (p) => ({ opening: t().phOpening, middlegame: t().phMiddlegame, endgame: t().phEndgame }[p] || p);
const phaseInline = (p) => ({ opening: t().opening, middlegame: t().middlegame, endgame: t().endgame }[p] || p);

function query(extra) {
  const parts = [];
  const days = RANGES[range];
  if (days) parts.push("days=" + days);
  if (timeClass !== "all") parts.push("time_class=" + timeClass);
  if (platform !== "all") parts.push("platform=" + platform);
  (extra || []).forEach((p) => parts.push(p));
  return parts.length ? "?" + parts.join("&") : "";
}

async function loadAll() {
  expanded = null;
  list = { items: [], total: 0, sort: list.sort, loading: false };
  missExpanded = null;
  missList = { items: [], total: 0, sort: missList.sort, loading: false };
  setBusy(true);
  try {
    const openParts = ["min_games=3", "limit=12"];
    if (RANGES[range]) openParts.push("days=" + RANGES[range]);
    if (timeClass !== "all") openParts.push("time_class=" + timeClass);
    if (platform !== "all") openParts.push("platform=" + platform);
    if (color !== "all") openParts.push("color=" + color);
    const gameParts = ["limit=12"];
    if (timeClass !== "all") gameParts.push("time_class=" + timeClass);
    if (platform !== "all") gameParts.push("platform=" + platform);

    const [status, overview, weekly, errors, missed, phases, pressure, openings, games, focus] =
      await Promise.all([
        api("status"),
        api("overview" + query()),
        api("report/weekly" + weeklyQuery()),
        api("error-types" + query(["examples=0"])),
        api("missed" + query()),
        api("phases" + query()),
        api("time-pressure" + query()),
        api("openings?" + openParts.join("&")),
        api("games?" + gameParts.join("&")),
        api("focus" + query()),
      ]);
    data = { status, overview, weekly, errors, missed, phases, pressure, openings, games, focus };
    data.error = null;
  } catch (err) {
    data.error = t().noData(err.message);
  } finally {
    setBusy(false);
    render();
  }
}

async function loadStatus() {
  try { data.status = await api("status"); render(); } catch { /* still */ }
}

async function loadErrors(type, opts) {
  const o = opts || {};
  const sort = o.sort || "cp_loss";
  const append = !!o.append;
  const mate = o.mate || null;
  list = { items: append ? list.items : [], total: append ? list.total : 0, sort, mate, loading: true };
  render();
  try {
    const parts = [
      "error_type=" + encodeURIComponent(type), "sort=" + sort,
      "limit=" + PAGE, "offset=" + (o.offset || 0),
    ];
    if (RANGES[range]) parts.push("days=" + RANGES[range]);
    if (timeClass !== "all") parts.push("time_class=" + timeClass);
    if (platform !== "all") parts.push("platform=" + platform);
    if (mate) parts.push("mate_in=" + encodeURIComponent(mate));
    const res = await api("errors?" + parts.join("&"));
    list = {
      sort, mate, loading: false, total: res.total || 0,
      items: append ? list.items.concat(res.moves || []) : (res.moves || []),
    };
  } catch (err) {
    list.loading = false;
    data.error = t().noData(err.message);
  }
  render();
}
async function loadMissed(motif, opts) {
  const o = opts || {};
  const sort = o.sort || "cp_loss";
  const append = !!o.append;
  const mate = o.mate || null;
  missList = {
    items: append ? missList.items : [],
    total: append ? missList.total : 0,
    sort, mate, loading: true,
  };
  render();
  try {
    const parts = [
      "motif=" + encodeURIComponent(motif), "sort=" + sort,
      "limit=" + PAGE, "offset=" + (o.offset || 0),
    ];
    if (RANGES[range]) parts.push("days=" + RANGES[range]);
    if (timeClass !== "all") parts.push("time_class=" + timeClass);
    if (platform !== "all") parts.push("platform=" + platform);
    if (mate) parts.push("mate_in=" + encodeURIComponent(mate));
    const res = await api("missed/moves?" + parts.join("&"));
    missList = {
      sort, mate, loading: false, total: res.total || 0,
      items: append ? missList.items.concat(res.moves || []) : (res.moves || []),
    };
  } catch (err) {
    missList.loading = false;
    data.error = t().noData(err.message);
  }
  render();
}

function render() {
  renderThemeBtn();
  const L = t();
  document.documentElement.lang = lang;
  document.getElementById("tagline").textContent = L.tagline;
  document.getElementById("langBtn").textContent = L.lang;
  document.getElementById("refreshBtn").textContent = busy ? L.loading : L.refresh;
  document.getElementById("refreshBtn").disabled = busy;

  const run = data.status && data.status.run;
  // Online-Fassung (viele Spieler auf einem Server): Abholen, Neu analysieren
  // und Training gibt es dort nicht - das steuert der Dienst selbst.
  const online = !!(data.status && data.status.online);
  document.getElementById("syncBtn").hidden = online;
  // Partien und Eroeffnungen sind reine Auswertungen - die gibt es online auch.
  document.getElementById("tabTrain").hidden = online;
  document.getElementById("reBtn").closest(".toolbar").hidden = online;
  if (online && view === "train") setView("analyse");
  const syncBtn = document.getElementById("syncBtn");
  syncBtn.textContent = run && run.running ? L.running : L.sync;
  syncBtn.disabled = !!(run && run.running) || (data.status && data.status.configured === false);

  // Hinweise
  const notes = [];
  if (data.error) notes.push(`<div class="note err">${data.error}</div>`);
  if (data.status && data.status.configured === false && !data.status.setup_available && !online)
    notes.push(`<div class="note err">${L.notConfigured}</div>`);
  if (run && run.running)
    notes.push(`<div class="note info">${esc(L.runNote(run.phase, run.fetched || 0, run.analyzed || 0))}</div>`);
  document.getElementById("notes").innerHTML = notes.join("");

  renderFilters();
  renderKpis();
  renderFocus();
  renderErrors();
  renderMissed();
  renderWeek();
  renderPhases();
  renderPressure();
  renderOpenings();
  renderGames();
  renderGamesView();
  renderOpeningsView();
  renderJourney();
  renderProgress();
  renderFooter();
  renderTabs();
  renderSetup();
}

function renderFilters() {
  const L = t();
  const classes = (data.status && data.status.time_classes) || [];
  const platforms = (data.status && data.status.platforms) || [];

  // Massgeblich ist, was EINGERICHTET ist, nicht was schon an Partien da ist.
  // Sonst verschwindet die Reihe genau dann, wenn man wissen will, ob die
  // zweite Quelle ueberhaupt ankommt - und man sieht nichts statt einer Null.
  const configured = (data.status && data.status.configured_platforms) || [];
  const counted = new Map(platforms.map((p) => [p.platform, p.games]));
  const sources = configured.length ? configured : platforms.map((p) => p.platform);

  document.getElementById("platformChips").innerHTML =
    sources.length > 1
      ? `<span class="label">${L.platform}</span>` +
        `<button class="chip ${platform === "all" ? "on" : ""}" data-pf="all">${L.all}</button>` +
        sources.map((name) => {
          const games = counted.get(name) || 0;
          // Eine Quelle ohne Partien bleibt sichtbar, aber nicht anwaehlbar -
          // ein leerer Filter waere nur verwirrend.
          const off = games === 0 ? " empty" : "";
          return `<button class="chip ${platform === name ? "on" : ""}${off}" ` +
                 `data-pf="${esc(name)}"${games === 0 ? " disabled" : ""}>` +
                 `${esc(L[name] || name)} (${games})</button>`;
        }).join("")
      : "";
  document.getElementById("classChips").innerHTML =
    `<span class="label">${L.gameType}</span>` +
    `<button class="chip ${timeClass === "all" ? "on" : ""}" data-tc="all">${L.all}</button>` +
    classes.map((c) =>
      `<button class="chip ${timeClass === c.time_class ? "on" : ""}" data-tc="${esc(c.time_class)}">` +
      `${esc(L[c.time_class] || c.time_class)} (${c.games})</button>`).join("");

  document.getElementById("rangeChips").innerHTML =
    `<span class="label">${L.period}</span>` +
    [["30", L.d30], ["90", L.d90], ["all", L.dAll]].map(([k, label]) =>
      `<button class="chip ${range === k ? "on" : ""}" data-range="${k}">${label}</button>`).join("");

  document.getElementById("colorChips").innerHTML =
    [["all", L.bothColors], ["white", L.asWhite], ["black", L.asBlack]].map(([k, label]) =>
      `<button class="chip ${color === k ? "on" : ""}" data-color="${k}">${label}</button>`).join("");
}

function renderKpis() {

function focusBreakdown(L, list) {
  return (list || []).slice(0, 4).map((b) =>
    `${esc(b.key === "no_single_error" ? L.fNoSingle : (L.errors[b.key] || b.key))} ${b.count}`).join(" · ");
}
const focusOpen = new Set();
document.addEventListener("toggle", (e) => {
  const d = e.target;
  if (!d || !d.dataset || !d.dataset.fx) return;
  if (d.open) focusOpen.add(d.dataset.fx); else focusOpen.delete(d.dataset.fx);
}, true);
function focusExamples(L, list, key) {
  if (!list || !list.length) return "";
  const rows = list.map((e) => {
    const label = L.errors[e.error_type] || "";
    const link = e.game_url
      ? ` · <a href="${esc(e.game_url)}" target="_blank" rel="noreferrer">${esc(L.openGame(e.move_number))}</a>` : "";
    const better = e.best_move_san ? esc(L.better(e.best_move_san)) : "";
    return `<div class="item"><p><strong>${e.move_number}. ${esc(e.san)}</strong>${label ? " — " + esc(label) : ""}${better}</p>
      <p>${esc(L.fSwing(e.win_before, e.win_after))} · ${esc(date(e.played_at))}${e.opponent ? esc(L.against(e.opponent)) : ""}${link}${boardButton(e.move_id)}</p>${boardSlot(e.move_id)}</div>`;
  }).join("");
  return `<details data-fx="${esc(key)}"${focusOpen.has(key) ? " open" : ""}><summary>${esc(L.fExamples(list.length))}</summary><div class="items">${rows}</div></details>`;
}
function focusTrend(L, it) {
  if (it.older == null || it.newer == null) return "";
  return L.fTrend(num(it.older, 0, "%"), num(it.newer, 0, "%"));
}
function renderFocus() {
  const L = t(), f = data.focus || {};
  document.getElementById("focusTitle").textContent = L.fTitle;
  document.getElementById("focusIntro").textContent = L.fIntro;
  const rowsEl = document.getElementById("focusRows");
  const foot = [];
  if (!data.focus) { rowsEl.innerHTML = ""; document.getElementById("focusFoot").textContent = ""; return; }
  if (!f.enough) {
    rowsEl.innerHTML = `<p class="muted">${esc(L.fNotEnough(f.min_games, f.min_losses, f.games || 0, f.losses || 0))}</p>`;
    document.getElementById("focusFoot").textContent = "";
    return;
  }
  const items = f.items || [];
  rowsEl.innerHTML = items.length ? items.map((it, i) => {
    let head = "", big = "", body = "", sub = "", advice = "", trend = "";
    if (it.key === "opening") {
      const col = it.color === "white" ? L.asWhite : L.asBlack;
      head = L.fOpeningHead(esc(it.opening), esc(col));
      big = num(it.score, 0, "%");
      body = L.fOpeningBody(it.games, num(it.score, 0, "%"), num(it.expected, 0, "%"));
      if (it.exit_win != null) sub = it.exit_win >= 50 ? L.fOpeningExitOk(it.exit_win) : L.fOpeningExitBad(it.exit_win);
      advice = L.fAdvice.opening;
    } else {
      head = L.fHead[it.key];
      big = num(it.share, 0, "%");
      body = L.fBody[it.key](it.count, it.base, num(it.share, 0, "%"), it.reached, it.converted);
      sub = focusBreakdown(L, it.breakdown);
      advice = L.fAdvice[it.key];
      trend = focusTrend(L, it);
    }
    const unsure = it.stable ? "" : ` <span class="tag unsure" title="${esc(L.fUnsureTip)}">${esc(L.fUnsure)}</span>`;
    return `<div class="row">
      <div class="row-top"><h3>${i + 1}. ${head}${unsure}</h3><span class="num-big">${big}</span></div>
      <p>${body}</p>
      ${sub ? `<p class="muted">${sub}</p>` : ""}
      <p>${esc(advice)}</p>
      ${trend ? `<p class="muted">${esc(trend)}</p>` : ""}
      ${focusExamples(L, it.examples, it.key)}
    </div>`;
  }).join("") : `<p class="muted">${esc(L.fNothing)}</p>`;
  if (f.strength) {
    const s = f.strength, col = s.color === "white" ? L.asWhite : L.asBlack;
    foot.push(L.fStrength(s.opening, col, num(s.score, 0, "%"), num(s.expected, 0, "%"), s.games));
  }
  if (f.positional_share != null) foot.push(L.fPositional(num(f.positional_share, 0, "%")));
  document.getElementById("focusFoot").textContent = foot.join(" ");
}

// --------------------------------------------------------------------------
// Kleines Brett unter einem Fehler: rot dein Zug, gruen der beste, orange
// gestrichelt die Antwort, mit der der Gegner bestraft haette. Stellung kommt
// vom Server (aus dem PGN nachgespielt), gezeichnet als SVG - Pfeile lassen
// sich so sauber legen, ohne Bibliothek.
// --------------------------------------------------------------------------
const boardCache = new Map();   // Zug-ID -> Daten | "loading" | "error"
const boardOpen = new Set();

function boardButton(id) {
  if (id == null) return "";
  const L = t(), open = boardOpen.has(id);
  return ` · <button class="linkbtn" type="button" data-board="${id}" aria-expanded="${open}">${esc(open ? L.boardHide : L.boardShow)}</button>`;
}
function boardSlot(id) {
  if (id == null) return "";
  return `<div class="mb-slot" data-slot="${id}">${boardOpen.has(id) ? boardBlock(id) : ""}</div>`;
}
function boardBlock(id) {
  const L = t(), d = boardCache.get(id);
  if (!d || d === "loading") return `<p class="muted">${esc(L.loading)}</p>`;
  if (d === "error" || !d.consistent) return `<p class="muted">${esc(L.boardError)}</p>`;
  const key = (cls, label, san) => san
    ? `<li><i class="k ${cls}"></i>${esc(label)} <strong>${esc(san)}</strong></li>` : "";
  return `<div class="mb">${miniBoard(d, id)}
    <ul class="mb-key">
      ${key("played", L.boardYou, d.played_san)}
      ${key("best", L.boardBest, d.best_san)}
      ${key("reply", L.boardReply, d.refutation_san)}
    </ul></div>`;
}
function sqCenter(sq, white) {
  const f = sq.charCodeAt(0) - 97, r = Number(sq[1]) - 1;
  return [(white ? f : 7 - f) * 100 + 50, (white ? 7 - r : r) * 100 + 50];
}
function arrow(uci, cls, white) {
  // Spitze als eigenes Dreieck statt SVG-Marker: Marker in per innerHTML
  // eingefuegtem SVG zeichnete Chromium im Test nicht, Safari ist dort auch
  // unzuverlaessig.
  if (!uci) return "";
  const [x1, y1] = sqCenter(uci.slice(0, 2), white), [x2, y2] = sqCenter(uci.slice(2, 4), white);
  const len = Math.hypot(x2 - x1, y2 - y1) || 1;
  const ux = (x2 - x1) / len, uy = (y2 - y1) / len;
  // Kurze Pfeile (Nachbarfeld) bekommen eine kleinere Spitze, sonst bliebe
  // vom Schaft nichts uebrig.
  const head = Math.min(40, len * 0.32), half = Math.min(22, len * 0.18);
  const tipX = x2 - ux * 12, tipY = y2 - uy * 12;          // Spitze knapp vor der Feldmitte
  const baseX = tipX - ux * head, baseY = tipY - uy * head;
  const nx = -uy * half, ny = ux * half;
  const f = (v) => v.toFixed(1);
  return `<g class="ar ${cls}"><line x1="${x1}" y1="${y1}" x2="${f(baseX + ux * 2)}" y2="${f(baseY + uy * 2)}"/>` +
    `<polygon points="${f(tipX)},${f(tipY)} ${f(baseX + nx)},${f(baseY + ny)} ${f(baseX - nx)},${f(baseY - ny)}"/></g>`;
}
function miniBoard(d, uid) {
  const white = d.orientation !== "black";
  const rows = d.fen.split(" ")[0].split("/");
  const last = d.last ? [d.last.slice(0, 2), d.last.slice(2, 4)] : [];
  let sq = "", pcs = "", coords = "";
  for (let r = 0; r < 8; r++) {
    let file = 0;
    for (const ch of rows[r]) {
      if (/\d/.test(ch)) { file += Number(ch); continue; }
      const name = FILES[file] + (8 - r);
      const [x, y] = sqCenter(name, white);
      const w = ch === ch.toUpperCase();
      pcs += `<text x="${x}" y="${y + 4}" class="${w ? "pw" : "pb"}">${GLYPH[ch.toLowerCase()]}︎</text>`;
      file += 1;
    }
  }
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const name = FILES[f] + (r + 1);
    const [x, y] = sqCenter(name, white);
    const light = (r + f) % 2 === 1;
    sq += `<rect x="${x - 50}" y="${y - 50}" width="100" height="100" class="${light ? "l" : "d"}${last.includes(name) ? " last" : ""}"/>`;
  }
  for (let i = 0; i < 8; i++) {
    const fileName = white ? FILES[i] : FILES[7 - i], rankName = white ? 8 - i : i + 1;
    coords += `<text x="${i * 100 + 92}" y="793" class="co ${i % 2 ? "on-l" : "on-d"}">${fileName}</text>`;
    coords += `<text x="6" y="${i * 100 + 22}" class="co st ${i % 2 ? "on-d" : "on-l"}">${rankName}</text>`;
  }
  return `<svg class="mini" viewBox="0 0 800 800" role="img" aria-label="${esc(d.fen)}">
    ${sq}${coords}${pcs}
    ${arrow(d.refutation, "reply", white)}${arrow(d.best, "best", white)}${arrow(d.played, "played", white)}
  </svg>`;
}
async function toggleBoard(id) {
  const fill = () => document.querySelectorAll(`[data-slot="${id}"]`).forEach((el) => {
    el.innerHTML = boardOpen.has(id) ? boardBlock(id) : "";
  });
  const label = () => document.querySelectorAll(`[data-board="${id}"]`).forEach((b) => {
    b.textContent = boardOpen.has(id) ? t().boardHide : t().boardShow;
    b.setAttribute("aria-expanded", String(boardOpen.has(id)));
  });
  if (boardOpen.has(id)) { boardOpen.delete(id); fill(); label(); return; }
  boardOpen.add(id); label();
  if (!boardCache.has(id) || boardCache.get(id) === "error") {
    boardCache.set(id, "loading"); fill();
    try { boardCache.set(id, await api(`moves/${id}/board`)); }
    catch { boardCache.set(id, "error"); }
  }
  fill();
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-board]");
  if (!b) return;
  e.preventDefault();
  toggleBoard(Number(b.dataset.board));
});

          <span>${esc(L.avgCp(num(row.avg_cp_loss, 0)))}${row.main_phase ? " · " + esc(L.mostlyIn(phaseInline(row.main_phase))) : ""}${
            row.avg_clock_seconds != null ? " · " + esc(L.avgClock(secs(row.avg_clock_seconds))) : ""}</span>
        </span>
      </button>
      ${open ? errorDetail(row) : ""}
    </div>`;
  }).join("");
}

// Filter nach Mattlaenge. Nur dort, wo es um verpasste Matts geht - fuer
// Anfaenger der wichtigste Schnitt: erst alle Matt-in-1 durchgehen.
function mateChips(breakdown, current, attr, forValue) {
  const L = t();
  const entries = Object.entries(breakdown || {});
  if (!entries.length) return "";
  const chip = (value, label) =>
    `<button class="chip ${(current || "") === value ? "on" : ""}" ${attr}="${esc(value)}" data-mfor2="${esc(forValue)}">${esc(label)}</button>`;
  return `<div class="chips" style="margin:6px 0 10px"><span class="label">${esc(L.mateLabel)}</span>` +
    chip("", L.all) +
    entries.map(([bucket, count]) => chip(bucket, `${L.mateBucket(bucket)} (${count})`)).join("") +
    `</div><p class="muted" style="margin:0 0 10px">${esc(L.mateNote)}</p>`;
}

function errorDetail(row) {
  const L = t();
  const head = list.total
    ? esc(L.shown(list.items.length, list.total))
    : list.loading ? esc(L.loading) : esc(L.none);
  const sorts = [["cp_loss", L.sortCost], ["recent", L.sortNew]].map(([k, label]) =>
    `<button class="chip ${list.sort === k ? "on" : ""}" data-sort="${k}" data-for="${esc(row.error_type)}">${label}</button>`).join("");

  const items = list.items.map((m) => {
    const num_ = `${m.move_number}. ${m.color === "black" ? "… " : ""}${esc(m.san)}`;
    let line = `<strong>${num_}</strong> <span class="tag ${esc(m.category)}">${esc(L[m.category] || m.category)}</span> — ${esc(L.lost(m.cp_loss))}`;
    if (m.refutation_san) line += esc(L.punished(m.refutation_san));
    if (m.best_move_san) line += esc(L.better(m.best_move_san));
    if (m.mate_in) line += esc(L.mateIn(m.mate_in));
    // Die zweite Achse hier mit anzeigen: "Stellungsfehler" sagt wenig, wenn
    // daneben steht, dass eine Gabel bereitlag.
    if (m.missed_motif) {
      line += esc(" · " + (L.missed[m.missed_motif] || m.missed_label || m.missed_motif));
    }
    let meta = esc(phaseName(m.phase));
    if (m.opponent) meta += esc(L.against(m.opponent)) + (m.opponent_rating ? ` (${m.opponent_rating})` : "");
    if (m.result) meta += " · " + esc(L[m.result] || m.result);
    if (m.opening) meta += " · " + esc(m.opening);
    meta += " · " + esc(date(m.played_at));
    if (m.clock_seconds != null) meta += esc(L.clockLeft(secs(m.clock_seconds)));
    if (m.seconds_spent != null) meta += esc(L.thought(secs(m.seconds_spent)));
    const link = m.game_url
      ? ` · <a href="${esc(m.game_url)}" target="_blank" rel="noreferrer">${esc(L.openGame(m.move_number))}</a>`
      : "";
    return `<div class="item"><p>${line}.</p><p>${meta}${link}${boardButton(m.id)}</p>${boardSlot(m.id)}</div>`;
  }).join("");

  const more = list.items.length < list.total
    ? `<p style="margin-top:10px"><button class="btn" data-more="${esc(row.error_type)}"${list.loading ? " disabled" : ""}>` +
      `${list.loading ? esc(L.loading) : esc(L.loadMore(Math.min(PAGE, list.total - list.items.length)))}</button></p>`
    : "";

  return `<div class="detail">
    <p class="advice">${esc(L.advice[row.error_type] || "")}</p>
    ${row.error_type === "missed_mate" ? mateChips(row.mate_in, list.mate, "data-emate", row.error_type) : ""}
    <div class="toolbar"><span class="muted">${head}</span><span class="chips" style="margin:0">${sorts}</span></div>
    <div class="items">${items}</div>${more}</div>`;
}
function renderMissed() {
  const L = t();
  document.getElementById("missTitle").textContent = L.missTitle;
  document.getElementById("missIntro").textContent = L.missIntro;
  const missed = data.missed || {};
  const types = missed.types || [];
  // Alte Partien koennen kein Motiv tragen - das gehoert dazugesagt, sonst
  // liest sich eine leere Liste wie ein Befund.
  const stale = missed.stale_games
    ? `<p class="advice" style="margin-top:0">${esc(L.missStale(missed.stale_games))}</p>`
    : "";
  if (!types.length) {
    document.getElementById("missRows").innerHTML =
      stale || `<p class="muted">${L.missEmpty}</p>`;
    return;
  }
  const max = Math.max(...types.map((r) => r.count), 1);
  const head = missed.scanned
    ? `<p class="muted" style="margin:0 0 12px">${esc(L.missScanned(missed.missed_total, missed.scanned))}</p>`
    : "";

  document.getElementById("missRows").innerHTML = stale + head + types.map((row) => {
    const open = missExpanded === row.motif;

function missedDetail(row) {
  const L = t();
  const head = missList.total
    ? esc(L.shown(missList.items.length, missList.total))
    : missList.loading ? esc(L.loading) : esc(L.none);
  const sorts = [["cp_loss", L.sortCost], ["recent", L.sortNew]].map(([k, label]) =>
    `<button class="chip ${missList.sort === k ? "on" : ""}" data-msort="${k}" data-mfor="${esc(row.motif)}">${label}</button>`).join("");

  const items = missList.items.map((m) => {
    const num_ = `${m.move_number}. ${m.color === "black" ? "… " : ""}${esc(m.san)}`;
    // Hier steht der beste Zug vorn: um den geht es, nicht um den gespielten.
    let line = `<strong>${num_}</strong> <span class="tag ${esc(m.category)}">${esc(L[m.category] || m.category)}</span>`;
    if (m.best_move_san) line += " — " + esc(L.couldHave(m.best_move_san));
    if (m.mate_in) line += esc(L.mateIn(m.mate_in));
    line += " · " + esc(L.lost(m.cp_loss));
    let meta = esc(phaseName(m.phase));
    if (m.opponent) meta += esc(L.against(m.opponent)) + (m.opponent_rating ? ` (${m.opponent_rating})` : "");
    if (m.opening) meta += " · " + esc(m.opening);
    meta += " · " + esc(date(m.played_at));
    if (m.clock_seconds != null) meta += esc(L.clockLeft(secs(m.clock_seconds)));
    if (m.seconds_spent != null) meta += esc(L.thought(secs(m.seconds_spent)));
    const link = m.game_url
      ? ` · <a href="${esc(m.game_url)}" target="_blank" rel="noreferrer">${esc(L.openGame(m.move_number))}</a>`
      : "";
    return `<div class="item"><p>${line}.</p><p>${meta}${link}${boardButton(m.id)}</p>${boardSlot(m.id)}</div>`;
  }).join("");

  const more = missList.items.length < missList.total
    ? `<p style="margin-top:10px"><button class="btn" data-mmore="${esc(row.motif)}"${missList.loading ? " disabled" : ""}>` +
      `${missList.loading ? esc(L.loading) : esc(L.loadMore(Math.min(PAGE, missList.total - missList.items.length)))}</button></p>`
    : "";

  return `<div class="detail">
    <p class="advice">${esc(L.madvice[row.motif] || "")}</p>
    ${row.motif === "mate" ? mateChips(row.mate_in, missList.mate, "data-mmate", row.motif) : ""}
    <div class="toolbar"><span class="muted">${head}</span><span class="chips" style="margin:0">${sorts}</span></div>
    <div class="items">${items}</div>${more}</div>`;
}


function renderWeek() {
  const L = t(), w = data.weekly || {};
  document.getElementById("weekTitle").textContent = L.weekTitle;

  const cur = w.current || {};
  document.getElementById("weekBody").innerHTML = cur.games
    ? `<div class="week">
        <div><div class="cap">${L.wGames}</div><div class="num">${cur.games}</div>${delta(w.delta && w.delta.games, 0, "", true)}</div>
        <div><div class="cap">${L.wScore}</div><div class="num">${num(cur.score_percent, 0, "%")}</div>${delta(w.delta && w.delta.score_percent, 1, "%", true)}</div>

      </div><p class="muted">${L.weekCompare}</p>`
    : `<p class="muted">${L.weekNone}</p>`;

  const parts = [];

    const label = L.errors[w.top_error.error_type] || w.top_error.label;
    parts.push(`<div class="item"><p>${L.topError(esc(label), w.top_error.count, num(w.top_error.share_percent, 0, "%"))}</p></div>`);
  }
  if (w.worst_opening) {
    const o = w.worst_opening;

  } else {
    parts.push(`<div class="item"><p class="muted">${L.noOpening}</p></div>`);
  }
  if (w.worst_move) {
    const m = w.worst_move;
    let line = L.worstMove(m.move_number, esc(m.san), esc(phaseInline(m.phase))) + " — " + esc(L.lost(m.cp_loss));
    if (m.best_move_san) line += esc(L.better(m.best_move_san));
    if (m.clock_seconds != null) line += esc(L.clockLeft(secs(m.clock_seconds)));
    const link = m.game_url ? ` · <a href="${esc(m.game_url)}" target="_blank" rel="noreferrer">${esc(L.openGame(m.move_number))}</a>` : "";

    parts.push(`<div class="item"><p class="muted">${L.noErrors}</p></div>`);

  document.getElementById("notableBody").innerHTML = `<div class="items" style="max-height:none">${parts.join("")}</div>`;

async function apiJson(path, body) {
  const res = await fetch("api/" + path, {
    method: "POST", cache: "no-store",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  if (!res.ok) {
    let code = `HTTP ${res.status}`;
    try { const j = await res.json(); if (typeof j.detail === "string") code = j.detail; } catch { /* egal */ }
    throw new Error(tc().errors[code] || tr().errors[code] || code);
  }
  return res.json();
}

const GLYPH = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
const FILES = "abcdefgh";
const sqName = (i) => FILES[i % 8] + (Math.floor(i / 8) + 1);
const sqIndex = (n) => FILES.indexOf(n[0]) + (Number(n[1]) - 1) * 8;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function fenBoard(fen) {
  const arr = new Array(64).fill(null);
  fen.split(" ")[0].split("/").forEach((row, r) => {
    let f = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) f += Number(ch);
      else { arr[(7 - r) * 8 + f] = ch; f++; }
    }
  });
  return arr;
}

// Zug auf dem Anzeige-Brett ausfuehren. Keine Regelpruefung - das macht der
// Server -, nur die drei Sonderfaelle, die sonst falsch aussaehen.
function applyUci(arr, uci) {
  const b = arr.slice();
  const from = sqIndex(uci.slice(0, 2)), to = sqIndex(uci.slice(2, 4));
  let p = b[from];
  if (!p) return b;
  const kind = p.toLowerCase();
  if (kind === "k" && Math.abs(to - from) === 2) {
    const base = from - (from % 8);
    if (to > from) { b[base + 5] = b[base + 7]; b[base + 7] = null; }
    else { b[base + 3] = b[base]; b[base] = null; }
  }
  if (kind === "p" && (to - from) % 8 !== 0 && !b[to]) b[to + (p === "P" ? -8 : 8)] = null;
  if (uci.length === 5) p = p === "P" ? uci[4].toUpperCase() : uci[4];
  b[to] = p;
  b[from] = null;
  return b;
}
const moveSquares = (uci) => uci ? [sqIndex(uci.slice(0, 2)), sqIndex(uci.slice(2, 4))] : null;

document.addEventListener("click", (event) => {
  const el = event.target.closest("[data-tc],[data-pf],[data-range],[data-color],[data-err],[data-sort],[data-more],[data-miss],[data-msort],[data-mmore],[data-mmate],[data-emate]");
  if (!el) return;

  if (el.dataset.pf) {
    platform = el.dataset.pf;
    store.set(scoped("knightmare.platform"), platform);
    // Partiearten hängen von der Plattform ab (Classical gibt es nur bei
    // Lichess) - eine Auswahl, die es nicht mehr gibt, würde leer aussehen.
    timeClass = "all";
    store.set(scoped("knightmare.timeClass"), timeClass);
    loadAll();
    return;
  }
  if (el.dataset.tc) { timeClass = el.dataset.tc; store.set(scoped("knightmare.timeClass"), timeClass); loadAll(); return; }
  if (el.dataset.range) { range = el.dataset.range; store.set(scoped("knightmare.range"), range); loadAll(); return; }
  if (el.dataset.color) { color = el.dataset.color; loadAll(); return; }
  // Leerer Wert = "Alle" - darum auf das Vorhandensein pruefen, nicht auf den Inhalt.
  if ("emate" in el.dataset) {
    loadErrors(el.dataset.mfor2, { sort: list.sort, mate: el.dataset.emate });
    return;
  }
  if ("mmate" in el.dataset) {
    loadMissed(el.dataset.mfor2, { sort: missList.sort, mate: el.dataset.mmate });
    return;
  }
  if (el.dataset.sort) { loadErrors(el.dataset.for, { sort: el.dataset.sort, mate: list.mate }); return; }
  if (el.dataset.more) {
    loadErrors(el.dataset.more, { sort: list.sort, mate: list.mate, append: true, offset: list.items.length });
    return;
  }
  if (el.dataset.msort) { loadMissed(el.dataset.mfor, { sort: el.dataset.msort, mate: missList.mate }); return; }
  if (el.dataset.mmore) {
    loadMissed(el.dataset.mmore, {
      sort: missList.sort, mate: missList.mate, append: true, offset: missList.items.length,
    });
    return;
  }
  if (el.dataset.miss) {
    if (missExpanded === el.dataset.miss) { missExpanded = null; render(); }
    else { missExpanded = el.dataset.miss; loadMissed(el.dataset.miss, { sort: missList.sort }); }
    return;
  }
  if (el.dataset.err) {
    if (expanded === el.dataset.err) { expanded = null; render(); }
    else { expanded = el.dataset.err; loadErrors(el.dataset.err, { sort: list.sort }); }
  }
});

function renderSetup() {
  const s = data.status || {};
  const host = document.getElementById("setup");
  const want = s.setup_available && (setupOpen || s.configured === false);
  const mode = want ? (s.configured === false ? "first" : "edit") + ":" + lang : "";
  if (mode === setupShown) return;
  setupShown = mode;
  if (!want) { host.innerHTML = ""; return; }
  const L = t().su, first = s.configured === false;
  host.innerHTML = `
    <div class="card setup">
      <h2>${esc(first ? L.title : L.edit)}</h2>
      ${first ? `<p>${esc(L.intro)}</p>` : ""}
      <form id="setupForm" autocomplete="off">
        <label>${esc(L.chesscom)}<input name="chesscom_username" maxlength="30" spellcheck="false"
          value="${esc(s.chesscom_username || "")}"></label>
        <label>${esc(L.lichess)}<input name="lichess_username" maxlength="30" spellcheck="false"
          value="${esc(s.lichess_username || "")}"></label>
        <div>
          <button class="btn primary" type="submit">${esc(first ? L.save : L.saveEdit)}</button>
          ${first ? "" : `<button class="btn" type="button" id="setupCancel">${esc(L.cancel)}</button>`}
        </div>
        <p class="setup-msg" id="setupMsg"></p>
      </form>
    </div>`;
  if (first) host.querySelector("input").focus();
}

document.getElementById("setup").addEventListener("submit", async (e) => {
  e.preventDefault();
  const L = t().su, form = e.target, msg = document.getElementById("setupMsg");
  const btn = form.querySelector("button[type=submit]");
  const body = Object.fromEntries(new FormData(form));
  btn.disabled = true;
  msg.className = "setup-msg";
  msg.textContent = L.checking;
  try {
    const res = await fetch("api/setup", {
      method: "POST", cache: "no-store",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const out = await res.json();
    if (!res.ok) {
      msg.className = "setup-msg err";
      msg.textContent = L.errors[out.detail] || out.detail || "HTTP " + res.status;
      btn.disabled = false;
      return;
    }
    setupOpen = false;
    toast(out.unchecked && out.unchecked.length ? L.offline : L.saved);
    loadAll();
  } catch (err) {
    msg.className = "setup-msg err";
    msg.textContent = err.message;
    btn.disabled = false;
  }
});

const tx = () => I18N_X[lang];

const sideName = (c) => (c === "black" ? t().black : t().white);
const moveLabel = (n, c, san) => `${n}${c === "black" ? "…" : "."} ${san}`;
const isOnline = () => !!(data.status && data.status.online);

function filterSig(extra) {
  return [timeClass, platform, range, extra || ""].join("|");
}
function filterParts() {
  const parts = [];
  if (RANGES[range]) parts.push("days=" + RANGES[range]);
  if (timeClass !== "all") parts.push("time_class=" + timeClass);
  if (platform !== "all") parts.push("platform=" + platform);
  return parts;
}

const gv = { sig: null, items: [], total: 0, loading: false, sel: null, report: null, reportFor: null, error: null };

async function loadGameList(append) {
  gv.loading = true;
  const parts = filterParts().concat(["limit=30", "offset=" + (append ? gv.items.length : 0)]);
  try {
    const d = await api("review/games?" + parts.join("&"));
    gv.items = append ? gv.items.concat(d.games) : d.games;
    gv.total = d.total;
    gv.error = null;
    if (!append) {
      // Gewaehlte Partie behalten, wenn sie noch in der Liste ist - sonst die
      // juengste analysierte, damit gleich etwas zu sehen ist.
      if (!gv.items.some((g) => g.id === gv.sel)) {
        const first = gv.items.find((g) => g.analyzed);
        gv.sel = first ? first.id : null;
      }
    }
  } catch (err) {
    gv.error = err.message;
  } finally {
    gv.loading = false;
  }
  renderGamesView();
  if (gv.sel && gv.reportFor !== gv.sel) loadReport(gv.sel);
}

async function loadReport(id, scroll) {
  gv.sel = id;
  gv.reportFor = id;
  gv.report = "loading";
  renderGamesView();
  try { gv.report = await api("review/games/" + id); }
  catch { gv.report = "error"; }
  renderGamesView();
  if (scroll) {
    const el = $id("gvReport");
    if (el && window.innerWidth < 900) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

function gradeCls(g) { return g ? "g-" + g : "g-none"; }

function renderGamesView() {
  if (view !== "games") return;
  const L = t(), X = tx();
  if (gv.sig !== filterSig() && !gv.loading) {
    gv.sig = filterSig();
    loadGameList(false);
  }
  $id("gvListTitle").textContent = X.gvListTitle;
  $id("gvListIntro").textContent = X.gvListIntro;
  let html = "";
  if (gv.error) html = `<p class="note err">${esc(L.noData(gv.error))}</p>`;
  else if (!gv.items.length) html = `<p class="muted">${gv.loading ? esc(L.loading) : esc(X.gvEmpty)}</p>`;
  else {
    html = `<div class="gl">` + gv.items.map((g) => {
      const tag = `<span class="tag ${g.result === "win" ? "win" : g.result === "loss" ? "loss" : ""}">${esc(L[g.result] || g.result)}</span>`;
      const pills = g.analyzed
        ? g.phases.map((p) => `<span class="ph ${gradeCls(p.grade)}" title="${esc(phaseName(p.phase))}${p.accuracy != null ? " " + p.accuracy + "%" : ""}">` +
            `${esc(X.gvShort[p.phase])} ${p.accuracy != null ? Math.round(p.accuracy) : "–"}</span>`).join("")
        : `<span class="muted">${esc(L.notAnalysed.replace(/^ · /, ""))}</span>`;
      return `<button type="button" class="gl-item${g.id === gv.sel ? " on" : ""}" data-game="${g.id}">
        <span class="gl-top">${tag} <strong>${esc(g.opponent || "?")}</strong>${g.opponent_rating ? ` <span class="muted">(${g.opponent_rating})</span>` : ""}
          <span class="dot ${g.color}" title="${esc(sideName(g.color))}"></span></span>
        <span class="gl-mid muted">${esc(date(g.played_at))} · ${esc(L[g.time_class] || g.time_class)}${g.opening ? " · " + esc(g.opening) : ""}</span>
        <span class="gl-pills">${pills}</span>
      </button>`;
    }).join("") + `</div>`;
    if (gv.items.length < gv.total)
      html += `<button class="btn gl-more" type="button" data-gmore="1">${esc(X.gvMore)} (${gv.items.length}/${gv.total})</button>`;
  }
  $id("gvList").innerHTML = html;
  $id("gvReport").innerHTML = reportHtml();
}

function reportHtml() {
  const L = t(), X = tx(), r = gv.report;
  if (!gv.sel) return `<div class="card"><p class="muted">${esc(X.gvPick)}</p></div>`;
  if (r === "loading" || r == null) return `<div class="card"><p class="muted">${esc(L.loading)}</p></div>`;
  if (r === "error") return `<div class="card"><p class="muted">${esc(L.noData("404"))}</p></div>`;
  const g = r.game;
  const tag = `<span class="tag ${g.result === "win" ? "win" : g.result === "loss" ? "loss" : ""}">${esc(L[g.result] || g.result)}</span>`;
  const link = g.url && g.platform !== "pgn"
    ? `<a href="${esc(g.url)}" target="_blank" rel="noreferrer">${esc(X.gvOpenOn(L[g.platform] || g.platform))}</a>` : "";
  let head = `<div class="card">
    <div class="rp-head">
      <div><h2>${tag} ${esc(X.gvVs(g.opponent || "?", g.opponent_rating))}</h2>
      <p class="muted">${esc(sideName(g.color))} · ${esc(L[g.time_class] || g.time_class)}${g.time_control ? " " + esc(g.time_control) : ""} · ${esc(date(g.played_at))}${g.opening ? " · " + esc(g.opening_name || g.opening) : ""}</p></div>
      <div class="rp-link">${link}</div>
    </div>`;
  if (!g.analyzed) return head + `<p class="muted">${esc(g.analysis_error ? L.failed(g.analysis_error) : X.gvNotAnalysed)}</p></div>`;
  const best = r.best_phase ? phaseName(r.best_phase) : null, worst = r.worst_phase ? phaseName(r.worst_phase) : null;
  head += `<p class="rp-sum">${X.gvSummary(num(r.accuracy, 0), best, worst)}${g.accuracy_platform != null ? esc(X.gvPlatformAcc(L[g.platform] || g.platform, num(g.accuracy_platform, 0))) : ""}</p>`;
  head += `<div class="ph-grid">` + r.phases.map((p) => phaseTile(p, g.time_class)).join("") + `</div></div>`;

  const chart = `<div class="card"><h2>${esc(X.gvChartTitle)}</h2><p class="muted">${esc(X.gvChartNote)}</p>${evalChart(r)}</div>`;

  let moments = "";
  if (r.turning_point) {
    const tp = r.turning_point;
    moments += `<div class="row"><div class="row-top"><strong>${esc(X.gvTurning)}</strong></div>
      <p class="rp-p">${X.gvTurningText(esc(moveLabel(tp.move_number, tp.color, tp.san)), num(tp.win_before, 0), num(tp.win_after, 0))}${tp.best_move_san ? esc(X.gvBestWas(tp.best_move_san)) : ""}${boardButton(tp.id)}</p>${boardSlot(tp.id)}</div>`;
  }
  const gifts = r.opponent_gifts || [];
  moments += `<div class="row"><div class="row-top"><strong>${esc(X.gvGifts)}</strong></div>` +
    (gifts.length
      ? `<p class="rp-p">${esc(X.gvGiftsText(gifts.length, gifts.filter((x) => x.used).length))}</p><ul class="rp-list">` +
        gifts.map((x) => `<li class="${x.used ? "ok" : "miss"}">${esc(X.gvGift(x.move_number, num(x.gain, 0), num(x.win_after, 0)))}` +
          `${esc(x.used ? X.gvGiftUsed(x.reply_san) : X.gvGiftMissed(x.reply_san, x.reply_best))}` +
          `${x.used ? "" : boardButton(x.reply_id)}${x.used ? "" : boardSlot(x.reply_id)}</li>`).join("") + `</ul>`
      : `<p class="rp-p muted">${esc(X.gvGiftsNone)}</p>`) + `</div>`;
  const momentsCard = `<div class="card"><div class="rows">${moments}</div></div>`;

  const errs = r.errors || [];
  const errCard = `<div class="card"><h2>${esc(X.gvErrors)}</h2>` + (errs.length
    ? `<div class="items" style="max-height:none;margin-top:10px">` + errs.map((e) => {
        const kind = e.error_type && L.errors[e.error_type] ? L.errors[e.error_type] : "";
        const missed = e.missed_motif && L.missed[e.missed_motif] ? L.missed[e.missed_motif] : "";
        return `<div class="item">
          <p><span class="tag ${e.category}">${esc(L[e.category] || e.category)}</span> <strong>${esc(moveLabel(e.move_number, e.color, e.san))}</strong>${kind ? " · " + esc(kind) : ""}${missed ? " · " + esc(missed) : ""} · ${esc(phaseName(e.phase))}${e.category !== "inaccuracy" ? checklistTag(e.error_type, e.missed_motif) : ""}</p>
          <p>${esc(X.gvWin(num(e.win_before, 0), num(e.win_after, 0)))}${e.best_move_san ? esc(X.gvBestWas(e.best_move_san)) : ""}${e.refutation_san ? esc(X.gvReply(e.refutation_san)) : ""}${e.seconds_spent != null && g.time_class !== "daily" ? esc(X.gvSpent(secs(e.seconds_spent))) : ""}${boardButton(e.id)}</p>
          ${boardSlot(e.id)}</div>`;
      }).join("") + `</div>`
    : `<p class="muted">${esc(X.gvNoErrors)}</p>`) + `</div>`;
  return head + chart + momentsCard + errCard;
}

function phaseTile(p, timeClass) {
  const L = t(), X = tx();
  if (!p.reached) return `<div class="ph-tile g-none"><div class="ph-name">${esc(phaseName(p.phase))}</div>
    <div class="ph-acc muted">–</div><p class="muted">${esc(X.gvNotReached)}</p></div>`;
  const grade = p.grade ? `<span class="tag grade ${p.grade}">${esc(X.grade[p.grade])}</span>` : "";
  const cmp = p.accuracy == null ? X.gvTooShort
    : p.percentile != null ? X.gvPct(p.percentile, L[timeClass] || timeClass, num(p.your_median, 0)) : X.gvNoRef;
  return `<div class="ph-tile ${gradeCls(p.grade)}">
    <div class="ph-name">${esc(phaseName(p.phase))} <span class="muted">${esc(X.gvMoves(p.from_move, p.to_move))}</span></div>
    <div class="ph-acc">${p.accuracy != null ? num(p.accuracy, 0) + "<small>%</small>" : "–"} ${grade}</div>
    <p class="muted">${esc(cmp)}</p>
    <p>${esc(X.gvErrCounts(p.blunders, p.mistakes, p.inaccuracies))}</p>
    <p class="muted">${esc(X.gvWin(num(p.win_start, 0), num(p.win_end, 0)))}</p>
  </div>`;
}

function evalChart(r) {
  const pts = r.curve || [];
  if (pts.length < 2) return "";
  const W = 640, H = 180, padL = 30, padR = 8, padT = 8, padB = 20;
  const maxPly = Math.max(...pts.map((p) => p.ply), 1);
  const x = (ply) => padL + (ply / maxPly) * (W - padL - padR);
  const y = (w) => padT + (1 - w / 100) * (H - padT - padB);
  // Phasen als Baender: zusammenhaengende Abschnitte derselben Phase.
  let bands = "", start = pts[0], prev = pts[0];
  const flush = (a, b) => {
    bands += `<rect class="band ${a.phase}" x="${x(a.ply).toFixed(1)}" y="${padT}" width="${Math.max(0, x(b.ply) - x(a.ply)).toFixed(1)}" height="${H - padT - padB}"/>`;
  };
  for (const p of pts.slice(1)) {
    if (p.phase !== start.phase) { flush(start, prev); start = prev; start = { ...prev, phase: p.phase }; }
    prev = p;
  }
  flush(start, prev);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(p.ply).toFixed(1)},${y(p.win).toFixed(1)}`).join(" ");
  const area = `${line} L${x(pts[pts.length - 1].ply).toFixed(1)},${y(0)} L${x(pts[0].ply).toFixed(1)},${y(0)} Z`;
  const dots = pts.filter((p) => p.category).map((p) =>
    `<circle class="dot-${p.category}" cx="${x(p.ply).toFixed(1)}" cy="${y(p.win).toFixed(1)}" r="5"><title>${esc(moveLabel(p.move_number, r.game.color, p.san))} · ${p.win}%</title></circle>`).join("");
  const grid = [0, 50, 100].map((v) => `<line class="grid-ln" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/>` +
    `<text class="ax" x="${padL - 5}" y="${y(v) + 4}">${v}</text>`).join("");
  const ticks = [];
  for (let m = 10; m * 2 <= maxPly; m += 10) ticks.push(`<text class="ax mid" x="${x(m * 2 - 1).toFixed(1)}" y="${H - 5}">${m}</text>`);
  const legend = ["opening", "middlegame", "endgame"].filter((ph) => pts.some((p) => p.phase === ph))
    .map((ph) => `<span><i class="band-key ${ph}"></i>${esc(phaseName(ph))}</span>`).join("");
  return `<svg class="evc" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tx().gvChartTitle)}">
    ${bands}${grid}${ticks.join("")}<path class="area" d="${area}"/><path class="ln" d="${line}"/>${dots}</svg>
    <div class="evc-key">${legend}<span><i class="dk blunder"></i>${esc(t().blunder)}</span><span><i class="dk mistake"></i>${esc(t().mistake)}</span><span><i class="dk inaccuracy"></i>${esc(t().inaccuracy)}</span></div>`;
}

  get(id) { try { return JSON.parse(localStorage.getItem("knightmare.drill") || "{}")[id] || null; } catch { return null; } },
  set(id, ok) {
    try {
      const all = JSON.parse(localStorage.getItem("knightmare.drill") || "{}");

      localStorage.setItem("knightmare.drill", JSON.stringify(all));
    } catch { /* egal */ }

  if (view !== "journey") return;

  // Die Checkliste steht immer da, auch ohne Daten.
  const cur = d && d.current;

    const step = J.steps[p];

  if (jr.error) { $id("jrWeek").innerHTML = `<p class="note err">${esc(L.noData(jr.error))}</p>`; return; }

  const prev = d.previous;

    $id("jrWeek").innerHTML = `<p class="muted">${esc(J.weekEmpty)}</p>`;

    const hl = (d.highlights || []).map((h) => `<li>${esc(J.hl[h.key](h))}</li>`).join("");

      <div class="grid">
        ${kpi(`${cur.blunder_free}<span class="muted">/${cur.games}</span>`, J.kpi.bf, J.kpi.bfSub(`${prev.blunder_free}/${prev.games}`))}
        ${kpi(cur.clean, J.kpi.clean, J.kpi.cleanSub)}
        ${kpi(cur.longest_run, J.kpi.run, J.kpi.runSub)}
        ${d.daily_streak ? kpi(d.daily_streak, J.kpi.daily, J.kpi.dailySub) : ""}
      </div>
      <div class="jr-goal"><p>${esc(J.goal(goal.done, goal.target))}</p>${bar(pct, 100, "good")}
        ${goal.done >= goal.target ? `<p class="jr-ok"><strong>${esc(J.goalDone)}</strong></p>` : ""}</div>`;
  }

  $id("jrTrend").innerHTML = `<div class="rows jr-weeks">` + d.weeks.slice().reverse().map((w) =>
    `<div class="row"><div class="row-top"><span>${esc(J.trendRow(date(w.start)))}</span>
      <span class="muted">${w.games ? `${w.blunder_free_pct}% · ${esc(J.trendGames(w.games))}` : "–"}</span></div>
      ${bar(w.blunder_free_pct || 0, 100, "good")}</div>`).join("") + `</div>`;

  const parts = [];
  if (d.lesson && d.lesson.worst) {
    const w = d.lesson.worst, q = w.point ? J.steps[w.point].q : null;
    parts.push(`<div class="item"><p><strong>${esc(J.lesson)}</strong></p>
      <p>${esc(J.lessonText(d.lesson.opponent || "?", moveLabel(w.move_number, d.lesson.color, w.san), q))}
       · <a href="#games" data-report="${d.lesson.id}">${esc(tx().gvOpenReport)}</a></p></div>`);
  }
  if (d.best && d.best.accuracy != null) {
    parts.push(`<div class="item"><p><strong>${esc(J.best)}</strong></p>
      <p>${esc(J.bestText(d.best.opponent || "?", Math.round(d.best.accuracy)))}
       · <a href="#games" data-report="${d.best.id}">${esc(tx().gvOpenReport)}</a></p></div>`);
  }
  const brief = d.brief && d.brief.enabled
    ? `<p class="muted">${esc(J.brief(d.brief.hour))} <button class="linkbtn" type="button" data-jrbrief="1">${esc(J.briefSend)}</button> ${esc(jr.briefMsg)}</p>` : "";
  $id("jrVideo").innerHTML = (parts.length ? `<div class="items" style="max-height:none">${parts.join("")}</div>` : `<p class="muted">${esc(J.videoNone)}</p>`) + brief;
}

function renderOpeningsView() {

  renderOpeningMistakes();
  if (rp.sig !== sig && !rp.loading) {
    rp.sig = sig;
    loadLeaks();
  }
  const tsig = filterSig(treeColor());
  if (rp.treeSig !== tsig && !rp.treeLoading) {

  $id("treeIntro").textContent = X.treeIntro;
  renderLeaks();
  renderTree();
  renderDrill();
}

  const rows = d.leaks || [];

  btn.textContent = X.drillAll(rows.length);
  if (!rows.length) {
    $id("leakSummary").innerHTML = "";
    $id("leakRows").innerHTML = `<p class="muted">${esc(X.leakNone)}${d.single_errors ? esc(X.leakSingles(d.single_errors)) : ""}</p>`;
    return;
