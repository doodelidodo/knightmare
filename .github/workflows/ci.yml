name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends stockfish
          which stockfish || ls -l /usr/games/stockfish

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q app

      # Starts a real engine and checks all seven mistake categories against
      # purpose-built positions.
      - name: Self-test
        run: python -m app.selftest

  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: test
    # Pull requests build nothing - they have no permission to publish.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image has to pass the same test the source did.
      - name: Self-test inside the published image
        run: |
          docker run --rm ghcr.io/${{ github.repository }}:sha-$(git rev-parse --short HEAD) \
            python -m app.selftest
