# Knightmare - one container, no database to set up.
#
#   CHESSCOM_USERNAME=yourname docker compose up -d
#   LICHESS_USERNAME=yourname  docker compose up -d   (or both)
#   open http://localhost:8000
#
services:
  knightmare:
    # Use the published image, or comment it out and uncomment "build" to
    # build from source.
    image: ghcr.io/doodelidodo/knightmare:latest
    # build: .
    container_name: knightmare
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # At least one of the two is required.
      CHESSCOM_USERNAME: ${CHESSCOM_USERNAME:-}
      LICHESS_USERNAME: ${LICHESS_USERNAME:-}
      # Optional: raises the Lichess rate limit, not needed for normal use.
      LICHESS_TOKEN: ${LICHESS_TOKEN:-}
      # A recognisable user agent is strongly recommended - Chess.com rejects
      # anonymous requests with 403.
      CHESS_USER_AGENT: "${CHESS_USER_AGENT:-knightmare/1.0 (self-hosted)}"
      CHESS_BACKFILL_MONTHS: ${CHESS_BACKFILL_MONTHS:-6}
      CHESS_SYNC_INTERVAL_HOURS: ${CHESS_SYNC_INTERVAL_HOURS:-6}
      CHESS_ENGINE_MOVETIME: ${CHESS_ENGINE_MOVETIME:-0.15}
      CHESS_ENGINE_THREADS: ${CHESS_ENGINE_THREADS:-2}
      CHESS_MAX_GAMES_PER_RUN: ${CHESS_MAX_GAMES_PER_RUN:-40}
    volumes:
      - knightmare_data:/app/data
    restart: unless-stopped

volumes:
  knightmare_data:
